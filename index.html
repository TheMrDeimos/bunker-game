    tabCreate.className='tab active'; tabJoin.className='tab';
    body.innerHTML='';
    body.appendChild(el('p',{text:'Впиши имена игроков, которые будут участвовать (от '+MIN_PLAYERS+' до '+MAX_PLAYERS+'). Поле можно оставить пустым — такой игрок просто не попадёт в игру: он не будет ходить, раскрывать характеристики и участвовать в голосованиях.'}));
    const grid = el('div',{class:'grid6'});
    const inputs = [];
    for(let i=0;i<MAX_PLAYERS;i++){
      const wrap = el('div');
      wrap.appendChild(el('label',{text:'Игрок '+(i+1)+' (можно оставить пустым)'}));
      const inp = el('input',{type:'text', placeholder:'Имя — или оставь пустым'});
      inp.setAttribute('maxlength','16');
      inputs.push(inp);
      wrap.appendChild(inp);
      grid.appendChild(wrap);
    }
    body.appendChild(grid);
    const btn = el('button',{class:'primary', text:'Создать игру'});
    const err = el('div',{class:'error-msg', text:''});
    btn.onclick = ()=>{
      const names = inputs.map(i=>i.value.trim()).filter(v=>v.length>0);
      if(names.length < MIN_PLAYERS){
        err.textContent = 'Впиши хотя бы '+MIN_PLAYERS+' имени — иначе бункер сразу окажется полным, и играть будет не в кого.';
        return;
      }
      if(names.length > MAX_PLAYERS){
        err.textContent = 'Максимум '+MAX_PLAYERS+' игроков за одну игру.';
        return;
      }
      const s = makeGame(names);
      const code = genRoomCode();
      db.ref('rooms/'+code).set(s).then(()=>{
        history.replaceState(null,'', location.pathname + '?room=' + code);
        subscribeRoom(code);
      }).catch(e=>{ err.textContent = 'Ошибка записи в базу: '+e.message; });
    };
    body.appendChild(el('div',{class:'row', style:'margin-top:6px'},[btn]));
    body.appendChild(err);
  }

  function showJoin(){
    tabJoin.className='tab active'; tabCreate.className='tab';
    body.innerHTML='';
    body.appendChild(el('p',{text:'Введите 4-значный код комнаты, который прислал организатор игры.'}));
    const inp = el('input',{type:'text', placeholder:'НАПР. A4F2', style:'text-transform:uppercase; letter-spacing:4px; text-align:center; font-size:20px;'});
    inp.setAttribute('maxlength','4');
    body.appendChild(inp);
    const btn = el('button',{class:'primary', text:'Войти в игру'});
    const err = el('div',{class:'error-msg', text:''});
    btn.onclick = ()=>{
      const code = inp.value.trim().toUpperCase();
      if(code.length!==4){ err.textContent='Код должен состоять из 4 символов.'; return; }
      db.ref('rooms/'+code).get().then(snap=>{
        if(snap.exists()){
          history.replaceState(null,'', location.pathname + '?room=' + code);
          subscribeRoom(code);
        } else {
          err.textContent = 'Комната с таким кодом не найдена.';
        }
      }).catch(e=>{ err.textContent = 'Ошибка: '+e.message; });
    };
    body.appendChild(el('div',{class:'row', style:'margin-top:10px'},[btn]));
    body.appendChild(err);
  }

  tabCreate.onclick = showCreate;
  tabJoin.onclick = showJoin;
  showCreate();

  const rules = el('details',{class:'panel', 'data-tag':'Инструктаж'});
  rules.appendChild(el('summary',{text:'Как это работает'}));
  rules.appendChild(el('div',{class:'rules-body', html:`
    Случилась катастрофа. Группа выживших нашла укрытие — какое именно, решает случай: это может быть
    бункер, военная база, крепкий дом, деревня, больница, школа и т.д. У убежища ограниченное число мест
    и от ${MIN_PLAYERS} до ${MAX_PLAYERS} претендентов. Число мест зависит от того, сколько всего игроков
    участвует: 4→2, 5→3, 6→3, 7→3, 8→4, 9→4, 10→5.<br><br>
    <b>Раскрытие.</b> На своём ходу игрок сам решает, какую из ещё скрытых характеристик показать всем
    (профессия, здоровье, хобби, фобия, багаж, секрет, пол, возраст, ориентация).<br><br>
    <b>Цикл игры.</b> Число раундов раскрытия перед каждым голосованием подстраивается под то, сколько
    всего исключений нужно провести: чем меньше игроков придётся выгнать, тем длиннее и содержательнее
    будет каждый цикл раскрытия.<br><br>
    <b>Голосование.</b> Обсудите вслух или в чате, кто менее полезен для выживания группы, затем каждый
    по очереди голосует. Игрок с наибольшим числом голосов выбывает и сразу же полностью раскрывается —
    его характеристики становятся видны всем. Если голоса разделились поровну — никого не исключают,
    даётся ещё один раунд раскрытия, и голосование проводится заново. В любой момент можно предложить
    досрочное голосование или, наоборот, продлить раскрытие вместо голосования — но для этого нужно
    согласие <b>всех</b> живых игроков; если хоть один против, всё продолжается как было.<br><br>
    <b>Скрытые твисты.</b> После одного-двух исключений (зависит от числа игроков) всем внезапно
    открывается неожиданная подробность об убежище или катастрофе — она может изменить расклад сил.<br><br>
    <b>Распределение обязанностей.</b> Как только остаётся нужное число выживших, они по очереди
    распределяют между собой обязанности (провизия и вода, ремонт и энергетика, медицина, безопасность,
    будущее общины) — от этого будет зависеть, как они справятся с тем, что случится дальше.<br><br>
    <b>Три ночи до рассвета.</b> После распределения обязанностей начинаются три решающие фазы. В каждой
    происходит новое событие (нападение, поломка, находка и т.п.), и каждый выживший по очереди выбирает,
    что делать: <b>Действие</b> (что-то починить, построить, наладить), <b>Сбор</b> (раздобыть припасы,
    рискуя нарваться на опасность) или <b>Атака</b> (встретить угрозу и прикрыть остальных). Исход зависит
    от характеристик игроков, их обязанностей и типа события — кто-то может погибнуть.<br><br>
    <b>Изгнанники.</b> Игроки, выбывшие ранее по голосованию, не просто наблюдают: в каждой из трёх фаз
    они решают — помочь оставшимся (небольшой бонус против события, а если кто-то из выживших погибнет —
    шанс вернуться и занять его место) или вредить им (небольшой штраф выжившим). Так что даже выбывание
    не означает конец игры.<br><br>
    <b>Рассвет.</b> После трёх фаз подводится итог — какие обязанности с чем справились, что происходило
    по ночам, и выживет ли группа в итоге.<br><br>
    <span class="tiny">Все данные хранятся в общей базе данных на время игры — это игра на доверии между друзьями, а не защищённая система.</span>
  `}));
  rail.appendChild(rules);
}

/* ---------------- Особые способности: UI ---------------- */

function renderAbilityPanel(app, s, myIdx){
  const me = s.p[myIdx];
  const usesLeft = MAX_ABILITY_USES - (me.au||0);
  const abUsed = Array.isArray(me.abUsed) ? me.abUsed : [];
  const abilityPanel = el('div',{class:'panel fade-in-up', 'data-tag':'Особые способности'});
  abilityPanel.appendChild(el('p',{class:'tiny', text:'Доступно использований: '+usesLeft+' из '+MAX_ABILITY_USES+'. Каждую свою способность можно применить только один раз, и не больше одной способности за один ход.'}));

  if(usesLeft<=0){
    abilityPanel.appendChild(el('p',{class:'tiny', text:'Способности закончились — играй дальше обычным ходом ниже.'}));
    app.appendChild(abilityPanel);
    return;
  }

  if(s.turnAbilityUsed){
    abilityPanel.appendChild(el('p',{class:'tiny', text:'В этот ход способность уже применялась. Новую можно будет использовать со следующего своего хода.'}));
    app.appendChild(abilityPanel);
    return;
  }

  const myAbilities = (me.ab||[]).map(id=>abilityById(id)).filter(Boolean);
  myAbilities.forEach(ab=>{
    const row = el('div',{style:'border-bottom:1px solid var(--line-soft); padding:10px 0;'});
    row.appendChild(el('div',{style:'font-family:Oswald,sans-serif; letter-spacing:1px; color:var(--amber);', text:ab.name}));
    row.appendChild(el('p',{class:'tiny', style:'margin:4px 0 8px;', text:ab.desc}));

    if(abUsed.includes(ab.id)){
      row.appendChild(el('p',{class:'tiny', text:'Уже использована в этой игре.'}));
      abilityPanel.appendChild(row);
      return;
    }

    const phaseOk = !ab.phase ||
      (ab.phase==='vote' && s.ph==='vote') ||
      (ab.phase==='reveal' && (s.ph==='reveal' || s.ph==='tiebreak'));

    if(!phaseOk){
      row.appendChild(el('p',{class:'tiny', text:'Недоступно в текущей фазе.'}));
      abilityPanel.appendChild(row);
      return;
    }

    const holder = el('div');
    row.appendChild(holder);
    abilityPanel.appendChild(row);
    renderAbilityControls(holder, ab, s, myIdx);
  });

  app.appendChild(abilityPanel);
}

function renderAbilityControls(holder, ab, s, myIdx){
  const useBtn = el('button',{class:'ghost', text:'Использовать: '+ab.name});
  const formArea = el('div',{style:'display:none; margin-top:8px;'});
  holder.appendChild(useBtn);
  holder.appendChild(formArea);
  useBtn.onclick = ()=>{
    useBtn.style.display = 'none';
    formArea.style.display = 'block';
    buildAbilityForm(formArea, ab, s, myIdx);
  };
}

function buildAbilityForm(container, ab, s, myIdx){
  container.innerHTML = '';

  const confirmAndApply = (mutator, logText)=>{
    const next = JSON.parse(JSON.stringify(s));
    mutator(next);
    next.p[myIdx].au = (next.p[myIdx].au||0) + 1;
    next.p[myIdx].abUsed = Array.isArray(next.p[myIdx].abUsed) ? next.p[myIdx].abUsed.slice() : [];
    if(!next.p[myIdx].abUsed.includes(ab.id)) next.p[myIdx].abUsed.push(ab.id);
    next.turnAbilityUsed = true; // не более одной способности за ход
    pushLog(next, logText || ('⚡ '+s.p[myIdx].n+' использовал(а) способность «'+ab.name+'».'), 'ability');
    pushState(next);
  };

  if(ab.type==='reveal_other' || ab.type==='peek_other'){
    const targetSel = el('select');
    targetSel.appendChild(el('option',{value:'', text:'Выбери игрока'}));
    s.p.forEach((pl,i)=>{ if(!pl.e && i!==myIdx) targetSel.appendChild(el('option',{value:i, text:pl.n})); });
    container.appendChild(targetSel);

    const catSel = el('select');
    catSel.appendChild(el('option',{value:'', text:'Сначала выбери игрока'}));
    container.appendChild(catSel);

    targetSel.onchange = ()=>{
      const ti = parseInt(targetSel.value);
      catSel.innerHTML = '';
      if(isNaN(ti)){ catSel.appendChild(el('option',{value:'', text:'Сначала выбери игрока'})); return; }
      const hiddenCats = [];
      for(let c=0;c<CATS.length;c++){ if(!((s.p[ti].r>>c)&1)) hiddenCats.push(c); }
      if(hiddenCats.length===0){ catSel.appendChild(el('option',{value:'', text:'У него уже всё раскрыто'})); return; }
      catSel.appendChild(el('option',{value:'', text:'Выбери характеристику'}));
      hiddenCats.forEach(c=>catSel.appendChild(el('option',{value:c, text:CATS[c]})));
    };

    const btn = el('button',{class:'primary', text:'Подтвердить'});
    btn.onclick = ()=>{
      const ti = parseInt(targetSel.value), ci = parseInt(catSel.value);
      if(isNaN(ti) || isNaN(ci)) return;
      if(ab.type==='reveal_other'){
        confirmAndApply(next=>{
          next.p[ti].r = next.p[ti].r | (1<<ci);
        }, '🔭 '+s.p[myIdx].n+' раскрыл(а) через «Разведку»: у '+s.p[ti].n+' — '+CATS[ci]+' = «'+s.p[ti].v[ci]+'».');
      } else {
        confirmAndApply(next=>{
          next.peeks = next.peeks || [];
          next.peeks.push({viewer:myIdx, target:ti, cat:ci});
        }, '🕵️ '+s.p[myIdx].n+' использовал(а) способность «Тайный осведомитель» (что именно узнал(а) — не разглашается).');
      }
    };
    container.appendChild(btn);

  } else if(ab.type==='reroll_own'){
    const mask = s.p[myIdx].r;
    const hidden = [];
    for(let c=0;c<CATS.length;c++){ if(!((mask>>c)&1)) hidden.push(c); }
    if(hidden.length===0){
      container.appendChild(el('p',{class:'tiny', text:'У тебя уже всё раскрыто — нечего менять.'}));
      return;
    }
    const catSel = el('select');
    catSel.appendChild(el('option',{value:'', text:'Какую характеристику пересдать?'}));
    hidden.forEach(c=>catSel.appendChild(el('option',{value:c, text:CATS[c]})));
    container.appendChild(catSel);
    const btn = el('button',{class:'primary', text:'Подтвердить'});
    btn.onclick = ()=>{
      const ci = parseInt(catSel.value);
      if(isNaN(ci)) return;
      confirmAndApply(next=>{
        const newVal = rerollValueFor(next, ci);
        if(newVal!==null) next.p[myIdx].v[ci] = newVal;
      }, '🔄 '+s.p[myIdx].n+' пересдал(а) свою характеристику «'+CATS[ci]+'» (новое значение остаётся скрытым).');
    };
    container.appendChild(btn);

  } else if(ab.type==='cancel_vote'){
    const voters = s.p.map((pl,i)=>i).filter(i=>!s.p[i].e && s.vt[i]>=0);
    if(voters.length===0){
      container.appendChild(el('p',{class:'tiny', text:'Пока никто не проголосовал в этом раунде.'}));
      return;
    }
    const voterSel = el('select');
    voterSel.appendChild(el('option',{value:'', text:'Чей голос аннулировать?'}));
    voters.forEach(i=>voterSel.appendChild(el('option',{value:i, text:s.p[i].n+' → '+s.p[s.vt[i]].n})));
    container.appendChild(voterSel);
    const btn = el('button',{class:'danger', text:'Подтвердить'});
    btn.onclick = ()=>{
      const vi = parseInt(voterSel.value);
      if(isNaN(vi)) return;
      confirmAndApply(next=>{ next.vt[vi] = -1; }, '🚫 '+s.p[myIdx].n+' аннулировал(а) голос игрока '+s.p[vi].n+'.');
    };
    container.appendChild(btn);

  } else if(ab.type==='shield_self'){
    container.appendChild(el('p',{class:'tiny', text:'Щит защитит тебя при следующем подсчёте голосов в этом раунде.'}));
    const btn = el('button',{class:'primary', text:'Активировать щит'});
    btn.onclick = ()=>{
      confirmAndApply(next=>{ next.p[myIdx].shield = true; }, '🛡 '+s.p[myIdx].n+' активировал(а) щит.');
    };
    container.appendChild(btn);

  } else if(ab.type==='extend_reveal'){
    container.appendChild(el('p',{class:'tiny', text:'Раскрытие продлится ещё на один раунд перед автоматическим переходом к голосованию.'}));
    const btn = el('button',{class:'primary', text:'Отложить голосование'});
    btn.onclick = ()=>{
      confirmAndApply(next=>{ next.rd = Math.max(1, next.rd - 1); }, '⏳ '+s.p[myIdx].n+' отложил(а) голосование ещё на раунд.');
    };
    container.appendChild(btn);

  } else if(ab.type==='reveal_other_double'){
    const targetSel = el('select');
    targetSel.appendChild(el('option',{value:'', text:'Выбери игрока'}));
    s.p.forEach((pl,i)=>{
      if(pl.e || i===myIdx) return;
      let hasHidden=false; for(let c=0;c<CATS.length;c++){ if(!((pl.r>>c)&1)){ hasHidden=true; break; } }
      if(hasHidden) targetSel.appendChild(el('option',{value:i, text:pl.n}));
    });
    container.appendChild(targetSel);
    const btn = el('button',{class:'primary', text:'Раскрыть 2 характеристики'});
    btn.onclick = ()=>{
      const ti = parseInt(targetSel.value);
      if(isNaN(ti)) return;
      const mask = s.p[ti].r;
      const hiddenCats = [];
      for(let c=0;c<CATS.length;c++){ if(!((mask>>c)&1)) hiddenCats.push(c); }
      const picked = shuffle(hiddenCats).slice(0,2);
      const parts = picked.map(c=>CATS[c]+' = «'+s.p[ti].v[c]+'»').join(', ');
      confirmAndApply(next=>{
        picked.forEach(c=>{ next.p[ti].r = next.p[ti].r | (1<<c); });
      }, picked.length ? ('🔭🔭 '+s.p[myIdx].n+' раскрыл(а) через «Двойную разведку» у '+s.p[ti].n+': '+parts+'.') : undefined);
    };
    container.appendChild(btn);

  } else if(ab.type==='reveal_all_category'){
    const catSel = el('select');
    catSel.appendChild(el('option',{value:'', text:'Какую категорию раскрыть у всех?'}));
    CATS.forEach((name,c)=>catSel.appendChild(el('option',{value:c, text:name})));
    container.appendChild(catSel);
    const btn = el('button',{class:'primary', text:'Раскрыть у всех'});
    btn.onclick = ()=>{
      const ci = parseInt(catSel.value);
      if(isNaN(ci)) return;
      confirmAndApply(next=>{
        next.p.forEach(pl=>{ if(!pl.e) pl.r = pl.r | (1<<ci); });
      }, '📡 '+s.p[myIdx].n+' раскрыл(а) через «Массовую слежку» категорию «'+CATS[ci]+'» у всех живых игроков.');
    };
    container.appendChild(btn);

  } else if(ab.type==='peek_other_double'){
    const mkTargetSel = ()=>{
      const sel = el('select');
      sel.appendChild(el('option',{value:'', text:'Выбери игрока'}));
      s.p.forEach((pl,i)=>{ if(!pl.e && i!==myIdx) sel.appendChild(el('option',{value:i, text:pl.n})); });
      return sel;
    };
    const mkCatSel = (targetSel)=>{
      const sel = el('select');
      sel.appendChild(el('option',{value:'', text:'Сначала выбери игрока'}));
      targetSel.onchange = ()=>{
        const ti = parseInt(targetSel.value);
        sel.innerHTML = '';
        if(isNaN(ti)){ sel.appendChild(el('option',{value:'', text:'Сначала выбери игрока'})); return; }
        const hiddenCats = [];
        for(let c=0;c<CATS.length;c++){ if(!((s.p[ti].r>>c)&1)) hiddenCats.push(c); }
        if(hiddenCats.length===0){ sel.appendChild(el('option',{value:'', text:'У него уже всё раскрыто'})); return; }
        sel.appendChild(el('option',{value:'', text:'Выбери характеристику'}));
        hiddenCats.forEach(c=>sel.appendChild(el('option',{value:c, text:CATS[c]})));
      };
      return sel;
    };
    container.appendChild(el('p',{class:'tiny', text:'Первый игрок и характеристика:'}));
    const target1 = mkTargetSel(); container.appendChild(target1);
    const cat1 = mkCatSel(target1); container.appendChild(cat1);
    container.appendChild(el('p',{class:'tiny', style:'margin-top:10px;', text:'Второй игрок и характеристика:'}));
    const target2 = mkTargetSel(); container.appendChild(target2);
    const cat2 = mkCatSel(target2); container.appendChild(cat2);

    const btn = el('button',{class:'primary', style:'margin-top:10px;', text:'Подтвердить'});
    btn.onclick = ()=>{
      const t1=parseInt(target1.value), c1=parseInt(cat1.value);
      const t2=parseInt(target2.value), c2=parseInt(cat2.value);
      if(isNaN(t1)||isNaN(c1)||isNaN(t2)||isNaN(c2)) return;
      confirmAndApply(next=>{
        next.peeks = next.peeks || [];
        next.peeks.push({viewer:myIdx, target:t1, cat:c1});
        next.peeks.push({viewer:myIdx, target:t2, cat:c2});
      }, '🕵️🕵️ '+s.p[myIdx].n+' использовал(а) способность «Двойной осведомитель» (подробности не разглашаются).');
    };
    container.appendChild(btn);

  } else if(ab.type==='swap_trait'){
    const myHidden = [];
    for(let c=0;c<CATS.length;c++){ if(!((s.p[myIdx].r>>c)&1)) myHidden.push(c); }
    if(myHidden.length===0){
      container.appendChild(el('p',{class:'tiny', text:'У тебя уже всё раскрыто — обмениваться нечем.'}));
      return;
    }
    const catSel = el('select');
    catSel.appendChild(el('option',{value:'', text:'Какой своей характеристикой обменяться?'}));
    myHidden.forEach(c=>catSel.appendChild(el('option',{value:c, text:CATS[c]})));
    container.appendChild(catSel);

    const targetSel = el('select');
    targetSel.appendChild(el('option',{value:'', text:'Сначала выбери категорию'}));
    container.appendChild(targetSel);

    catSel.onchange = ()=>{
      const ci = parseInt(catSel.value);
      targetSel.innerHTML = '';
      if(isNaN(ci)){ targetSel.appendChild(el('option',{value:'', text:'Сначала выбери категорию'})); return; }
      const candidates = s.p.map((pl,i)=>i).filter(i=>i!==myIdx && !s.p[i].e && !((s.p[i].r>>ci)&1));
      if(candidates.length===0){ targetSel.appendChild(el('option',{value:'', text:'Ни у кого эта категория не скрыта'})); return; }
      targetSel.appendChild(el('option',{value:'', text:'Выбери игрока'}));
      candidates.forEach(i=>targetSel.appendChild(el('option',{value:i, text:s.p[i].n})));
    };

    const btn = el('button',{class:'primary', text:'Обменяться'});
    btn.onclick = ()=>{
      const ci = parseInt(catSel.value), ti = parseInt(targetSel.value);
      if(isNaN(ci) || isNaN(ti)) return;
      confirmAndApply(next=>{
        const tmp = next.p[myIdx].v[ci];
        next.p[myIdx].v[ci] = next.p[ti].v[ci];
        next.p[ti].v[ci] = tmp;
      }, '🔄 Между '+s.p[myIdx].n+' и '+s.p[ti].n+' произошёл обмен характеристикой «'+CATS[ci]+'» (что именно поменялось — остаётся скрытым).');
    };
    container.appendChild(btn);

  } else if(ab.type==='reroll_other'){
    const targetSel = el('select');
    targetSel.appendChild(el('option',{value:'', text:'Выбери игрока'}));
    s.p.forEach((pl,i)=>{ if(!pl.e && i!==myIdx) targetSel.appendChild(el('option',{value:i, text:pl.n})); });
    container.appendChild(targetSel);

    const catSel = el('select');
    catSel.appendChild(el('option',{value:'', text:'Сначала выбери игрока'}));
    container.appendChild(catSel);

    targetSel.onchange = ()=>{
      const ti = parseInt(targetSel.value);
      catSel.innerHTML = '';
      if(isNaN(ti)){ catSel.appendChild(el('option',{value:'', text:'Сначала выбери игрока'})); return; }
      const hiddenCats = [];
      for(let c=0;c<CATS.length;c++){ if(!((s.p[ti].r>>c)&1)) hiddenCats.push(c); }
      if(hiddenCats.length===0){ catSel.appendChild(el('option',{value:'', text:'У него уже всё раскрыто'})); return; }
      catSel.appendChild(el('option',{value:'', text:'Выбери характеристику'}));
      hiddenCats.forEach(c=>catSel.appendChild(el('option',{value:c, text:CATS[c]})));
    };

    const btn = el('button',{class:'primary', text:'Подменить незаметно'});
    btn.onclick = ()=>{
      const ti = parseInt(targetSel.value), ci = parseInt(catSel.value);
      if(isNaN(ti) || isNaN(ci)) return;
      confirmAndApply(next=>{
        const newVal = rerollValueFor(next, ci);
        if(newVal!==null) next.p[ti].v[ci] = newVal;
      }, '🕶 '+s.p[myIdx].n+' применил(а) «Диверсию»: у '+s.p[ti].n+' незаметно подменена характеристика «'+CATS[ci]+'».');
    };
    container.appendChild(btn);

  } else if(ab.type==='shield_pair'){
    const targetSel = el('select');
    targetSel.appendChild(el('option',{value:'', text:'Кого защитить вместе с собой?'}));
    s.p.forEach((pl,i)=>{ if(!pl.e && i!==myIdx) targetSel.appendChild(el('option',{value:i, text:pl.n})); });
    container.appendChild(targetSel);
    const btn = el('button',{class:'primary', text:'Активировать двойной щит'});
    btn.onclick = ()=>{
      const ti = parseInt(targetSel.value);
      if(isNaN(ti)) return;
      confirmAndApply(next=>{
        next.p[myIdx].shield = true;
        next.p[ti].shield = true;
      }, '🛡🛡 '+s.p[myIdx].n+' активировал(а) двойной щит вместе с '+s.p[ti].n+'.');
    };
    container.appendChild(btn);

  } else if(ab.type==='redirect_vote'){
    const voters = s.p.map((pl,i)=>i).filter(i=>!s.p[i].e && s.vt[i]>=0);
    if(voters.length===0){
      container.appendChild(el('p',{class:'tiny', text:'Пока никто не проголосовал в этом раунде.'}));
      return;
    }
    const voterSel = el('select');
    voterSel.appendChild(el('option',{value:'', text:'Чей голос перенаправить?'}));
    voters.forEach(i=>voterSel.appendChild(el('option',{value:i, text:s.p[i].n+' → '+s.p[s.vt[i]].n})));
    container.appendChild(voterSel);

    const newTargetSel = el('select');
    newTargetSel.appendChild(el('option',{value:'', text:'Сначала выбери голос'}));
    container.appendChild(newTargetSel);

    voterSel.onchange = ()=>{
      const vi = parseInt(voterSel.value);
      newTargetSel.innerHTML = '';
      if(isNaN(vi)){ newTargetSel.appendChild(el('option',{value:'', text:'Сначала выбери голос'})); return; }
      newTargetSel.appendChild(el('option',{value:'', text:'Новая цель голоса'}));
      s.p.forEach((pl,i)=>{ if(!pl.e && i!==vi) newTargetSel.appendChild(el('option',{value:i, text:pl.n})); });
    };

    const btn = el('button',{class:'danger', text:'Перенаправить'});
    btn.onclick = ()=>{
      const vi = parseInt(voterSel.value), nt = parseInt(newTargetSel.value);
      if(isNaN(vi) || isNaN(nt)) return;
      confirmAndApply(next=>{ next.vt[vi] = nt; }, '↪️ '+s.p[myIdx].n+' перенаправил(а) голос '+s.p[vi].n+' на '+s.p[nt].n+'.');
    };
    container.appendChild(btn);

  } else if(ab.type==='clear_all_votes'){
    const anyVotes = s.vt.some(v=>v>=0);
    if(!anyVotes){
      container.appendChild(el('p',{class:'tiny', text:'В этом раунде пока никто не голосовал.'}));
      return;
    }
    container.appendChild(el('p',{class:'tiny', text:'Все голоса, поданные в этом раунде, будут аннулированы — раунд голосования начнётся заново.'}));
    const btn = el('button',{class:'danger', text:'Аннулировать все голоса'});
    btn.onclick = ()=>{
      confirmAndApply(next=>{ next.vt = new Array(next.p.length).fill(-1); }, '🧹 '+s.p[myIdx].n+' аннулировал(а) все голоса этого раунда.');
    };
    container.appendChild(btn);

  } else if(ab.type==='extend_reveal_long'){
    container.appendChild(el('p',{class:'tiny', text:'Раскрытие продлится ещё на два раунда перед автоматическим переходом к голосованию.'}));
    const btn = el('button',{class:'primary', text:'Отложить голосование на 2 раунда'});
    btn.onclick = ()=>{
      confirmAndApply(next=>{ next.rd = Math.max(1, next.rd - 2); }, '⏳⏳ '+s.p[myIdx].n+' отложил(а) голосование сразу на 2 раунда.');
    };
    container.appendChild(btn);

  } else if(ab.type==='reveal_self_extra'){
    const mask = s.p[myIdx].r;
    const hidden = [];
    for(let c=0;c<CATS.length;c++){ if(!((mask>>c)&1)) hidden.push(c); }
    if(hidden.length===0){
      container.appendChild(el('p',{class:'tiny', text:'У тебя уже раскрыто всё, что можно.'}));
      return;
    }
    const catSel = el('select');
    catSel.appendChild(el('option',{value:'', text:'Какую характеристику раскрыть дополнительно?'}));
    hidden.forEach(c=>catSel.appendChild(el('option',{value:c, text:CATS[c]})));
    container.appendChild(catSel);
    const btn = el('button',{class:'primary', text:'Раскрыть дополнительно'});
    btn.onclick = ()=>{
      const ci = parseInt(catSel.value);
      if(isNaN(ci)) return;
      confirmAndApply(next=>{ next.p[myIdx].r = next.p[myIdx].r | (1<<ci); },
        '💨 '+s.p[myIdx].n+' дополнительно раскрыл(а) через «Второе дыхание»: '+CATS[ci]+' = «'+s.p[myIdx].v[ci]+'».');
    };
    container.appendChild(btn);
  }
}

function renderGame(s, code){
  setVfx(s.cx || null);
  document.body.classList.toggle('vote-mode', s.ph === 'vote');

  const app = document.getElementById('app');
  app.innerHTML = '';

  // Каркас в две стороны экрана: слева (col) — то, с чем игрок работает
  // прямо сейчас (ход, действие, карточки игроков), справа (rail) — постоянный
  // контекст: комната, сводка, твисты, хроника. Контекст не мешает действию,
  // а действие не приходится искать скроллом.
  const shell = el('div',{class:'shell'});
  const col = el('div',{class:'col'});
  const rail = el('aside',{class:'rail'});
  shell.appendChild(col);
  shell.appendChild(rail);
  app.appendChild(shell);

  const myIdx = myPlayerIdx(s);

  const badgePanel = el('div',{class:'panel', 'data-tag':'Комната'});
  badgePanel.appendChild(roomBadgeRow(code));
  if(myIdx>=0){
    const idRow = el('div',{class:'row', style:'margin-top:11px; padding-top:10px; border-top:1px solid var(--line-soft); justify-content:space-between;'});
    idRow.appendChild(el('div',{class:'tiny', html:'Ты играешь за: <b style="color:var(--card-own)">'+s.p[myIdx].n+'</b>'}));
    const resetBtn = el('button',{class:'ghost', style:'font-size:10.5px; padding:7px 11px;', text:'Это не я'});
    resetBtn.onclick = ()=>{ if(confirm('Освободить это место? Придётся выбрать его заново.')) releaseSeat(code, myIdx); };
    idRow.appendChild(resetBtn);
    badgePanel.appendChild(idRow);
  }
  col.appendChild(badgePanel);

  const alertPanel = el('div',{class:'panel fade-in-up', 'data-tag':'Сводка ситуации'});
  alertPanel.appendChild(el('div',{class:'alert-ticker', html:'<b>ТРЕВОГА:</b> '+s.c}));
  alertPanel.appendChild(el('div',{class:'bunker-info', text:s.b}));
  rail.appendChild(alertPanel);

  const revealedTwists = Array.isArray(s.twists) ? s.twists.filter(tw=>tw.revealed) : [];
  if(revealedTwists.length>0){
    const twistPanel = el('div',{class:'panel fade-in-up', 'data-tag':'Внезапная подробность'});
    revealedTwists.forEach(tw=>{
      twistPanel.appendChild(el('div',{class:'alert-ticker', style:'border-left-color:var(--neon); margin-bottom:8px;', html:'<b>ТВИСТ:</b> '+tw.text}));
    });
    rail.appendChild(twistPanel);
  }

  if(Array.isArray(s.eventFeed) && s.eventFeed.length>0){
    const feedPanel = el('div',{class:'panel fade-in-up', 'data-tag':'Сводка событий'});
    const list = el('div',{class:'feed-list'});
    s.eventFeed.slice().reverse().forEach(entry=>{
      list.appendChild(el('div',{class:'feed-item kind-'+(entry.kind||'system'), html:entry.text}));
    });
    feedPanel.appendChild(list);
    rail.appendChild(feedPanel);
  }

  if(s.lastProposalNote){
    const notePanel = el('div',{class:'panel fade-in-up', 'data-tag':'Общее решение'});
    notePanel.appendChild(el('div',{class:'alert-ticker', style:'border-left-color:var(--muted); background:none;', text:s.lastProposalNote}));
    rail.appendChild(notePanel);
  }

  const turnIdx = currentTurnPlayer(s);
  const turnName = turnIdx>=0 ? s.p[turnIdx].n : '—';

  if(s.ph==='end'){
    document.getElementById('statusLine').textContent = 'симуляция завершена';
    document.body.classList.remove('vote-mode');
    const panel = el('div',{class:'panel fade-in-up', 'data-tag':'Итог'});
    panel.appendChild(el('div',{class:'verdict-head', text:'Рассвет наступил'}));
    panel.appendChild(el('p',{class:'tiny', style:'margin-bottom:12px;', text:'Двери открыты. В убежище остались:'}));
    const list = el('div',{class:'final-list'});
    s.p.forEach((pl,i)=>{ if(!pl.e) list.appendChild(el('div',{class:'final-item', text:pl.n})); });
    panel.appendChild(list);
    col.appendChild(panel);

    if(s.finalOutcome){
      const outcomePanel = el('div',{class:'panel fade-in-up', 'data-tag':'Судьба общины'});
      outcomePanel.appendChild(el('div',{class:'stamp', text:s.finalOutcome.tierLabel}));
      if(Array.isArray(s.finalOutcome.roleLines) && s.finalOutcome.roleLines.length){
        const rolesBox = el('div',{style:'margin-bottom:12px;'});
        s.finalOutcome.roleLines.forEach(line=>rolesBox.appendChild(el('p',{class:'tiny', style:'margin:4px 0;', text:line})));
        outcomePanel.appendChild(rolesBox);
      }
      if(Array.isArray(s.finalOutcome.eventLines) && s.finalOutcome.eventLines.length){
        const eventsBox = el('div',{style:'margin-bottom:12px; border-top:1px dashed var(--line-soft); padding-top:10px;'});
        s.finalOutcome.eventLines.forEach(line=>eventsBox.appendChild(el('p',{class:'tiny', style:'margin:4px 0;', text:line})));
        outcomePanel.appendChild(eventsBox);
      }
      outcomePanel.appendChild(el('p',{style:'line-height:1.7;', text:s.finalOutcome.text}));
      col.appendChild(outcomePanel);
    }

    const dossierPanel = el('div',{class:'panel fade-in-up','data-tag':'Полное досье'});
    const full = document.createElement('div');
    full.className='roster';
    s.p.forEach((pl,i)=>{
      const card = el('div',{class:'dossier'+(pl.e?' out':'')});
      const nameRow = el('div',{class:'pname'});
      nameRow.appendChild(el('span',{text:pl.n}));
      const jobId = (s.jobs||{})[i];
      if(jobId){
        const role = dutyRoleById(jobId);
        if(role) nameRow.appendChild(el('span',{class:'vote-count', text:role.name}));
      }
      card.appendChild(nameRow);
      for(let c=0;c<CATS.length;c++) card.appendChild(traitRow(c, pl.v[c], true, false));
      full.appendChild(card);
    });
    dossierPanel.appendChild(full);
    col.appendChild(dossierPanel);
    return;
  }

  if(s.ph==='assign'){
    document.body.classList.remove('vote-mode');
    document.getElementById('statusLine').textContent = 'убежище укомплектовано · распределение обязанностей';
    const assignBanner = el('div',{class:'turn-banner'});
    assignBanner.appendChild(el('div',{html:'<span class="cursor">▮</span> Выбирает обязанность: <b>'+turnName+'</b>'}));
    assignBanner.appendChild(el('div',{class:'phase-pill', text:'РАСПРЕДЕЛЕНИЕ'}));
    col.appendChild(assignBanner);
    appendRosterPanel(col, s, myIdx);

    const introPanel = el('div',{class:'panel fade-in-up', 'data-tag':'Последний шаг'});
    introPanel.appendChild(el('p',{text:'Вы заняли все свободные места в убежище. Прежде чем закрыть двери, распределите между собой обязанности — от этого зависит, переживёте ли вы то, что будет дальше.'}));
    const rolesInfo = el('div',{class:'duty-list'});
    DUTY_ROLES.forEach(role=>{
      const takenIdx = Object.keys(s.jobs||{}).map(Number).find(i=>s.jobs[i]===role.id);
      const item = el('div',{class:'duty-item'+(takenIdx!==undefined?' taken':'')});
      const head = el('div',{class:'duty-head'});
      head.appendChild(el('span',{text:role.name}));
      head.appendChild(el('span',{class:'vote-count', text: takenIdx!==undefined ? s.p[takenIdx].n : 'свободно'}));
      item.appendChild(head);
      item.appendChild(el('p',{class:'tiny', text:role.desc}));
      rolesInfo.appendChild(item);
    });
    introPanel.appendChild(rolesInfo);
    col.appendChild(introPanel);

    if(myIdx===-1){
      col.appendChild(el('div',{class:'panel fade-in-up', 'data-tag':'Наблюдение', html:'<p class="tiny">Это устройство не привязано ни к одному из выживших, поэтому здесь только наблюдение за распределением обязанностей.</p>'}));
      return;
    }

    if(myIdx!==turnIdx){
      const waitPanel = el('div',{class:'panel fade-in-up', 'data-tag':'Действие'});
      waitPanel.appendChild(el('p',{class:'tiny', html:'Сейчас свою обязанность выбирает <b>'+turnName+'</b>. Экран обновится сам, когда очередь дойдёт до тебя.'}));
      col.appendChild(waitPanel);
      return;
    }

    const pickPanel = el('div',{class:'panel fade-in-up', 'data-tag':'Твой выбор'});
    pickPanel.appendChild(ownDossierStrip(s, myIdx));
    const freeRoles = DUTY_ROLES.filter(role=>{
      return Object.keys(s.jobs||{}).map(Number).find(i=>s.jobs[i]===role.id) === undefined;
    });
    if(freeRoles.length===0){
      pickPanel.appendChild(el('p',{text:'Все обязанности уже заняты — ты остаёшься универсальным помощником, готовым подстраховать любого.'}));
      const okBtn = el('button',{class:'primary', text:'Понятно, дальше'});
      okBtn.onclick = ()=>{
        const next = JSON.parse(JSON.stringify(s));
        advanceAfterAssign(next);
        pushState(next);
      };
      pickPanel.appendChild(okBtn);
    } else {
      pickPanel.appendChild(el('p',{text:'Какую обязанность берёшь на себя?'}));
      const grid = el('div',{class:'cat-btn-grid'});
      freeRoles.forEach(role=>{
        const b = el('button',{text:role.name});
        b.title = role.desc;
        b.onclick = ()=>{
          const next = JSON.parse(JSON.stringify(s));
          next.jobs = next.jobs || {};
          next.jobs[myIdx] = role.id;
          advanceAfterAssign(next);
          pushState(next);
        };
        grid.appendChild(b);
      });
      pickPanel.appendChild(grid);
    }
    col.appendChild(pickPanel);
    return;
  }

  if(s.ph==='event'){
    document.body.classList.remove('vote-mode');
    const event = s.currentEvent || EVENT_POOL[0];
    document.getElementById('statusLine').textContent = 'событие '+(s.eventPhase||1)+' из '+EVENT_PHASES_TOTAL;

    const evBanner = el('div',{class:'turn-banner'});
    evBanner.appendChild(el('div',{html:'<span class="cursor">▮</span> Выбирает действие: <b>'+turnName+'</b>'}));
    evBanner.appendChild(el('div',{class:'phase-pill', text:'СОБЫТИЕ '+(s.eventPhase||1)+'/'+EVENT_PHASES_TOTAL}));
    col.appendChild(evBanner);

    const eventPanel = el('div',{class:'panel fade-in-up', 'data-tag':'Что произошло'});
    eventPanel.appendChild(el('div',{class:'alert-ticker', html:'<b>СОБЫТИЕ:</b> '+event.text}));
    col.appendChild(eventPanel);

    appendRosterPanel(col, s, myIdx);

    if(myIdx===-1){
      col.appendChild(el('div',{class:'panel fade-in-up', 'data-tag':'Наблюдение', html:'<p class="tiny">Это устройство не привязано ни к одному игроку, поэтому здесь только наблюдение.</p>'}));
      return;
    }

    // ---- Изгнанники (выбывшие раньше по голосованию): у них своя, не привязанная
    // к общей очереди, возможность помочь оставшимся или навредить им в этой фазе ----
    if(s.p[myIdx].e){
      const outcastPanel = el('div',{class:'panel fade-in-up', 'data-tag':'Ты вне поселения'});
      const already = s.outcastChoices && s.outcastChoices[myIdx];
      if(already){
        outcastPanel.appendChild(el('p',{class:'tiny', text: already==='help'
          ? 'Ты решил(а) помочь оставшимся в этой фазе. Если кто-то из них погибнет, у тебя есть шанс вернуться и занять его место.'
          : 'Ты решил(а) вредить оставшимся в этой фазе — это усложнит им жизнь.'
        }));
      } else {
        outcastPanel.appendChild(el('p',{text:'Тебя исключили голосованием, но игра для тебя не окончена. Реши, что делать в эту фазу:'}));
        const helpBtn = el('button',{class:'primary', text:'Помочь'});
        helpBtn.title = 'Небольшой бонус выжившим против события. Если кто-то погибнет, у тебя есть шанс занять его место.';
        helpBtn.onclick = ()=>{
          const next = JSON.parse(JSON.stringify(s));
          next.outcastChoices = next.outcastChoices || {};
          next.outcastChoices[myIdx] = 'help';
          pushState(next);
        };
        const harmBtn = el('button',{class:'danger', style:'margin-left:10px;', text:'Вредить'});
        harmBtn.title = 'Небольшой штраф выжившим — усложняешь им выживание, но сам(а) уже не сможешь вернуться в этой фазе.';
        harmBtn.onclick = ()=>{
          const next = JSON.parse(JSON.stringify(s));
          next.outcastChoices = next.outcastChoices || {};
          next.outcastChoices[myIdx] = 'sabotage';
          pushState(next);
        };
        outcastPanel.appendChild(helpBtn);
        outcastPanel.appendChild(harmBtn);
      }
      col.appendChild(outcastPanel);
      return;
    }

    if(myIdx!==turnIdx){
      const waitPanel = el('div',{class:'panel fade-in-up', 'data-tag':'Действие'});
      waitPanel.appendChild(el('p',{class:'tiny', html:'Сейчас выбирает <b>'+turnName+'</b>. Экран обновится сам, когда очередь дойдёт до тебя.'}));
      col.appendChild(waitPanel);
      return;
    }

    const actPanel = el('div',{class:'panel fade-in-up', 'data-tag':'Твой выбор'});
    actPanel.appendChild(ownDossierStrip(s, myIdx));
    actPanel.appendChild(el('p',{text:'Что делаешь в эту фазу?'}));
    const actGrid = el('div',{class:'cat-btn-grid'});
    EVENT_ACTIONS.forEach(a=>{
      const b = el('button',{text:a.name});
      b.title = a.desc;
      b.onclick = ()=>{
        const next = JSON.parse(JSON.stringify(s));
        next.eventChoices = next.eventChoices || {};
        next.eventChoices[myIdx] = a.id;
        advanceAfterEventChoice(next);
        pushState(next);
      };
      actGrid.appendChild(b);
    });
    actPanel.appendChild(actGrid);
    EVENT_ACTIONS.forEach(a=>{
      actPanel.appendChild(el('p',{class:'tiny', style:'margin:4px 0;', text:a.name+' — '+a.desc}));
    });
    col.appendChild(actPanel);
    return;
  }

  const isRevealLike = (s.ph==='reveal' || s.ph==='tiebreak');
  const isExtendTie = s.ph==='tiebreak' && s.tieReason==='extend';

  document.getElementById('statusLine').textContent =
    s.ph==='tiebreak' ? (isExtendTie ? 'группа попросила продлить раскрытие' : 'ничья при голосовании · доп. раскрытие')
    : (s.ph==='reveal' ? 'фаза раскрытия · раунд '+s.rd : 'фаза голосования · раунд '+s.rd);

  if(s.ph==='tiebreak'){
    const tieNote = el('div',{class:'panel fade-in-up', 'data-tag': isExtendTie ? 'Продление' : 'Ничья'});
    tieNote.appendChild(el('div',{class:'alert-ticker', html: isExtendTie
      ? '<b>ГРУППА ПОПРОСИЛА ВРЕМЯ.</b> Большинство проголосовавших выбрали продлить раскрытие вместо исключения. Каждый на своём ходу раскрывает ещё одну характеристику — после этого голосование начнётся снова.'
      : '<b>ГОЛОСА РАЗДЕЛИЛИСЬ ПОРОВНУ.</b> Никто не исключён. Каждый на своём ходу раскрывает ещё одну характеристику — после этого голосование начнётся снова.'
    }));
    col.appendChild(tieNote);
  }

  const banner = el('div',{class:'turn-banner'});
  banner.appendChild(el('div',{html:'<span class="cursor">▮</span> Ход игрока: <b>'+turnName+'</b>'}));
  banner.appendChild(el('div',{class:'phase-pill', text:
    s.ph==='tiebreak' ? (isExtendTie ? 'ПРОДЛЕНИЕ → РАСКРЫТИЕ' : 'НИЧЬЯ → РАСКРЫТИЕ')
    : (s.ph==='reveal' ? 'РАСКРЫТИЕ · Р.'+s.rd : 'ГОЛОСОВАНИЕ · Р.'+s.rd)
  }));
  col.appendChild(banner);
  appendRosterPanel(col, s, myIdx);

  // ---- Место ещё не закреплено за этим устройством: показываем экран выбора личности,
  // без доступа к какой-либо панели действий и без возможности заглянуть в чужие данные ----
  if(myIdx === -1){
    const claimPanel = el('div',{class:'panel fade-in-up', 'data-tag':'Определение личности'});
    claimPanel.appendChild(el('p',{text:'Это устройство ещё не привязано ни к одному игроку в этой комнате. Выбери, кем из списка являешься именно ты — после этого место закрепится только за твоим браузером, и никто другой (включая тебя с другого устройства) не увидит твои скрытые характеристики.'}));
    const seatErr = el('div',{class:'error-msg', text:''});
    let anyFree = false;
    s.p.forEach((pl,i)=>{
      const taken = !!s.claims[i];
      if(!taken) anyFree = true;
      const row = el('div',{class:'claim-row'});
      row.appendChild(el('span',{class:'claim-name', text:pl.n}));
      const btn = el('button',{class: taken ? 'ghost' : 'primary', style:'font-size:11px; padding:8px 12px;', text: taken ? 'Занято' : 'Это я'});
      if(taken){ btn.setAttribute('disabled','disabled'); }
      else{
        btn.onclick = ()=>{
          btn.setAttribute('disabled','disabled');
          claimSeat(code, i, myDeviceId).then(result=>{
            if(result==='taken'){
              seatErr.textContent = 'Кто-то успел выбрать это место на секунду раньше — выбери другого игрока.';
            }
          });
        };
      }
      row.appendChild(btn);
      claimPanel.appendChild(row);
    });
    if(!anyFree){
      claimPanel.appendChild(el('p',{class:'tiny', style:'margin-top:10px;', text:'Все места уже закреплены за другими устройствами. Если это твоё место — попроси того, кто его занял, нажать «Это не я (сбросить место)» в шапке комнаты.'}));
    }
    claimPanel.appendChild(seatErr);
    col.appendChild(claimPanel);
    return;
  }

  const iAmEliminated = s.p[myIdx].e;

  const actionPanel = el('div',{class:'panel fade-in-up', 'data-tag':'Действие'});
  const actionArea = el('div',{id:'actionArea'});
  actionPanel.appendChild(actionArea);
  col.appendChild(actionPanel);

  if(iAmEliminated){
    actionArea.appendChild(el('p',{class:'tiny', text:'Ты выбыл(а) из игры. Можешь наблюдать за дальнейшим развитием событий, но действий больше нет.'}));
    return;
  }

  if(s.proposal){
    const label = PROPOSAL_LABELS[s.proposal.type] || 'Предложение';
    const byName = s.p[s.proposal.by] ? s.p[s.proposal.by].n : '???';
    const act = activeIdx(s);
    const agreedCount = act.filter(i=>s.proposal.responses && s.proposal.responses[i]===true).length;
    actionArea.appendChild(el('p',{html:'<b>'+label+'</b> — предложил(а) '+byName+'. Нужно согласие всех живых игроков ('+agreedCount+' из '+act.length+' уже согласны). Если хоть один откажется, игра продолжится как раньше, без изменений.'}));
    if(s.proposal.responses && s.proposal.responses[myIdx]===true){
      actionArea.appendChild(el('p',{class:'tiny', text:'Ты уже согласился(лась) — ждём остальных.'}));
    } else {
      const agreeBtn = el('button',{class:'primary', text:'Согласен(на)'});
      agreeBtn.onclick = ()=>{
        const next = JSON.parse(JSON.stringify(s));
        respondToProposal(next, myIdx, true);
        pushState(next);
      };
      const rejectBtn = el('button',{class:'danger', style:'margin-left:10px;', text:'Против'});
      rejectBtn.onclick = ()=>{
        const next = JSON.parse(JSON.stringify(s));
        respondToProposal(next, myIdx, false);
        pushState(next);
      };
      actionArea.appendChild(agreeBtn);
      actionArea.appendChild(rejectBtn);
    }
    return;
  }

  if(myIdx !== turnIdx){
    actionArea.appendChild(el('p',{class:'tiny', html:'Сейчас не твой ход. Ход игрока <b>'+turnName+'</b> — просто подожди, экран обновится сам.'}));
    return;
  }

  renderAbilityPanel(col, s, myIdx);

  const chosen = myIdx;

  if(isRevealLike){
    const mask = s.p[chosen].r;
    const hidden = [];
    for(let c=0;c<CATS.length;c++){ if(!((mask>>c)&1)) hidden.push(c); }

    if(hidden.length===0){
      actionArea.appendChild(el('p',{text:'У тебя уже раскрыто всё, что можно. Просто передай ход дальше.'}));
      const skipBtn = el('button',{class:'primary', text:'Передать ход →'});
      skipBtn.onclick = ()=>{
        const next = JSON.parse(JSON.stringify(s));
        advanceAfterReveal(next);
        pushState(next);
      };
      actionArea.appendChild(skipBtn);
    } else {
      actionArea.appendChild(ownDossierStrip(s, chosen));
      actionArea.appendChild(el('p',{class:'tiny', style:'margin-bottom:2px;', text:'Выбери, какую характеристику раскрыть для всех:'}));
      const grid = el('div',{class:'cat-btn-grid'});
      hidden.forEach(catIdx=>{
        // На самой кнопке видно, что именно откроется — не нужно листать наверх к карточке
        const b = el('button',{class:'cat-btn'});
        b.appendChild(el('span',{class:'bk', text:CATS[catIdx]}));
        b.appendChild(el('span',{class:'bv', text:s.p[chosen].v[catIdx]}));
        b.title = CATS[catIdx]+': '+s.p[chosen].v[catIdx];
        b.onclick = ()=>{
          const next = JSON.parse(JSON.stringify(s));
          next.p[chosen].r = next.p[chosen].r | (1<<catIdx);
          pushLog(next, s.p[chosen].n+' раскрыл(а): '+CATS[catIdx]+' = «'+s.p[chosen].v[catIdx]+'».', 'reveal');
          advanceAfterReveal(next);
          pushState(next);
        };
        grid.appendChild(b);
      });
      actionArea.appendChild(grid);
    }

    if(s.ph==='reveal' && s.rd >= EARLY_VOTE_FROM_ROUND){
      actionArea.appendChild(el('div',{class:'tiny', style:'margin-top:10px;', text:'Можно предложить закончить раскрытие раньше срока — но для этого нужно согласие всех живых игроков:'}));
      const voteEarlyBtn = el('button',{class:'ghost', style:'margin-top:6px;', text:'Предложить досрочное голосование'});
      voteEarlyBtn.onclick = ()=>{
        const next = JSON.parse(JSON.stringify(s));
        createProposal(next, 'early_vote', chosen);
        checkProposalConsensus(next); // на случай, если активен всего один игрок
        pushState(next);
      };
      actionArea.appendChild(voteEarlyBtn);
    }
  } else if(s.ph==='vote'){
    actionArea.appendChild(ownDossierStrip(s, chosen));
    actionArea.appendChild(el('label',{text:'За кого голосуешь на исключение?'}));
    const voteSel = el('select');
    voteSel.appendChild(el('option',{value:'', text:'Выберите игрока'}));
    s.p.forEach((pl,i)=>{
      if(!pl.e && i!==chosen) voteSel.appendChild(el('option',{value:i, text:pl.n}));
    });
    actionArea.appendChild(voteSel);
    const btn = el('button',{class:'danger', text:'Отдать голос'});
    btn.onclick = ()=>{
      const target = parseInt(voteSel.value);
      if(isNaN(target)){ return; }
      const next = JSON.parse(JSON.stringify(s));
      next.vt[chosen] = target;
      pushLog(next, s.p[chosen].n+' проголосовал(а) против '+s.p[target].n+'.', 'vote');
      advanceAfterVote(next);
      pushState(next);
    };
    actionArea.appendChild(btn);

    actionArea.appendChild(el('div',{class:'tiny', style:'margin-top:12px;', text:'Не уверены, кого исключать? Можно предложить продлить раскрытие вместо голосования — но для этого нужно согласие всех живых игроков.'}));
    const extendBtn = el('button',{class:'ghost', style:'margin-top:6px;', text:'Предложить продлить раскрытие'});
    extendBtn.onclick = ()=>{
      const next = JSON.parse(JSON.stringify(s));
      createProposal(next, 'extend', chosen);
      checkProposalConsensus(next);
      pushState(next);
    };
    actionArea.appendChild(extendBtn);
  }

}

/* ---------------- Boot ---------------- */

let booted = false;
function boot(){
  if(booted) return; // onAuthStateChanged может сработать повторно (напр. обновление токена)
  booted = true;
  const params = new URLSearchParams(location.search);
  const room = params.get('room');
  if(room){
    subscribeRoom(room.toUpperCase());
  } else {
    renderLobby();
  }
}

function renderAuthError(err){
  document.getElementById('statusLine').textContent = 'ошибка входа';
  const app = document.getElementById('app');
  app.innerHTML = '';
  const panel = el('div',{class:'panel', 'data-tag':'Не удалось подключиться'});
  panel.appendChild(el('div',{class:'config-warning', html:
    'Не получилось анонимно авторизоваться в Firebase (нужно для работы правил безопасности).<br><br>' +
    'Если это твой проект — открой Firebase Console → Authentication → Sign-in method и включи провайдер <b>Anonymous</b>. ' +
    'Техническая ошибка: <code>'+(err && err.message ? err.message : String(err))+'</code>'
  }));
  app.appendChild(panel);
}

initVfxCanvas();
if(!configOk){ renderConfigMissing(); }
</script>
