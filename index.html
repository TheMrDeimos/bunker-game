<!DOCTYPE html>
<html lang="ru">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>БУНКЕР // Протокол выживания</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg-0:#111317;
    --bg-1:#191d23;
    --bg-2:#20252c;
    --panel:#1c2129;
    --line:#343c46;
    --amber:#e6b325;
    --amber-dim:#8a6c1f;
    --rust:#b5451f;
    --paper:#eee6d3;
    --muted:#8992a0;
    --green:#5c9a6b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at top, var(--bg-1), var(--bg-0) 70%);
    color:var(--paper);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
    padding:0 0 60px 0;
  }
  .hazard{
    height:8px;
    width:100%;
    background:repeating-linear-gradient(135deg, var(--amber), var(--amber) 14px, #111 14px, #111 28px);
  }
  header.top{
    padding:22px 20px 14px;
    max-width:900px;
    margin:0 auto;
    text-align:center;
  }
  h1.brand{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    letter-spacing:6px;
    font-size:clamp(28px,6vw,44px);
    margin:10px 0 4px;
    color:var(--paper);
  }
  h1.brand span{color:var(--amber);}
  .subbrand{
    font-size:12px;
    letter-spacing:3px;
    color:var(--muted);
    text-transform:uppercase;
  }
  main{
    max-width:900px;
    margin:0 auto;
    padding:10px 16px 0;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:2px;
    padding:20px;
    margin-bottom:18px;
    position:relative;
  }
  .panel::before{
    content:attr(data-tag);
    position:absolute;
    top:-10px;
    left:16px;
    background:var(--bg-0);
    padding:0 8px;
    font-size:11px;
    letter-spacing:2px;
    color:var(--amber);
    text-transform:uppercase;
  }
  .alert-ticker{
    background:#171a1f;
    border:1px solid var(--rust);
    color:#e8a08c;
    padding:12px 16px;
    font-size:13px;
    line-height:1.6;
    border-radius:2px;
  }
  .alert-ticker b{color:var(--amber);}
  .bunker-info{
    font-size:13px;
    color:var(--muted);
    margin-top:10px;
    line-height:1.6;
  }
  label{
    display:block;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:6px;
  }
  input[type=text]{
    width:100%;
    background:var(--bg-0);
    border:1px solid var(--line);
    color:var(--paper);
    padding:11px 12px;
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    border-radius:2px;
    margin-bottom:14px;
  }
  input[type=text]:focus{outline:none; border-color:var(--amber);}
  .grid6{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 16px;
  }
  @media(max-width:520px){.grid6{grid-template-columns:1fr;}}
  button{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    letter-spacing:2px;
    text-transform:uppercase;
    font-size:14px;
    padding:13px 20px;
    border-radius:2px;
    border:1px solid var(--amber);
    background:transparent;
    color:var(--amber);
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  button:hover{background:var(--amber); color:#171a1f;}
  button.primary{background:var(--amber); color:#171a1f;}
  button.primary:hover{background:#f3c545;}
  button.danger{border-color:var(--rust); color:#e8a08c;}
  button.danger:hover{background:var(--rust); color:#fff;}
  button:disabled{opacity:.35; cursor:not-allowed;}
  button:disabled:hover{background:transparent; color:var(--amber);}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .turn-banner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:linear-gradient(90deg, rgba(230,179,37,0.13), transparent);
    border-left:3px solid var(--amber);
    padding:14px 16px;
    margin-bottom:18px;
    font-family:'Oswald', sans-serif;
    letter-spacing:1px;
  }
  .turn-banner .cursor{animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  @media (prefers-reduced-motion: reduce){.turn-banner .cursor{animation:none;}}
  .phase-pill{
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:#171a1f;
    background:var(--amber);
    padding:3px 10px;
    border-radius:20px;
    white-space:nowrap;
  }
  .roster{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px,1fr));
    gap:14px;
  }
  .dossier{
    background:var(--bg-0);
    border:1px solid var(--line);
    border-radius:2px;
    padding:14px 14px 16px;
    position:relative;
    overflow:hidden;
  }
  .dossier.out{opacity:.4;}
  .dossier.out::after{
    content:"ИСКЛЮЧЁН(А)";
    position:absolute;
    top:40%;
    left:-15%;
    width:130%;
    text-align:center;
    transform:rotate(-8deg);
    background:var(--rust);
    color:#fff;
    font-family:'Oswald',sans-serif;
    letter-spacing:3px;
    font-size:12px;
    padding:4px 0;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .dossier.active-turn{border-color:var(--amber); box-shadow:0 0 0 1px var(--amber) inset;}
  .dossier .pname{
    font-family:'Oswald', sans-serif;
    font-size:17px;
    letter-spacing:1px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .trait-row{
    display:flex;
    gap:8px;
    align-items:baseline;
    font-size:12.5px;
    padding:4px 0;
    border-bottom:1px dashed #2a303a;
  }
  .trait-row:last-child{border-bottom:none;}
  .trait-cat{color:var(--muted); min-width:118px; flex-shrink:0;}
  .trait-val{color:var(--paper);}
  .redacted{
    background:repeating-linear-gradient(135deg,#000,#000 4px,#151515 4px,#151515 8px);
    color:transparent;
    border-radius:2px;
    padding:1px 6px;
    user-select:none;
  }
  .vote-count{
    font-size:11px;
    color:var(--amber);
  }
  .own-card{
    border:1px solid var(--amber);
    background:#1a1710;
  }
  .stamp{
    display:inline-block;
    border:2px solid var(--rust);
    color:#e8a08c;
    font-family:'Oswald',sans-serif;
    letter-spacing:3px;
    padding:3px 10px;
    transform:rotate(-4deg);
    font-size:11px;
    margin-bottom:10px;
    border-radius:3px;
  }
  select{
    width:100%;
    background:var(--bg-0);
    border:1px solid var(--line);
    color:var(--paper);
    padding:11px 12px;
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    border-radius:2px;
    margin-bottom:14px;
  }
  .linkbox{
    background:var(--bg-0);
    border:1px solid var(--line);
    padding:10px 12px;
    font-size:11.5px;
    word-break:break-all;
    color:var(--muted);
    border-radius:2px;
    margin:10px 0;
    max-height:70px;
    overflow-y:auto;
  }
  .copied-msg{color:var(--green); font-size:12px; margin-left:8px;}
  details{margin-bottom:18px;}
  summary{
    cursor:pointer;
    font-family:'Oswald',sans-serif;
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-size:13px;
    color:var(--muted);
  }
  details[open] summary{color:var(--amber);}
  .rules-body{font-size:13px; line-height:1.7; color:var(--muted); padding-top:10px;}
  .rules-body b{color:var(--paper);}
  .final-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .final-item{
    background:var(--bg-0);
    border:1px solid var(--green);
    padding:12px 14px;
    border-radius:2px;
    font-family:'Oswald',sans-serif;
    letter-spacing:1px;
    font-size:16px;
  }
  .tiny{font-size:11px; color:var(--muted);}
  footer{
    text-align:center;
    color:#4a5260;
    font-size:11px;
    padding:30px 20px 10px;
  }
  .tabs{display:flex; gap:0; margin-bottom:16px; border-bottom:1px solid var(--line);}
  .tab{
    padding:10px 18px;
    font-family:'Oswald',sans-serif;
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-size:13px;
    color:var(--muted);
    cursor:pointer;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }
  .tab.active{color:var(--amber); border-bottom-color:var(--amber);}
  .room-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--bg-0);
    border:1px solid var(--amber-dim);
    padding:5px 12px;
    border-radius:20px;
    font-size:12px;
    letter-spacing:1px;
    color:var(--amber);
    margin-top:8px;
  }
  .dot-live{
    width:7px; height:7px; border-radius:50%;
    background:var(--green);
    box-shadow:0 0 6px var(--green);
  }
  .code-display{
    font-family:'Oswald',sans-serif;
    font-size:34px;
    letter-spacing:8px;
    color:var(--amber);
    text-align:center;
    padding:14px 0;
  }
  .error-msg{color:#e8a08c; font-size:13px; margin-top:6px;}
  .config-warning{
    background:#241a12;
    border:1px solid var(--rust);
    color:#f0c4a0;
    padding:16px;
    font-size:13px;
    line-height:1.7;
    border-radius:2px;
  }
</style>
</head>
<body>
<div class="hazard"></div>
<header class="top">
  <div class="subbrand">Протокол экстренного распределения мест</div>
  <h1 class="brand">БУНКЕР<span>::</span>33</h1>
  <div class="subbrand" id="statusLine">инициализация…</div>
</header>

<main id="app"></main>

<footer>живая синхронизация · Firebase Realtime Database · без своего сервера</footer>

<script>
/* ======================================================================
   ВСТАВЬ СЮДА СВОЙ FIREBASE CONFIG
   Firebase Console → Project settings (шестерёнка) → Your apps → </> Web → скопировать объект
   ====================================================================== */
const firebaseConfig = {
  apiKey: "ВСТАВЬ_СЮДА",
  authDomain: "ВСТАВЬ_СЮДА",
  databaseURL: "ВСТАВЬ_СЮДА",
  projectId: "ВСТАВЬ_СЮДА",
  storageBucket: "ВСТАВЬ_СЮДА",
  messagingSenderId: "ВСТАВЬ_СЮДА",
  appId: "ВСТАВЬ_СЮДА"
};
/* ====================================================================== */

const CATS = ["Профессия","Состояние здоровья","Хобби / навык","Фобия","Личный багаж","Секрет"];

const POOLS = {
  0:["Хирург","Инженер-электрик","Повар","Программист","Учитель биологии","Военный сапёр","Психолог","Фермер","Сантехник","Актёр","Полицейский","Инженер-строитель","Юрист","Ветеринар","Пожарный","Механик"],
  1:["Идеальное здоровье","Астма","Диабет 1 типа","Сильная аллергия на пыль","Хроническая бессонница","Слабое зрение (−6)","Периодические мигрени","Лёгкая аритмия","Недавно перенёс(ла) простуду","Здоров(а), но крайне мнителен(льна)"],
  2:["Игра на гитаре","Охота и разделка дичи","Программирование","Йога и медитация","Кулинария","Рисование","Боевые искусства","Садоводство","Шахматы","Вождение тяжёлой техники","Скалолазание","Рыбалка и вязание узлов"],
  3:["Клаустрофобия","Никтофобия (боязнь темноты)","Боязнь высоты","Аквафобия (боязнь воды)","Социофобия","Боязнь насекомых","Боязнь крови","Фобий нет"],
  4:["Аптечка первой помощи","Ящик семян для посадки","Ручной генератор","Гитара","Книги по выживанию","Портативная рация","Ящик консервов","Набор инструментов","Старый фотоальбом","Охотничий нож"],
  5:["Раньше был(а) осуждён(а) за мелкое правонарушение","Тайно влюблён(а) в одного из присутствующих","Владеет навыками первой помощи, но скрывает это","Панически боится ответственности","На самом деле соврал(а) о своей профессии","Прирождённый лидер, но стесняется","Боится темноты, но никому не признаётся","Хранит секретный рецепт от бабушки"]
};

const CATASTROPHES = [
  "Ядерный конфликт уничтожил крупнейшие города. Поверхность заражена на ближайшие годы.",
  "Неизвестный вирус выкосил 90% населения планеты за три недели.",
  "Астероид вошёл в атмосферу и вызвал многолетнюю глобальную зиму.",
  "Суперизвержение вулкана накрыло полушарие слоем пепла.",
  "Три дня назад начался контакт с враждебной внеземной формой жизни."
];
const BUNKERS = [
  "Бункер рассчитан на 3 человек. Запасов еды и воды хватит на 6 месяцев.",
  "Бункер рассчитан на 3 человек. Есть система очистки воздуха, но еды в обрез.",
  "Бункер рассчитан на 3 человек. Автономный генератор, ограниченный запас медикаментов.",
  "Бункер рассчитан на 3 человек. Тесно, но безопасно минимум на год."
];

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

function activeIdx(s){
  return s.p.map((pl,i)=>i).filter(i=>!s.p[i].e);
}
function currentTurnPlayer(s){
  const act = activeIdx(s);
  return act[s.tp];
}

function makeGame(names){
  const traits = CATS.map((_,catIdx)=>shuffle(POOLS[catIdx]).slice(0,6));
  const players = names.map((n,i)=>({
    n:n,
    v:[traits[0][i],traits[1][i],traits[2][i],traits[3][i],traits[4][i],traits[5][i]],
    r:0,
    e:false
  }));
  return {
    p:players,
    c:pick(CATASTROPHES),
    b:pick(BUNKERS),
    ph:"reveal",
    rd:1,
    tp:0,
    vt:[null,null,null,null,null,null]
  };
}

function advanceAfterReveal(s){
  s.tp++;
  const act = activeIdx(s);
  if(s.tp >= act.length){
    s.tp = 0;
    s.rd++;
    if(s.rd > 3){
      s.ph = "vote";
      s.rd = 1;
      s.vt = [null,null,null,null,null,null];
    }
  }
}

function tallyAndEliminate(s){
  const counts = {};
  s.vt.forEach(t=>{ if(t!==null && t!==undefined) counts[t]=(counts[t]||0)+1; });
  let maxV=-1, target=null;
  Object.keys(counts).forEach(k=>{
    if(counts[k]>maxV){maxV=counts[k]; target=parseInt(k);}
  });
  if(target!==null){ s.p[target].e = true; }
  s.vt = [null,null,null,null,null,null];
  s.tp = 0;
  const act = activeIdx(s);
  if(act.length <= 3){
    s.ph = "end";
  } else {
    s.rd++;
  }
  return target;
}

function advanceAfterVote(s){
  s.tp++;
  const act = activeIdx(s);
  if(s.tp >= act.length){
    return tallyAndEliminate(s);
  }
  return null;
}

/* ---------------- Firebase wiring ---------------- */

let db = null;
const configOk = firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf("ВСТАВЬ") === -1;
if(configOk){
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
}

let currentRoom = null;
let currentOffFn = null;

function genRoomCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";
  for(let i=0;i<4;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}

function roomLink(code){
  return location.origin + location.pathname + '?room=' + code;
}

function subscribeRoom(code){
  if(currentOffFn) currentOffFn();
  currentRoom = code;
  const ref = db.ref('rooms/'+code);
  const handler = (snap)=>{
    const s = snap.val();
    if(s) renderGame(s, code);
    else renderRoomMissing(code);
  };
  ref.on('value', handler);
  currentOffFn = ()=> ref.off('value', handler);
}

function pushState(s){
  db.ref('rooms/'+currentRoom).set(s);
}

/* ---------------- DOM helpers ---------------- */

function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==="html") e.innerHTML=v;
    else if(k==="text") e.textContent=v;
    else e.setAttribute(k,v);
  });
  (Array.isArray(children)?children:[children]).forEach(c=>{ if(c) e.appendChild(c); });
  return e;
}

function traitRow(catIdx, value, revealed){
  const row = el('div',{class:'trait-row'});
  row.appendChild(el('span',{class:'trait-cat', text:CATS[catIdx]}));
  if(revealed){
    row.appendChild(el('span',{class:'trait-val', text:value}));
  } else {
    row.appendChild(el('span',{class:'redacted', text:value}));
  }
  return row;
}

function renderRoster(s, opts={}){
  const roster = el('div',{class:'roster'});
  s.p.forEach((pl,i)=>{
    const isTurn = !pl.e && i===currentTurnPlayer(s) && opts.highlightTurn;
    const isOwn = opts.ownIdx===i;
    const card = el('div',{class:'dossier'+(pl.e?' out':'')+(isTurn?' active-turn':'')+(isOwn?' own-card':'')});
    const nameRow = el('div',{class:'pname'});
    nameRow.appendChild(el('span',{text:pl.n}));
    if(s.ph==='vote' && !pl.e){
      const vc = s.vt.filter(t=>t===i).length;
      if(vc>0) nameRow.appendChild(el('span',{class:'vote-count', text:vc+' ГОЛОС(А)'}));
    }
    card.appendChild(nameRow);
    for(let c=0;c<6;c++){
      const revealed = isOwn ? true : !!((pl.r>>c)&1);
      card.appendChild(traitRow(c, pl.v[c], revealed));
    }
    roster.appendChild(card);
  });
  return roster;
}

function roomBadgeRow(code){
  const wrap = el('div',{class:'row', style:'justify-content:space-between; align-items:center;'});
  const badge = el('div',{class:'room-badge'});
  badge.appendChild(el('span',{class:'dot-live'}));
  badge.appendChild(el('span',{text:'КОМНАТА '+code+' · ОНЛАЙН'}));
  wrap.appendChild(badge);
  const btn = el('button',{text:'Скопировать ссылку-приглашение'});
  const msg = el('span',{class:'copied-msg', text:''});
  btn.onclick = async ()=>{
    try{ await navigator.clipboard.writeText(roomLink(code)); msg.textContent='✓ скопировано'; }
    catch(e){ msg.textContent = roomLink(code); }
  };
  const right = el('div',{class:'row'},[btn, msg]);
  wrap.appendChild(right);
  return wrap;
}

/* ---------------- Screens ---------------- */

function renderConfigMissing(){
  document.getElementById('statusLine').textContent = 'нужна настройка';
  const app = document.getElementById('app');
  app.innerHTML = '';
  const panel = el('div',{class:'panel', 'data-tag':'Настройка не завершена'});
  panel.appendChild(el('div',{class:'config-warning', html:
    'Игра ещё не подключена к базе данных.<br><br>' +
    'Открой этот файл в редакторе и вставь свой конфиг из Firebase Console в переменную <b>firebaseConfig</b> в самом начале блока &lt;script&gt;, затем сохрани и залей обновлённый файл на GitHub.'
  }));
  app.appendChild(panel);
}

function renderRoomMissing(code){
  document.getElementById('statusLine').textContent = 'комната не найдена';
  const app = document.getElementById('app');
  app.innerHTML = '';
  const panel = el('div',{class:'panel', 'data-tag':'Ошибка'});
  panel.appendChild(el('p',{html:'Комната <b>'+code+'</b> не найдена или ещё не создана.'}));
  const btn = el('button',{class:'primary', text:'Вернуться на главный экран'});
  btn.onclick = ()=>{ history.replaceState(null,'', location.pathname); renderLobby(); };
  panel.appendChild(btn);
  app.appendChild(panel);
}

function renderLobby(){
  document.getElementById('statusLine').textContent = 'ожидание · создайте или войдите в комнату';
  const app = document.getElementById('app');
  app.innerHTML = '';

  const panel = el('div',{class:'panel', 'data-tag':'Новая симуляция'});

  const tabs = el('div',{class:'tabs'});
  const tabCreate = el('div',{class:'tab active', text:'Создать игру'});
  const tabJoin = el('div',{class:'tab', text:'У меня есть код'});
  tabs.appendChild(tabCreate); tabs.appendChild(tabJoin);
  panel.appendChild(tabs);

  const body = el('div',{id:'lobbyBody'});
  panel.appendChild(body);
  app.appendChild(panel);

  function showCreate(){
    tabCreate.className='tab active'; tabJoin.className='tab';
    body.innerHTML='';
    body.appendChild(el('p',{text:'Впишите имена всех шестерых игроков. Игра сразу заработает в реальном времени у всех, кто откроет ссылку-приглашение.'}));
    const grid = el('div',{class:'grid6'});
    const inputs = [];
    for(let i=0;i<6;i++){
      const wrap = el('div');
      wrap.appendChild(el('label',{text:'Игрок '+(i+1)}));
      const inp = el('input',{type:'text', placeholder:'Имя'});
      inp.setAttribute('maxlength','16');
      inputs.push(inp);
      wrap.appendChild(inp);
      grid.appendChild(wrap);
    }
    body.appendChild(grid);
    const btn = el('button',{class:'primary', text:'Создать игру'});
    const err = el('div',{class:'error-msg', text:''});
    btn.onclick = ()=>{
      const names = inputs.map((i,idx)=>i.value.trim() || ('Игрок '+(idx+1)));
      const s = makeGame(names);
      const code = genRoomCode();
      db.ref('rooms/'+code).set(s).then(()=>{
        history.replaceState(null,'', location.pathname + '?room=' + code);
        subscribeRoom(code);
      }).catch(e=>{ err.textContent = 'Ошибка записи в базу: '+e.message; });
    };
    body.appendChild(el('div',{class:'row', style:'margin-top:6px'},[btn]));
    body.appendChild(err);
  }

  function showJoin(){
    tabJoin.className='tab active'; tabCreate.className='tab';
    body.innerHTML='';
    body.appendChild(el('p',{text:'Введите 4-значный код комнаты, который прислал организатор игры.'}));
    const inp = el('input',{type:'text', placeholder:'НАПР. A4F2', style:'text-transform:uppercase; letter-spacing:4px; text-align:center; font-size:20px;'});
    inp.setAttribute('maxlength','4');
    body.appendChild(inp);
    const btn = el('button',{class:'primary', text:'Войти в игру'});
    const err = el('div',{class:'error-msg', text:''});
    btn.onclick = ()=>{
      const code = inp.value.trim().toUpperCase();
      if(code.length!==4){ err.textContent='Код должен состоять из 4 символов.'; return; }
      db.ref('rooms/'+code).get().then(snap=>{
        if(snap.exists()){
          history.replaceState(null,'', location.pathname + '?room=' + code);
          subscribeRoom(code);
        } else {
          err.textContent = 'Комната с таким кодом не найдена.';
        }
      }).catch(e=>{ err.textContent = 'Ошибка: '+e.message; });
    };
    body.appendChild(el('div',{class:'row', style:'margin-top:10px'},[btn]));
    body.appendChild(err);
  }

  tabCreate.onclick = showCreate;
  tabJoin.onclick = showJoin;
  showCreate();

  const rules = el('details');
  rules.appendChild(el('summary',{text:'Правила'}));
  rules.appendChild(el('div',{class:'rules-body', html:`
    Случилась катастрофа. У вас есть один бункер на троих и шесть претендентов на место.<br><br>
    <b>Раскрытие (3 раунда).</b> По очереди каждый игрок открывает одну свою характеристику для всех — сначала профессию, затем здоровье, затем хобби. Фобия, багаж и секрет остаются в тени до конца.<br><br>
    <b>Голосование (до 3 раундов).</b> Обсудите вслух или в чате, кто менее полезен для выживания группы, затем каждый по очереди голосует. Игрок с наибольшим числом голосов выбывает.<br><br>
    <b>Финал.</b> Игра заканчивается, когда в бункере остаётся 3 человека.<br><br>
    <span class="tiny">Все данные хранятся в общей базе данных на время игры — это игра на доверии между друзьями, а не защищённая система.</span>
  `}));
  app.appendChild(rules);
}

function renderGame(s, code){
  const app = document.getElementById('app');
  app.innerHTML = '';

  const badgePanel = el('div',{class:'panel', style:'padding:12px 20px;'});
  badgePanel.appendChild(roomBadgeRow(code));
  app.appendChild(badgePanel);

  const alertPanel = el('div',{class:'panel', 'data-tag':'Сводка ситуации'});
  alertPanel.appendChild(el('div',{class:'alert-ticker', html:'<b>ТРЕВОГА:</b> '+s.c}));
  alertPanel.appendChild(el('div',{class:'bunker-info', text:s.b}));
  app.appendChild(alertPanel);

  if(s.ph==='end'){
    document.getElementById('statusLine').textContent = 'симуляция завершена';
    const panel = el('div',{class:'panel', 'data-tag':'Итог'});
    panel.appendChild(el('h3',{text:'Двери бункера закрыты.', style:'font-family:Oswald,sans-serif; letter-spacing:1px;'}));
    const list = el('div',{class:'final-list'});
    s.p.forEach((pl,i)=>{ if(!pl.e) list.appendChild(el('div',{class:'final-item', text:'✓ '+pl.n})); });
    panel.appendChild(list);
    app.appendChild(panel);

    const dossierPanel = el('div',{class:'panel','data-tag':'Полное досье'});
    const full = document.createElement('div');
    full.className='roster';
    s.p.forEach(pl=>{
      const card = el('div',{class:'dossier'+(pl.e?' out':'')});
      card.appendChild(el('div',{class:'pname', text:pl.n}));
      for(let c=0;c<6;c++) card.appendChild(traitRow(c, pl.v[c], true));
      full.appendChild(card);
    });
    dossierPanel.appendChild(full);
    app.appendChild(dossierPanel);
    return;
  }

  const turnIdx = currentTurnPlayer(s);
  const turnName = s.p[turnIdx].n;

  document.getElementById('statusLine').textContent =
    (s.ph==='reveal' ? 'фаза раскрытия · раунд '+s.rd+'/3' : 'фаза голосования · раунд '+s.rd);

  const banner = el('div',{class:'turn-banner'});
  banner.appendChild(el('div',{html:'<span class="cursor">▮</span> Ход игрока: <b>'+turnName+'</b>'}));
  banner.appendChild(el('div',{class:'phase-pill', text: s.ph==='reveal' ? 'РАСКРЫТИЕ '+s.rd+'/3' : 'ГОЛОСОВАНИЕ '+s.rd}));
  app.appendChild(banner);

  const boardPanel = el('div',{class:'panel', 'data-tag':'Личные дела претендентов'});
  boardPanel.appendChild(renderRoster(s, {highlightTurn:true, ownIdx:-1}));
  app.appendChild(boardPanel);

  const actionPanel = el('div',{class:'panel', 'data-tag':'Действие'});
  const claimSel = el('select');
  claimSel.appendChild(el('option',{value:'', text:'Выберите: кто сейчас за устройством?'}));
  s.p.forEach((pl,i)=>{
    if(!pl.e) claimSel.appendChild(el('option',{value:i, text:pl.n}));
  });
  actionPanel.appendChild(el('label',{text:'Подтвердите личность'}));
  actionPanel.appendChild(claimSel);
  const actionArea = el('div',{id:'actionArea'});
  actionPanel.appendChild(actionArea);
  app.appendChild(actionPanel);

  claimSel.onchange = ()=>{
    actionArea.innerHTML = '';
    const chosen = parseInt(claimSel.value);
    if(isNaN(chosen)) return;
    if(chosen !== turnIdx){
      actionArea.appendChild(el('p',{class:'tiny', html:'Сейчас не твой ход. Ход игрока <b>'+turnName+'</b> — просто подожди, экран обновится сам.'}));
      return;
    }
    const stamp = el('div',{class:'stamp', text:'ТВОЁ ДОСЬЕ'});
    actionArea.appendChild(stamp);
    const own = el('div',{class:'panel', style:'background:#171a1f; padding:12px 14px; margin-bottom:14px;'});
    for(let c=0;c<6;c++) own.appendChild(traitRow(c, s.p[chosen].v[c], true));
    actionArea.appendChild(own);

    if(s.ph==='reveal'){
      const catIdx = s.rd - 1;
      const already = !!((s.p[chosen].r>>catIdx)&1);
      if(already){
        actionArea.appendChild(el('p',{text:'Эта характеристика уже раскрыта. Передайте ход дальше.'}));
      } else {
        actionArea.appendChild(el('p',{html:'Раскрыть для всех: <b>'+CATS[catIdx]+'</b> — «'+s.p[chosen].v[catIdx]+'»'}));
      }
      const btn = el('button',{class:'primary', text: already? 'Продолжить →' : 'Раскрыть для всех'});
      btn.onclick = ()=>{
        const next = JSON.parse(JSON.stringify(s));
        if(!already) next.p[chosen].r = next.p[chosen].r | (1<<catIdx);
        advanceAfterReveal(next);
        pushState(next);
      };
      actionArea.appendChild(btn);
    } else if(s.ph==='vote'){
      actionArea.appendChild(el('label',{text:'За кого голосуешь на исключение?'}));
      const voteSel = el('select');
      voteSel.appendChild(el('option',{value:'', text:'Выберите игрока'}));
      s.p.forEach((pl,i)=>{
        if(!pl.e && i!==chosen) voteSel.appendChild(el('option',{value:i, text:pl.n}));
      });
      actionArea.appendChild(voteSel);
      const btn = el('button',{class:'danger', text:'Отдать голос'});
      btn.onclick = ()=>{
        const target = parseInt(voteSel.value);
        if(isNaN(target)){ return; }
        const next = JSON.parse(JSON.stringify(s));
        next.vt[chosen] = target;
        advanceAfterVote(next);
        pushState(next);
      };
      actionArea.appendChild(btn);
    }
  };
}

/* ---------------- Boot ---------------- */

function boot(){
  if(!configOk){ renderConfigMissing(); return; }
  const params = new URLSearchParams(location.search);
  const room = params.get('room');
  if(room){
    subscribeRoom(room.toUpperCase());
  } else {
    renderLobby();
  }
}

boot();
</script>
</body>
</html>
