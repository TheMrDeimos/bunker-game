<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>ПРОТОКОЛ: РАССВЕТ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Russo+One&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  /* ==========================================================================
     ПРОТОКОЛ РАССВЕТ — визуальный язык
     Игра про отбор в убежище: личные дела, раскрытие характеристик,
     голосование на исключение и три ночи после закрытия дверей.
     Отсюда и оформление: бетон и полумрак укрытия, папки личных дел с алым
     грифом, неоновая подсветка карточек как индикатор состояния игрока.
     Никакой жёлто-чёрной "ленты опасности" — это штамп, а не характер.
     Все шрифты — с обязательной поддержкой кириллицы (это была причина
     "съехавшей" типографики: у прежнего display-шрифта кириллицы не было).
     ========================================================================== */
  :root{
    /* бетон */
    --bg-0:#0e0e0d;
    --bg-1:#151513;
    --bg-2:#1c1b18;
    --panel:#151513;
    --line:#33312a;
    --line-soft:#26241f;
    /* гриф дела */
    --amber:#c8342a;        /* основной алый: грифы, лейблы, акценты (имя переменной историческое) */
    --amber-dim:#7a221c;
    --rust:#8c1a1e;
    /* бумага */
    --paper:#e8e2d6;
    --muted:#8a857a;
    --muted-2:#6a665d;
    /* служебные */
    --green:#8a9457;
    --neon:#63d8d0;         /* холодная подсветка: подсмотренные данные, щит */
    --turn-green:#b4c06e;
    --red-alert:#ff2f2f;
    /* Цвета состояний карточек игроков — перенесены из версии до редизайна:
       читаются мгновенно и не спорят с бетонной гаммой остального интерфейса. */
    --card-own:#e6b325;     /* твоя карточка */
    --card-turn:#39d97a;    /* чей сейчас ход */
    --card-vote:#33f0ff;    /* тот же игрок, но в фазе голосования */
    --card-danger:#ff3b3b;  /* больше всех голосов на исключение */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0px, rgba(255,255,255,0.018) 1px, transparent 1px, transparent 3px),
      linear-gradient(180deg, var(--bg-1), var(--bg-0) 60%);
    color:var(--paper);
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    min-height:100vh;
    padding:0 0 50px 0;
    position:relative;
    overflow-x:hidden;
  }

  /* ---------- фоновые слои ---------- */
  #vfxCanvas{
    position:fixed; inset:0; width:100%; height:100%;
    z-index:0; pointer-events:none; opacity:.4; mix-blend-mode:screen;
  }
  .scanline-sweep{
    position:fixed; left:0; right:0; height:140px; top:-140px;
    background:linear-gradient(180deg, transparent, rgba(99,216,208,0.035), transparent);
    pointer-events:none; z-index:1;
    animation:sweep 9s linear infinite;
  }
  @keyframes sweep{0%{top:-140px;} 100%{top:100%;}}
  header.top, main, footer{position:relative; z-index:2;}

  .vote-alert-frame{
    position:fixed; inset:0; pointer-events:none; z-index:3;
    box-shadow: inset 0 0 0px 0px var(--red-alert);
  }
  body.vote-mode .vote-alert-frame{
    animation: voteFramePulse 2s ease-in-out infinite;
  }
  @keyframes voteFramePulse{
    0%,100%{ box-shadow: inset 0 0 50px 3px rgba(255,47,47,0.10); }
    50%{ box-shadow: inset 0 0 110px 12px rgba(255,47,47,0.28); }
  }

  @keyframes fadeInUp{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }
  .fade-in-up{animation:fadeInUp .35s ease both;}

  @keyframes revealFlash{
    0%{ background:rgba(200,52,42,0.5); transform:translateX(-4px); }
    100%{ background:transparent; transform:translateX(0); }
  }
  .reveal-flash{ animation:revealFlash .8s ease both; }

  @media (prefers-reduced-motion: reduce){
    .fade-in-up, .reveal-flash, .scanline-sweep, body.vote-mode .vote-alert-frame{animation:none !important;}
  }

  /* ---------- служебная полоса над шапкой (вместо ленты опасности) ---------- */
  .hazard{
    height:26px;
    width:100%;
    background:var(--bg-0);
    border-bottom:1px solid var(--line);
    position:relative; z-index:4;
    display:flex; align-items:center; gap:14px;
    padding:0 16px;
    overflow:hidden;
    font-family:'Oswald',sans-serif;
    font-size:9.5px; letter-spacing:3px; text-transform:uppercase;
    color:var(--muted-2);
    white-space:nowrap;
  }
  .hazard::before{
    content:"◆ ◆ ◆";
    color:var(--amber);
    letter-spacing:6px;
    font-size:8px;
  }
  .hazard::after{
    content:"";
    flex:1;
    height:1px;
    background:repeating-linear-gradient(90deg, var(--amber-dim) 0 18px, transparent 18px 30px);
  }
  body.vote-mode .hazard::before{color:var(--red-alert);}

  /* ---------- шапка / марка ---------- */
  header.top{
    max-width:1180px;
    margin:0 auto;
    padding:18px 20px 14px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:18px;
    border-bottom:1px solid var(--line);
  }
  .mark{display:flex; align-items:center; gap:14px; min-width:0;}
  .mark-glyph{
    width:38px; height:38px; flex:0 0 38px;
    border:2px solid var(--amber);
    display:flex; align-items:center; justify-content:center;
    transform:rotate(45deg);
    position:relative;
  }
  .mark-glyph i{
    width:10px; height:10px; background:var(--amber); display:block;
  }
  body.vote-mode .mark-glyph{border-color:var(--red-alert);}
  body.vote-mode .mark-glyph i{background:var(--red-alert);}
  h1.brand{
    font-family:'Russo One', 'Oswald', sans-serif;
    font-weight:400;
    letter-spacing:1px;
    font-size:clamp(19px,3.4vw,29px);
    margin:0;
    color:var(--paper);
    line-height:1;
    text-transform:uppercase;
  }
  h1.brand span{
    display:block;
    color:var(--amber);
    font-size:.52em;
    letter-spacing:5px;
    margin-top:5px;
  }
  .subbrand{
    font-family:'Oswald',sans-serif;
    font-size:10px;
    letter-spacing:2.5px;
    color:var(--muted-2);
    text-transform:uppercase;
    text-align:right;
    line-height:1.7;
  }
  .subbrand b{color:var(--muted); font-weight:500;}

  /* ---------- каркас: две стороны экрана ---------- */
  main{
    max-width:1180px;
    margin:0 auto;
    padding:0 20px;
  }
  .shell{
    display:grid;
    grid-template-columns:1fr 310px;
    gap:0;
    align-items:start;
  }
  .col{
    min-width:0;
    padding:18px 26px 0 0;
  }
  .rail{
    min-width:0;
    padding:18px 0 0 22px;
    border-left:1px solid var(--line);
    position:sticky;
    top:0;
    max-height:100vh;
    overflow-y:auto;
    scrollbar-width:thin;
  }
  .rail::-webkit-scrollbar{width:5px;}
  .rail::-webkit-scrollbar-thumb{background:var(--line);}
  @media(max-width:900px){
    .shell{grid-template-columns:1fr;}
    .col{padding:14px 0 0; order:1;}
    .rail{
      padding:14px 0 0;
      border-left:none;
      border-top:1px solid var(--line);
      position:static;
      max-height:none;
      order:2;
      margin-top:20px;
    }
  }

  /* ---------- секции (НЕ карточки — карточки только у игроков) ---------- */
  .panel{
    background:transparent;
    border:none;
    border-left:2px solid var(--line);
    border-radius:0;
    padding:2px 0 0 14px;
    margin:0 0 22px 0;
    position:relative;
  }
  .panel::before{
    content:attr(data-tag);
    display:block;
    font-family:'Oswald',sans-serif;
    font-weight:500;
    font-size:10px;
    letter-spacing:2.5px;
    color:var(--amber);
    text-transform:uppercase;
    margin-bottom:9px;
  }
  .panel p{margin:0 0 9px; line-height:1.65; font-size:13px;}
  .panel p:last-child{margin-bottom:0;}
  .rail .panel{border-left-color:var(--line-soft); font-size:12.5px;}
  .rail .panel p{font-size:12px;}

  /* сворачиваемые секции */
  details.panel > summary{
    list-style:none; cursor:pointer; outline:none;
    font-family:'Oswald',sans-serif;
    letter-spacing:1.5px; text-transform:uppercase;
    font-size:11.5px; color:var(--muted);
    padding:2px 0;
  }
  details > summary::-webkit-details-marker{display:none;}
  details.panel > summary::before{content:"▸ "; color:var(--amber);}
  details.panel[open] > summary::before{content:"▾ ";}
  details.panel[open] > summary{color:var(--paper);}

  /* ---------- сводка / тревога ---------- */
  .alert-ticker{
    background:linear-gradient(90deg, rgba(200,52,42,0.09), transparent 70%);
    border:none;
    border-left:2px solid var(--rust);
    color:var(--paper);
    padding:9px 0 9px 12px;
    margin-left:-14px;
    padding-left:12px;
    font-size:12.5px;
    line-height:1.65;
    border-radius:0;
  }
  .alert-ticker b{
    color:var(--amber);
    font-family:'Oswald',sans-serif;
    letter-spacing:1.5px;
  }
  .bunker-info{
    font-size:12px;
    color:var(--muted);
    margin-top:9px;
    line-height:1.7;
    padding-top:9px;
    border-top:1px solid var(--line-soft);
  }

  /* ---------- хроника ---------- */
  .feed-list{
    display:flex;
    flex-direction:column;
    max-height:340px;
    overflow-y:auto;
    scrollbar-width:thin;
    padding-right:4px;
  }
  .feed-list::-webkit-scrollbar{width:4px;}
  .feed-list::-webkit-scrollbar-thumb{background:var(--line);}
  .feed-item{
    background:transparent;
    border:none;
    border-left:2px solid var(--line);
    padding:6px 0 6px 10px;
    margin-bottom:4px;
    font-size:11.5px;
    line-height:1.55;
    border-radius:0;
    color:var(--muted);
  }
  .feed-item.kind-ability{border-left-color:var(--amber); color:var(--paper);}
  .feed-item.kind-vote{border-left-color:var(--rust); color:var(--paper);}
  .feed-item.kind-reveal{border-left-color:var(--turn-green);}
  .feed-item.kind-system{border-left-color:var(--line);}

  /* ---------- формы ---------- */
  label{
    display:block;
    font-family:'Oswald',sans-serif;
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--muted-2);
    margin-bottom:5px;
  }
  input[type=text], select{
    width:100%;
    background:var(--bg-0);
    border:1px solid var(--line);
    color:var(--paper);
    padding:10px 12px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13.5px;
    border-radius:0;
    margin-bottom:12px;
  }
  input[type=text]:focus, select:focus{outline:none; border-color:var(--amber);}
  .grid6{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 18px;
  }
  @media(max-width:640px){.grid6{grid-template-columns:1fr;}}

  /* ---------- кнопки ---------- */
  button{
    font-family:'Oswald', sans-serif;
    font-weight:500;
    letter-spacing:2px;
    text-transform:uppercase;
    font-size:12.5px;
    padding:11px 18px;
    border-radius:0;
    border:1px solid var(--amber);
    background:transparent;
    color:var(--amber);
    cursor:pointer;
    transition:background .12s, color .12s;
  }
  button:hover{background:var(--amber); color:var(--bg-0);}
  button:focus-visible{outline:2px solid var(--neon); outline-offset:2px;}
  button.primary{background:var(--amber); color:var(--bg-0); border-color:var(--amber);}
  button.primary:hover{background:#dc4235; border-color:#dc4235;}
  button.danger{border-color:var(--rust); color:#eda9a4;}
  button.danger:hover{background:var(--rust); color:#fff;}
  button.ghost{border-color:var(--line); color:var(--muted);}
  button.ghost:hover{background:var(--line); color:var(--paper);}
  button:disabled{opacity:.3; cursor:not-allowed;}
  button:disabled:hover{background:transparent; color:var(--amber);}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .cat-btn-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(178px,1fr));
    gap:7px;
    margin:12px 0;
  }
  .cat-btn-grid button{font-size:11.5px; padding:11px 10px; letter-spacing:1.2px;}
  /* кнопка раскрытия несёт и название категории, и само значение */
  .cat-btn-grid button.cat-btn{
    display:flex; flex-direction:column; align-items:flex-start; gap:3px;
    text-align:left; padding:9px 11px;
  }
  .cat-btn .bk{
    font-family:'Oswald',sans-serif;
    font-size:11px; letter-spacing:1.5px; text-transform:uppercase;
  }
  .cat-btn .bv{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px; letter-spacing:0; text-transform:none;
    color:var(--muted);
    max-width:100%;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .cat-btn:hover .bv{color:rgba(16,15,13,.72);}

  /* ---------- баннер хода ---------- */
  .turn-banner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    background:var(--bg-0);
    border:1px solid var(--line);
    border-left:3px solid var(--amber);
    padding:12px 14px;
    margin-bottom:22px;
    font-family:'Oswald', sans-serif;
    letter-spacing:1.5px;
    font-size:14px;
    position:sticky;
    top:0;
    z-index:6;
  }
  .turn-banner b{color:var(--paper);}
  body.vote-mode .turn-banner{
    border-left-color:var(--red-alert);
    border-color:var(--amber-dim);
  }
  .turn-banner .cursor{animation:blink 1.1s steps(1) infinite; color:var(--amber);}
  @keyframes blink{50%{opacity:0;}}
  @media (prefers-reduced-motion: reduce){.turn-banner .cursor{animation:none;}}
  .phase-pill{
    font-family:'Oswald',sans-serif;
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--bg-0);
    background:var(--amber);
    padding:4px 10px;
    border-radius:0;
    white-space:nowrap;
  }
  body.vote-mode .phase-pill{background:var(--red-alert); color:#fff;}

  /* ---------- КАРТОЧКИ ИГРОКОВ (единственные карточки в интерфейсе) ---------- */
  .roster{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(244px,1fr));
    gap:12px;
  }
  .dossier{
    background:var(--bg-0);
    border:1px solid var(--line);
    border-radius:0;
    padding:14px 14px 16px;
    position:relative;
    overflow:hidden;
  }
  .dossier.out{opacity:.4;}
  .dossier.out::after{
    content:"ИСКЛЮЧЁН(А)";
    position:absolute;
    top:40%;
    left:-15%;
    width:130%;
    text-align:center;
    transform:rotate(-8deg);
    background:var(--rust);
    color:#fff;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:3px;
    font-size:12px;
    padding:4px 0;
    box-shadow:0 2px 6px rgba(0,0,0,.45);
  }
  /* Ходит сейчас — зелёная неоновая рамка */
  .dossier.active-turn{
    border-color:var(--card-turn);
    box-shadow:0 0 10px 1px rgba(57,217,122,0.55), 0 0 0 1px var(--card-turn) inset;
  }
  /* Тот же игрок в фазе голосования — холодный бирюзовый неон */
  body.vote-mode .dossier.active-turn{
    border-color:var(--card-vote);
    box-shadow:0 0 12px 1px var(--card-vote), 0 0 0 1px var(--card-vote) inset;
  }
  /* Твоя карточка — золотой неон */
  .dossier.own-card{
    border:1px solid var(--card-own);
    background:#1a1710;
    box-shadow:0 0 12px 2px rgba(230,179,37,0.5), 0 0 0 1px var(--card-own) inset;
  }
  /* Больше всех голосов на исключение — красный неон, перебивает остальное */
  .dossier.vote-leader{
    border-color:var(--card-danger) !important;
    box-shadow:0 0 16px 3px rgba(255,59,59,0.65), 0 0 0 1px var(--card-danger) inset !important;
  }
  .dossier .pname{
    font-family:'Oswald', sans-serif;
    font-size:16px;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .dossier.own-card .pname{color:var(--card-own);}
  .dossier.active-turn .pname{color:var(--card-turn);}
  body.vote-mode .dossier.active-turn .pname{color:var(--card-vote);}
  .trait-row{
    display:flex;
    gap:8px;
    align-items:center;
    min-height:27px;
    font-size:12px;
    padding:4px 0;
    border-bottom:1px dashed var(--line-soft);
  }
  .trait-row:last-child{border-bottom:none;}
  .trait-cat{
    color:var(--muted-2);
    min-width:104px;
    flex-shrink:0;
    font-size:10.5px;
    letter-spacing:.5px;
    text-transform:uppercase;
    line-height:1.3;
  }
  .trait-val{color:var(--paper); flex:1 1 auto; min-width:0; word-break:break-word; overflow-wrap:anywhere;}
  .peek-val{color:var(--neon); font-style:italic;}
  .peek-val::after{content:" ◈"; font-size:9px;}

  /* ---------- компактная сводка своих данных над кнопками раскрытия ---------- */
  .own-strip{
    border:1px solid var(--line);
    border-left:2px solid var(--card-own);
    background:#191510;
    padding:9px 12px 7px;
    margin:0 0 14px;
  }
  .own-strip-head{
    display:flex; align-items:center; gap:10px;
    margin-bottom:7px;
  }
  .own-strip-title{
    font-family:'Oswald',sans-serif;
    font-size:10px; letter-spacing:2px; text-transform:uppercase;
    color:var(--card-own); white-space:nowrap;
  }
  .own-strip-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px; color:var(--muted-2); white-space:nowrap;
  }
  .own-meter-bar{
    flex:1; height:2px; background:var(--line-soft); position:relative; overflow:hidden; min-width:40px;
  }
  .own-meter-bar i{
    display:block; height:100%; background:var(--card-own);
    box-shadow:0 0 6px rgba(230,179,37,.7);
    transition:width .4s ease;
  }
  .own-strip-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(215px,1fr));
    gap:0 18px;
  }
  .own-line{
    display:flex; gap:8px; align-items:baseline;
    padding:3px 0;
    border-bottom:1px solid var(--line-soft);
    font-size:11px;
    min-width:0;
  }
  .own-line .k{
    font-family:'Oswald',sans-serif;
    font-size:9px; letter-spacing:1px; text-transform:uppercase;
    color:#57534b; min-width:88px; flex-shrink:0;
  }
  .own-line .v{
    flex:1 1 auto; min-width:0;
    color:#7d786d; font-style:italic;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  /* уже раскрытое — ярче и без курсива, с горящей меткой */
  .own-line.open .k{color:var(--muted);}
  .own-line.open .v{color:var(--paper); font-style:normal;}
  .own-line.open .k::before{
    content:"●"; color:var(--card-own); font-size:7px;
    margin-right:5px; vertical-align:middle;
  }
  .own-line:not(.open) .k::before{
    content:"○"; color:#4a463f; font-size:7px;
    margin-right:5px; vertical-align:middle;
  }
  .redacted{
    background:#000;
    color:transparent;
    border-radius:0;
    padding:0 6px;
    user-select:none;
    display:block;
    flex:1 1 auto;
    min-width:0;
    /* Ключевое для ровных карточек: цензура всегда одной высоты и не переносится,
       иначе длинное скрытое значение растягивает строку и ломает выравнивание. */
    height:17px;
    line-height:17px;
    white-space:nowrap;
    overflow:hidden;
  }

function generateBunkerProfile(seats){
  const shelter = pick(SHELTER_TYPES);
  const profile = {};
  ["food","water","power","medicine","security"].forEach(res=>{ profile[res] = pick(BUNKER_LEVELS); });
  const parts = ["Ваше убежище — "+shelter.name.toLowerCase()+" ("+shelter.blurb+"), рассчитанное на "+seats+" человек."];
  parts.push(pick(BUNKER_TEXT.food[profile.food]));
  parts.push(pick(BUNKER_TEXT.water[profile.water]));
  parts.push(pick(BUNKER_TEXT.power[profile.power]));
  parts.push(pick(BUNKER_TEXT.medicine[profile.medicine]));
  parts.push(pick(BUNKER_TEXT.security[profile.security]));
  shuffle(BUNKER_QUIRKS).slice(0, randInt(1,2)).forEach(q=>parts.push(q));
  return { profile, text: parts.join(" "), shelterName: shelter.name };
}

function dutyRoleById(id){ return DUTY_ROLES.find(r=>r.id===id); }

function playerFitsRole(pl, role){
  let bonus = 0;
  if(role.fitProf && role.fitProf.includes(pl.v[0])) bonus += 2;
  if(role.fitHobby && role.fitHobby.includes(pl.v[2])) bonus += 2;
  if(role.fitSecret && role.fitSecret.includes(pl.v[5])) bonus += 1;
  return bonus;
}

function computeFinalOutcome(s){
  const survivors = s.p.filter(pl=>!pl.e); // финальные выжившие — уже после всех событий
  const jobs = s.jobs || {};
  let score = survivors.length; // больше рук — больше шансов на старте
  const roleLines = [];

  DUTY_ROLES.forEach(role=>{
    const assignedIdx = Object.keys(jobs).map(Number).find(i=>jobs[i]===role.id);
    if(assignedIdx===undefined || !s.p[assignedIdx] || s.p[assignedIdx].e){
      score -= 3; // важная обязанность осталась без ответственного (в том числе если ответственный погиб позже)
      roleLines.push(role.name+': эту обязанность сейчас некому выполнять.');
      return;
    }
    const pl = s.p[assignedIdx];
    let roleScore = 0;
    if(role.resource){
      roleScore += BUNKER_LEVEL_WEIGHT[(s.bunkerProfile||{})[role.resource]] || 0;
    } else {
      const primeAge = survivors.filter(p=>{
        const age = parseInt(p.v[7]); return !isNaN(age) && age>=18 && age<=45;
      }).length;
      roleScore += primeAge>=2 ? 2 : (primeAge===1 ? 0 : -2);
    }
    const fitBonus = playerFitsRole(pl, role);
    roleScore += fitBonus;
    score += roleScore;
    const verdict = roleScore>=2 ? 'справляется отлично' : (roleScore<=-1 ? 'справляется с большим трудом' : 'справляется на среднем уровне');
    roleLines.push(role.name+': '+pl.n+' — '+verdict+'.');
  });

  const eventLog = Array.isArray(s.eventLog) ? s.eventLog : [];
  const eventLines = [];
  eventLog.forEach(ev=>{
    if(ev.casualties && ev.casualties.length){
      score -= 3*ev.casualties.length;
    } else {
      score += 1;
    }
    if(ev.revived) score += 2;
    eventLines.push('Фаза '+ev.phase+': '+ev.note);
  });

  const tier = OUTCOME_TIERS.find(t=>score>=t.min) || OUTCOME_TIERS[OUTCOME_TIERS.length-1];
  return { score, tierLabel: tier.label, text: pick(tier.texts), roleLines, eventLines };
}

/* ---------------- Финальные события: 3 фазы после распределения обязанностей ---------------- */
// Каждая фаза — новое событие. Выжившие по очереди выбирают одно из трёх
// действий, а игроки, ранее исключённые голосованием ("изгнанники"), в это
// же время решают — помогать оставшимся или вредить им. Итог фазы зависит
// от характеристик и обязанностей выбравших "Атаку" против типа события,
// плюс от совокупного выбора изгнанников. В бою кто-то может погибнуть, но
// если среди изгнанников в этой фазе был хотя бы один "помогающий", он может
// вернуться в игру и заменить собой погибшего (один раз за игру).

const ACTION_DUTY_BONUS = { food:"gather", repair:"action", medic:"action", security:"attack", future:"action" };

function actionFitScore(pl, actionId, jobId){
  let score = 0;
  const fit = ACTION_FIT[actionId];
  if(fit){
    if(fit.fitProf && fit.fitProf.includes(pl.v[0])) score += 2;
    if(fit.fitHobby && fit.fitHobby.includes(pl.v[2])) score += 2;
  }
  if(jobId && ACTION_DUTY_BONUS[jobId] === actionId) score += 1;
  return score;
}

function computeOutcastModifier(s){
  const choices = s.outcastChoices || {};
  let mod = 0;
  Object.values(choices).forEach(c=>{ if(c==='help') mod += 1; else if(c==='sabotage') mod -= 1; });
  return mod;
}

function startEventPhase(s){
  s.ph = "event";
  s.eventPhase = (s.eventPhase||0) + 1;
  const used = s.usedEventIdx || [];
  const free = EVENT_POOL.map((e,i)=>i).filter(i=>!used.includes(i));
  const idx = free.length>0 ? pick(free) : randInt(0, EVENT_POOL.length-1);
  s.usedEventIdx = used.concat([idx]);
  s.currentEvent = EVENT_POOL[idx];
  s.eventChoices = {};
  s.outcastChoices = {};
  s.tp = 0;
}

function advanceAfterEventChoice(s){
  s.tp++;
  const act = activeIdx(s);
  if(s.tp >= act.length){
    resolveEventPhase(s);
    if((s.eventPhase||0) >= EVENT_PHASES_TOTAL){
      s.finalOutcome = computeFinalOutcome(s);
      s.ph = "end";
    } else {
      startEventPhase(s);
    }
  }
}

function resolveEventPhase(s){
  const event = s.currentEvent || EVENT_POOL[0];
  const survivors = activeIdx(s);
  const outcastMod = computeOutcastModifier(s);
  const choices = s.eventChoices || {};
  const results = [];
  let defenseScore = outcastMod;
  const attackers = [];

  survivors.forEach(i=>{
    const actionId = choices[i] || "action";
    const pl = s.p[i];
    const jobId = (s.jobs||{})[i];
    let skill = actionFitScore(pl, actionId, jobId);
    skill += (actionId === event.favored) ? 2 : -1;
    const roll = skill + randInt(-2,2);
    const success = roll >= 2;
    results.push({ idx:i, name:pl.n, action:actionId, success });
    if(actionId === "attack"){
      attackers.push({ idx:i, success });
      if(success) defenseScore += 2;
    }
  });

  let casualties = [];
  if(event.favored === "attack"){
    const needed = Math.max(2, Math.ceil(survivors.length/2));
    if(defenseScore < needed){
      const failedAttackers = attackers.filter(a=>!a.success).map(a=>a.idx);
      let victim = failedAttackers.length ? pick(failedAttackers) : undefined;
      if(victim===undefined){
        const nonAttackers = survivors.filter(i=>choices[i] !== "attack");
        victim = nonAttackers.length ? pick(nonAttackers) : pick(survivors);
      }
      casualties.push(victim);
    } else {
      const failedAttackers = attackers.filter(a=>!a.success);
      if(failedAttackers.length && Math.random() < 0.25) casualties.push(pick(failedAttackers).idx);
    }
  }
  casualties = [...new Set(casualties)];

  // шанс вернуть в игру одного из "изгнанников", если в этой фазе он выбрал помогать
  let revived = null;
  if(casualties.length>0 && !s.revivalUsed){
    const helpers = Object.keys(s.outcastChoices||{}).map(Number)
      .filter(i=>s.outcastChoices[i]==='help' && s.p[i] && s.p[i].e);
    if(helpers.length>0){
      revived = pick(helpers);
      s.p[revived].e = false;
      s.revivalUsed = true;
      casualties = casualties.slice(1); // спасённый занимает место того, кто должен был погибнуть
    }
  }

  casualties.forEach(idx=>{ s.p[idx].e = true; s.p[idx].r = ALL_CATS_MASK; });

  const successCount = results.filter(r=>r.success).length;
  let narrative = '«'+event.text+'» — ';
  if(casualties.length>0){
    narrative += 'не обошлось без потерь: '+casualties.map(i=>s.p[i].n).join(', ')+' погиб(ли), пытаясь защитить остальных.';
  } else if(revived){
    narrative += s.p[revived].n+' вернулся(лась) в решающий момент и помог(ла) избежать трагедии.';
  } else if(event.favored==='attack'){
    narrative += 'угрозу удалось отбить, обошлось без потерь.';
  } else {
    narrative += successCount >= Math.ceil(survivors.length/2) ? 'в целом справились неплохо.' : 'справились с трудом, не всё получилось так, как хотелось.';
  }

  s.eventLog = s.eventLog || [];
  s.eventLog.push({ phase:s.eventPhase, text:event.text, results, casualties, revived, note:narrative });
}


const ALL_CATS_MASK = (1 << CATS.length) - 1;
const EARLY_VOTE_FROM_ROUND = 1; // досрочное голосование доступно с самого начала раскрытия в любом цикле
const SPECIAL_CHARGES = 2; // сколько раз за игру каждый игрок может применить одну из спецспособностей
const MIN_PLAYERS = 4;  // меньше — и в бункере сразу не осталось бы свободных мест
// Версия схемы данных комнаты. Firebase не хранит пустые объекты/массивы и null
// (они просто отсутствуют при чтении), поэтому определять "старую" комнату по
// отсутствию отдельных полей ненадёжно — многие поля пустые и в новых играх.
// Вместо этого одна явная метка версии: старая комната backfill'ится один раз.
const CURRENT_SCHEMA_VERSION = 3;
const MAX_PLAYERS = 10; // максимум участников за игру

// Сколько мест в бункере (сколько человек должно ОСТАТЬСЯ в живых к концу игры)
// в зависимости от того, сколько всего игроков участвует.
const SEATS_BY_COUNT = { 4:2, 5:3, 6:3, 7:3, 8:4, 9:4, 10:5 };
function finalSeats(totalPlayers){
  return SEATS_BY_COUNT[totalPlayers] || Math.max(2, Math.ceil(totalPlayers/2));
}

// Сколько голосований (исключений) потребуется всего за игру.
function votesNeededTotal(totalPlayers){
  return Math.max(1, totalPlayers - finalSeats(totalPlayers));
}

// Схема количества раундов раскрытия перед каждым циклом голосования.
// Раньше схема была фиксированной (2,2,1,1,...) и при малом числе нужных
// голосований (например, 4 игрока => всего 2 исключения) игра заканчивалась
// после всего 4 раундов раскрытия — почти никто ничего толком не успевал узнать.
// Теперь общее «целевое» число раундов раскрытия за игру распределяется по
// всем нужным циклам голосования поровну (с небольшим перевесом в начало),
// поэтому чем меньше нужно голосований, тем длиннее каждый цикл раскрытия.
const TARGET_TOTAL_REVEAL_ROUNDS = Math.min(CATS.length - 1, 7);
function buildRevealSchedule(totalPlayers){
  const cycles = votesNeededTotal(totalPlayers);
  const base = Math.floor(TARGET_TOTAL_REVEAL_ROUNDS / cycles);
  const extra = TARGET_TOTAL_REVEAL_ROUNDS % cycles;
  const schedule = [];
  for(let i=0;i<cycles;i++){
    schedule.push(Math.max(1, base + (i < extra ? 1 : 0)));
  }
  return schedule;
}
function revealRoundsForCycle(cycle, totalPlayers){
  const schedule = buildRevealSchedule(totalPlayers);
  const idx = Math.min(cycle, schedule.length) - 1;
  return schedule[Math.max(0, idx)];
}

function abilityById(id){ return ABILITIES.find(a=>a.id===id); }

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function randInt(min,max){return min + Math.floor(Math.random()*(max-min+1));}

// Хроника событий: короткая скользящая лента последних действий (раскрытия,
// голоса, итоги подсчёта, способности). Хранит не больше 5 записей — самая
// старая вытесняется новой. kind нужен только для стиля отображения:
// 'ability' подсвечивается отдельно, остальные (reveal/vote/system) — нейтрально.
function pushLog(s, text, kind){
  const feed = Array.isArray(s.eventFeed) ? s.eventFeed.slice() : [];
  const id = (s.eventFeedSeq||0) + 1;
  s.eventFeedSeq = id;
  feed.push({ id, kind: kind||'system', text });
  s.eventFeed = feed.length > 5 ? feed.slice(feed.length-5) : feed;
}

function activeIdx(s){
  return s.p.map((pl,i)=>i).filter(i=>!s.p[i].e);
}
function currentTurnPlayer(s){
  const act = activeIdx(s);
  if(act.length===0) return -1;
  return act[s.tp % act.length];
}

function makeGame(names){
  const pooled = {};
  POOL_CAT_IDX.forEach(catIdx=>{ pooled[catIdx] = shuffle(POOLS[catIdx]).slice(0, names.length); });
  const abilityIds = ABILITIES.map(a=>a.id);
  const players = names.map((n,i)=>{
    const v = new Array(CATS.length);
    POOL_CAT_IDX.forEach(catIdx=>{ v[catIdx] = pooled[catIdx][i]; });
    v[6] = pick(GENDERS) + " / " + pick(REPRODUCTION);
    v[7] = generateAgeValue();
    v[8] = pick(ORIENTATIONS);
    const ab = shuffle(abilityIds).slice(0,2);
    return { n, v, r:0, e:false, ab, au:0, abUsed:[], shield:false };
  });
  const cata = pick(CATASTROPHES);
  const seats = finalSeats(names.length);
  const bunkerGen = generateBunkerProfile(seats);
  const numTwists = names.length <= 6 ? 1 : 2;
  const twists = shuffle(TWIST_POOL).slice(0, numTwists).map((text, i)=>({
    text, afterElim: i+1, revealed:false
  }));
  return {
    p:players,
    c:cata.t,
    cx:cata.fx,
    b:bunkerGen.text,
    bunkerProfile:bunkerGen.profile,
    shelterName:bunkerGen.shelterName,
    ph:"reveal",
    rd:1,
    tp:0,
    vt:new Array(names.length).fill(-1),
    claims:new Array(names.length).fill(null),
    peeks:[],
    turnAbilityUsed:false,
    revealCycle:1,
    eliminationsCount:0,
    twists,
    tieReason:null,
    proposal:null,
    lastProposalNote:null,
    jobs:{},
    eventPhase:0,
    currentEvent:null,
    eventChoices:{},
    outcastChoices:{},
    eventLog:[],
    usedEventIdx:[],
    revivalUsed:false,
    eventFeed:[],
    eventFeedSeq:0,
    schemaVersion: CURRENT_SCHEMA_VERSION
  };
}

// Новое значение для способности "Пересдача": для пуловых категорий (0-5) берём
// значение, которое сейчас ни у кого не занято, чтобы характеристики оставались
// уникальными; для пола/возраста/ориентации просто генерируем заново.
function rerollValueFor(s, catIdx){
  if(POOL_CAT_IDX.includes(catIdx)){
    const used = s.p.map(pl=>pl.v[catIdx]);
    const candidates = POOLS[catIdx].filter(v=>!used.includes(v));
    return candidates.length ? pick(candidates) : pick(POOLS[catIdx]);
  }
  if(catIdx===6) return pick(GENDERS) + " / " + pick(REPRODUCTION);
  if(catIdx===7) return generateAgeValue();
  if(catIdx===8) return pick(ORIENTATIONS);
  return null;
}

/* ---------------- Раскрытие ---------------- */

function advanceAfterReveal(s){
  s.tp++;
  s.turnAbilityUsed = false;
  s.lastProposalNote = null;
  const act = activeIdx(s);
  if(s.tp >= act.length){
    s.tp = 0;
    if(s.ph === "tiebreak"){
      // спец-раунд после равенства голосов закончился — возвращаемся к голосованию без дальнейшей отсрочки
      switchToVote(s);
      return;
    }
    s.rd++;
    const roundsNeeded = revealRoundsForCycle(s.revealCycle||1, s.p.length);
    if(s.rd > roundsNeeded){
      switchToVote(s);
    }
  }
}

function switchToVote(s){
  s.ph = "vote";
  s.rd = 1;
  s.tp = 0;
  s.vt = new Array(s.p.length).fill(-1);
  s.turnAbilityUsed = false;
  s.tieReason = null;
}

/* ---------------- Коллективные предложения (нужно согласие всех живых) ---------------- */
// Пока предложение не разрешено (принято всеми или отклонено кем-то одним),
// обычные действия хода (раскрытие/голосование) недоступны — игра "на паузе".
// Отказ хотя бы одного игрока полностью отменяет предложение и возвращает
// игру ровно в ту фазу/раунд/ход, в которых она была до предложения.
const PROPOSAL_LABELS = {
  early_vote: "Досрочное голосование",
  extend: "Продление раскрытия"
};

function createProposal(s, type, byIdx){
  s.proposal = { type, by: byIdx, responses: { [byIdx]: true } };
}

function checkProposalConsensus(s){
  if(!s.proposal) return;
  const act = activeIdx(s);
  const allAgreed = act.length>0 && act.every(i=>s.proposal.responses[i]===true);
  if(!allAgreed) return;
  const type = s.proposal.type;
  s.proposal = null;
  if(type === "early_vote"){
    switchToVote(s);
    s.lastProposalNote = "Все согласились — переходим к голосованию.";
    pushLog(s, '✅ Все согласились начать голосование досрочно.', 'system');
  } else if(type === "extend"){
    s.ph = "tiebreak";
    s.rd = 1;
    s.tieReason = "extend";
    s.vt = new Array(s.p.length).fill(-1);
    s.tp = 0;
    s.turnAbilityUsed = false;
    s.lastProposalNote = "Все согласились продлить раскрытие ещё на раунд.";
    pushLog(s, '✅ Все согласились продлить раскрытие вместо голосования.', 'system');
  }
}

function respondToProposal(s, myIdx, agree){
  if(!s.proposal) return;
  if(!agree){
    const label = PROPOSAL_LABELS[s.proposal.type] || "Предложение";
    s.lastProposalNote = label+' отклонено — против '+(s.p[myIdx] ? s.p[myIdx].n : 'один из игроков')+'. Игра продолжается как прежде.';
    pushLog(s, '🚫 '+label+' отклонено — против '+(s.p[myIdx] ? s.p[myIdx].n : 'игрок')+'.', 'system');
    s.proposal = null;
    return;
  }
  s.proposal.responses = s.proposal.responses || {};
  s.proposal.responses[myIdx] = true;
  checkProposalConsensus(s);
}

/* ---------------- Голосование ---------------- */

function tallyAndEliminate(s){
  const counts = {};
  s.vt.forEach(t=>{ if(t>=0) counts[t]=(counts[t]||0)+1; });

  // голоса, отданные против игрока, который защищён "Щитом", в этом раунде не считаются
  const eligible = Object.keys(counts).map(k=>parseInt(k)).filter(idx=>!s.p[idx].shield);
  let maxV = -1;
  eligible.forEach(idx=>{ if(counts[idx]>maxV) maxV = counts[idx]; });
  const topCandidates = eligible.filter(idx=>counts[idx]===maxV);

  s.vt = new Array(s.p.length).fill(-1);
  s.tp = 0;
  s.turnAbilityUsed = false;
  s.p.forEach(pl=>{ pl.shield = false; }); // щит расходуется на один подсчёт голосов, неважно, сработал он или нет

  if(maxV <= 0 || topCandidates.length !== 1){
    // ничья (несколько кандидатов набрали одинаковый максимум) — никого не исключаем.
    // Даём один дополнительный раунд раскрытия, чтобы у группы появилась новая информация
    // для принятия решения, а затем автоматически возвращаемся к голосованию.
    s.ph = "tiebreak";
    s.rd = 1;
    s.tieReason = "tie";
    pushLog(s, '⚖️ Голоса разделились поровну — никто не исключён.', 'vote');
    return null;
  }

  const target = topCandidates[0];
  s.p[target].e = true;
  s.p[target].r = ALL_CATS_MASK; // выбывший сразу полностью раскрывается всем, как в конце игры
  s.eliminationsCount = (s.eliminationsCount||0) + 1;
  pushLog(s, '❌ Итог голосования: исключён(а) '+s.p[target].n+' ('+maxV+' голос(ов)).', 'vote');

  // проверяем, не пора ли раскрыть один из скрытых твистов
  if(Array.isArray(s.twists)){
    s.twists.forEach(tw=>{
      if(!tw.revealed && tw.afterElim <= s.eliminationsCount) tw.revealed = true;
    });
  }

  const seats = finalSeats(s.p.length);
  const act = activeIdx(s);
  if(act.length <= seats){
    // выживших ровно столько, сколько мест — переходим к распределению обязанностей
    s.ph = "assign";
    s.tp = 0;
    s.jobs = s.jobs || {};
  } else {
    // после каждого выбывания снова идём на раскрытие по расписанию, а не голосуем второй раз подряд
    s.ph = "reveal";
    s.rd = 1;
    s.revealCycle = (s.revealCycle||1) + 1;
  }
  return target;
}

function advanceAfterAssign(s){
  s.tp++;
  const act = activeIdx(s);
  if(s.tp >= act.length){
    startEventPhase(s);
  }
}

function advanceAfterVote(s){
  s.tp++;
  s.turnAbilityUsed = false;
  s.lastProposalNote = null;
  const act = activeIdx(s);
  if(s.tp >= act.length){
    return tallyAndEliminate(s);
  }
  return null;
}

/* ---------------- Firebase wiring ---------------- */

let db = null;
const configOk = firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf("ВСТАВЬ") === -1;

// Анонимная авторизация. Сама по себе она не "прячет" данные, но позволяет
// в правилах Firebase Realtime Database потребовать auth != null — то есть
// отклонять любые запросы напрямую через REST/curl без прохождения через
// Firebase Auth. Реальная защита данных всегда настраивается в разделе
// Rules консоли Firebase, а не в этом файле — см. пояснение в чате.
let authReady = false;
if(configOk){
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  firebase.auth().onAuthStateChanged(user=>{
    if(user){
      authReady = true;
      boot();
    }
  });
  firebase.auth().signInAnonymously().catch(err=>{
    console.error('Anonymous auth failed:', err);
    authReady = false;
    renderAuthError(err);
  });
}

let currentRoom = null;
let currentOffFn = null;
const prevRevealMasks = {}; // отслеживаем предыдущие битовые маски раскрытия для анимации "вспышки"

function genRoomCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";
  for(let i=0;i<4;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}

function roomLink(code){
  return location.origin + location.pathname + '?room=' + code;
}

function subscribeRoom(code){
  if(currentOffFn) currentOffFn();
  currentRoom = code;
  const ref = db.ref('rooms/'+code);
  const handler = (snap)=>{
    const s = snap.val();
    if(!s){ renderRoomMissing(code); return; }
    // старые комнаты, созданные до появления системы "мест", могли не иметь claims — добьём поле один раз
    if(!Array.isArray(s.claims) || s.claims.length !== s.p.length){
      const fixed = new Array(s.p.length).fill(null);
      (s.claims||[]).forEach((v,i)=>{ if(i<fixed.length) fixed[i] = v || null; });
      db.ref('rooms/'+code+'/claims').set(fixed);
      s.claims = fixed;
    }
    // старые комнаты могли быть созданы до появления особых способностей — раздадим их постфактум
    const needsAbilityFix = !s.schemaVersion || s.schemaVersion < CURRENT_SCHEMA_VERSION;
    if(needsAbilityFix){
      const abilityIds = ABILITIES.map(a=>a.id);
      s.p.forEach(pl=>{
        if(!Array.isArray(pl.ab)) pl.ab = shuffle(abilityIds).slice(0,2);
        if(typeof pl.au !== 'number') pl.au = 0;
        if(typeof pl.shield !== 'boolean') pl.shield = false;
        if(!Array.isArray(pl.abUsed)) pl.abUsed = [];
      });
      if(!Array.isArray(s.peeks)) s.peeks = [];
      if(typeof s.turnAbilityUsed !== 'boolean') s.turnAbilityUsed = false;
      if(typeof s.revealCycle !== 'number') s.revealCycle = 1;
      if(!s.bunkerProfile){
        const seats = finalSeats(s.p.length);
        const gen = generateBunkerProfile(seats);
        s.bunkerProfile = gen.profile;
        if(!s.b) s.b = gen.text;
      }
      if(typeof s.eliminationsCount !== 'number') s.eliminationsCount = s.p.filter(pl=>pl.e).length;
      if(!Array.isArray(s.twists)){
        const numTwists = s.p.length <= 6 ? 1 : 2;
        s.twists = shuffle(TWIST_POOL).slice(0, numTwists).map((text,i)=>({ text, afterElim:i+1, revealed:false }));
      }
      if(typeof s.jobs !== 'object' || s.jobs===null) s.jobs = {};
      if(typeof s.tieReason === 'undefined') s.tieReason = null;
      if(typeof s.proposal === 'undefined') s.proposal = null;
      if(typeof s.lastProposalNote === 'undefined') s.lastProposalNote = null;
      if(typeof s.eventPhase !== 'number') s.eventPhase = 0;
      if(!Array.isArray(s.usedEventIdx)) s.usedEventIdx = [];
      if(typeof s.revivalUsed !== 'boolean') s.revivalUsed = false;
      if(typeof s.eventChoices !== 'object' || s.eventChoices===null) s.eventChoices = {};
      if(typeof s.outcastChoices !== 'object' || s.outcastChoices===null) s.outcastChoices = {};
      if(!Array.isArray(s.eventLog)) s.eventLog = [];
      if(!Array.isArray(s.eventFeed)) s.eventFeed = [];
      if(typeof s.eventFeedSeq !== 'number') s.eventFeedSeq = s.eventFeed.length;
      s.schemaVersion = CURRENT_SCHEMA_VERSION;
      db.ref('rooms/'+code).update({
        p: s.p,
        peeks: s.peeks,
        turnAbilityUsed: s.turnAbilityUsed,
        revealCycle: s.revealCycle,
        bunkerProfile: s.bunkerProfile,
        b: s.b,
        eliminationsCount: s.eliminationsCount,
        twists: s.twists,
        jobs: s.jobs,
        tieReason: s.tieReason,
        eventPhase: s.eventPhase,
        usedEventIdx: s.usedEventIdx,
        revivalUsed: s.revivalUsed,
        eventLog: s.eventLog,
        eventFeed: s.eventFeed,
        eventFeedSeq: s.eventFeedSeq,
        schemaVersion: s.schemaVersion
      });
    }
    renderGame(s, code);
  };
  ref.on('value', handler);
  currentOffFn = ()=> ref.off('value', handler);
}

function pushState(s){
  db.ref('rooms/'+currentRoom).set(s);
}

/* ---------------- Идентификация игрока на этом устройстве ---------------- */
// Каждый браузер получает свой случайный deviceId, который сохраняется локально.
// Место (индекс игрока) в конкретной комнате привязывается к deviceId через
// Firebase-транзакцию, поэтому дважды "занять" одно и то же место с разных
// устройств нельзя, а посмотреть чужие раскрытые-в-своей-голове характеристики
// через выбор чужого имени в списке больше невозможно — такого списка нет.
function getDeviceId(){
  let id = null;
  try{ id = localStorage.getItem('bunker_device_id'); }catch(e){}
  if(!id){
    id = 'dev_' + Math.random().toString(36).slice(2) + '_' + Date.now().toString(36);
    try{ localStorage.setItem('bunker_device_id', id); }catch(e){}
  }
  return id;
}
const myDeviceId = getDeviceId();

function myPlayerIdx(s){
  if(!Array.isArray(s.claims)) return -1;
  return s.claims.findIndex(c=>c===myDeviceId);
}

// Возвращает Promise: 'ok' | 'taken'
function claimSeat(code, idx, deviceId){
  return db.ref('rooms/'+code+'/claims/'+idx).transaction(current=>{
    if(current===null || current===undefined) return deviceId;
    return; // не трогаем — место уже занято (abort)
  }).then(result=>{
    if(result.committed && result.snapshot.val()===deviceId) return 'ok';
    return 'taken';
  });
}

function releaseSeat(code, idx){
  db.ref('rooms/'+code+'/claims/'+idx).set(null);
}

/* ---------------- DOM helpers ---------------- */

function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==="html") e.innerHTML=v;
    else if(k==="text") e.textContent=v;
    else e.setAttribute(k,v);
  });
  (Array.isArray(children)?children:[children]).forEach(c=>{ if(c) e.appendChild(c); });
  return e;
}

function traitRow(catIdx, value, revealed, justRevealed, peeked){
  const row = el('div',{class:'trait-row'+(justRevealed?' reveal-flash':'')});
  row.appendChild(el('span',{class:'trait-cat', text:CATS[catIdx]}));
  if(revealed){
    row.appendChild(el('span',{class:'trait-val', text:value}));
  } else if(peeked){
    row.appendChild(el('span',{class:'trait-val peek-val', text:value, title:'Видно только тебе — узнано способностью «Тайный осведомитель»'}));
  } else {
    row.appendChild(el('span',{class:'redacted', text:value}));
  }
  return row;
}

function renderRoster(s, opts={}){
  const roster = el('div',{class:'roster'});
  const viewerIdx = opts.ownIdx;

  // игрок(и), набравшие сейчас больше всего голосов в этом раунде, но ещё не исключённые —
  // подсвечиваются красной рамкой как "под угрозой"
  let voteLeaders = [];
  if(s.ph==='vote'){
    const counts = {};
    s.vt.forEach(t=>{ if(t>=0) counts[t]=(counts[t]||0)+1; });
    let maxV = 0;
    Object.values(counts).forEach(c=>{ if(c>maxV) maxV=c; });
    if(maxV>0) voteLeaders = Object.keys(counts).filter(k=>counts[k]===maxV).map(Number);
  }

  s.p.forEach((pl,i)=>{
    const isTurn = !pl.e && i===currentTurnPlayer(s) && opts.highlightTurn;
    const isOwn = opts.ownIdx===i;
    const isLeader = !pl.e && voteLeaders.includes(i);
    const card = el('div',{class:'dossier fade-in-up'
      +(pl.e?' out':'')
      +(isTurn && !isOwn ? ' active-turn':'')
      +(isOwn?' own-card':'')
      +(isLeader?' vote-leader':'')
    });
    const nameRow = el('div',{class:'pname'});
    nameRow.appendChild(el('span',{text:pl.n}));
    if(pl.shield && (isOwn || s.ph!=='vote')) nameRow.appendChild(el('span',{class:'vote-count', style:'color:var(--neon)', text:'🛡 ЩИТ'}));
    if(s.ph==='vote' && !pl.e){
      const vc = s.vt.filter(t=>t===i).length;
      if(vc>0) nameRow.appendChild(el('span',{class:'vote-count', text:vc+' ГОЛОС(А)'}));
    }
    card.appendChild(nameRow);

    const prevMask = prevRevealMasks[i] !== undefined ? prevRevealMasks[i] : pl.r;
    for(let c=0;c<CATS.length;c++){
      const revealed = !!((pl.r>>c)&1);
      const wasRevealed = !!((prevMask>>c)&1);
      const justRevealed = revealed && !wasRevealed;
      const peeked = !revealed && viewerIdx>=0 && Array.isArray(s.peeks) &&
        s.peeks.some(pk=>pk.viewer===viewerIdx && pk.target===i && pk.cat===c);
      card.appendChild(traitRow(c, pl.v[c], revealed, justRevealed, peeked));
    }
    roster.appendChild(card);
  });
  s.p.forEach((pl,i)=>{ prevRevealMasks[i] = pl.r; });
  return roster;
}

// Компактная сводка своих характеристик — одна плотная строка над кнопками
// раскрытия. Заменяет прежнюю большую панель "Твоё досье": занимает мало места,
// но избавляет от необходимости листать наверх к своей карточке.
function ownDossierStrip(s, myIdx){
  const pl = s.p[myIdx];
  const openCount = CATS.reduce((n,_,c)=>n + (((pl.r>>c)&1)?1:0), 0);

  const wrap = el('div',{class:'own-strip'});

  const head = el('div',{class:'own-strip-head'});
  head.appendChild(el('span',{class:'own-strip-title', text:'Твои данные'}));
  const bar = el('span',{class:'own-meter-bar'});
  bar.appendChild(el('i',{style:'width:'+Math.round(openCount/CATS.length*100)+'%'}));
  head.appendChild(bar);
  head.appendChild(el('span',{class:'own-strip-count', text:openCount+' / '+CATS.length}));
  wrap.appendChild(head);

  const grid = el('div',{class:'own-strip-grid'});
  for(let c=0;c<CATS.length;c++){
    const open = !!((pl.r>>c)&1);
    const line = el('div',{class:'own-line'+(open?' open':'')});
    line.appendChild(el('span',{class:'k', text:CATS[c]}));
    line.appendChild(el('span',{class:'v', text:pl.v[c], title:pl.v[c]}));
    grid.appendChild(line);
  }
  wrap.appendChild(grid);
  return wrap;
}

/* ---------------- VFX canvas ---------------- */

let vfxCtx = null, vfxCanvasEl = null, vfxParticles = [], vfxType = null, vfxRaf = null;

function initVfxCanvas(){
  vfxCanvasEl = document.getElementById('vfxCanvas');
  vfxCtx = vfxCanvasEl.getContext('2d');
  resizeVfx();
  window.addEventListener('resize', resizeVfx);
  loopVfx();
}
function resizeVfx(){
  if(!vfxCanvasEl) return;
  vfxCanvasEl.width = window.innerWidth;
  vfxCanvasEl.height = window.innerHeight;
}
function seedParticles(type){
  const W = vfxCanvasEl.width, H = vfxCanvasEl.height;
  const count = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 70;
  vfxParticles = [];
  for(let i=0;i<count;i++){
    vfxParticles.push({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*2.4+0.8,
      vy:Math.random()*0.6+0.3,
      vx:(Math.random()-0.5)*0.4,
      alpha:Math.random()*0.6+0.3,
      phase:Math.random()*Math.PI*2
    });
  }
}
function setVfx(type){
  if(vfxType === type) return;
  vfxType = type;
  seedParticles(type);
}
function colorForType(type){
  switch(type){
    case 'ash': return ['180,170,160','230,110,40'];
    case 'snow': return ['255,255,255','170,210,255'];
    case 'spores': return ['110,230,140','60,180,90'];
    case 'glitch': return ['80,255,170','160,255,220'];
    case 'embers': return ['255,170,60','255,90,40'];
    default: return ['194,59,43','140,32,24'];
  }
}
function loopVfx(){
  vfxRaf = requestAnimationFrame(loopVfx);
  if(!vfxCtx) return;
  const W = vfxCanvasEl.width, H = vfxCanvasEl.height;
  vfxCtx.clearRect(0,0,W,H);
  if(!vfxType) return;
  const [c1,c2] = colorForType(vfxType);

  if(vfxType === 'glitch'){
    // зелёный туман + случайные горизонтальные полосы искажения
    vfxCtx.fillStyle = 'rgba('+c1+',0.05)';
    vfxCtx.fillRect(0,0,W,H);
    if(Math.random() < 0.18){
      const y = Math.random()*H;
      const h = 4 + Math.random()*18;
      vfxCtx.fillStyle = 'rgba('+c2+',0.18)';
      vfxCtx.fillRect(0, y, W, h);
    }
    vfxParticles.forEach(p=>{
      p.x += Math.sin(p.phase)*0.6;
      p.phase += 0.02;
      p.y += p.vy*0.3;
      if(p.y>H) p.y=0;
      vfxCtx.fillStyle = 'rgba('+c1+','+p.alpha*0.5+')';
      vfxCtx.fillRect(p.x, p.y, 1.5, 1.5);
    });
    return;
  }

  vfxParticles.forEach(p=>{
    p.y += p.vy * (vfxType==='snow'?0.8:1.2);
    p.x += p.vx + (vfxType==='spores' ? Math.sin(p.phase)*0.3 : 0);
    p.phase += 0.03;
    if(p.y > H){ p.y = -5; p.x = Math.random()*W; }
    if(p.x > W) p.x = 0;
    if(p.x < 0) p.x = W;
    const col = (vfxType==='embers' && Math.random()<0.02) ? c2 : c1;
    vfxCtx.beginPath();
    vfxCtx.fillStyle = 'rgba('+col+','+p.alpha+')';
    vfxCtx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    vfxCtx.fill();
  });
}
