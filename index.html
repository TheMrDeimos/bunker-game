<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>БУНКЕР // Протокол выживания</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg-0:#111317;
    --bg-1:#191d23;
    --bg-2:#20252c;
    --panel:#1c2129;
    --line:#343c46;
    --amber:#e6b325;
    --amber-dim:#8a6c1f;
    --rust:#b5451f;
    --paper:#eee6d3;
    --muted:#8992a0;
    --green:#5c9a6b;
    --neon:#33f0ff;
    --turn-green:#39d97a;
    --red-alert:#ff3b3b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at top, var(--bg-1), var(--bg-0) 70%);
    color:var(--paper);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
    padding:0 0 60px 0;
    position:relative;
    overflow-x:hidden;
  }

  /* ---------- VFX canvas + CRT ---------- */
  #vfxCanvas{
    position:fixed; inset:0; width:100%; height:100%;
    z-index:0; pointer-events:none; opacity:.55; mix-blend-mode:screen;
  }
  .scanline-sweep{
    position:fixed; left:0; right:0; height:120px; top:-120px;
    background:linear-gradient(180deg, transparent, rgba(230,179,37,0.06), transparent);
    pointer-events:none; z-index:1;
    animation:sweep 7s linear infinite;
  }
  @keyframes sweep{0%{top:-120px;} 100%{top:100%;}}
  header.top, main, footer{position:relative; z-index:2;}

  .vote-alert-frame{
    position:fixed; inset:0; pointer-events:none; z-index:3;
    box-shadow: inset 0 0 0px 0px var(--red-alert);
    animation:none;
  }
  body.vote-mode .vote-alert-frame{
    animation: voteFramePulse 1.6s ease-in-out infinite;
  }
  @keyframes voteFramePulse{
    0%,100%{ box-shadow: inset 0 0 40px 4px rgba(255,59,59,0.15); }
    50%{ box-shadow: inset 0 0 90px 14px rgba(255,59,59,0.4); }
  }

  @keyframes fadeInUp{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  .fade-in-up{animation:fadeInUp .45s ease both;}

  @keyframes cardShake{
    0%,100%{transform:translate(0,0) rotate(0);}
    20%{transform:translate(-1px,0) rotate(-.2deg);}
    40%{transform:translate(1px,0) rotate(.2deg);}
    60%{transform:translate(-1px,1px) rotate(-.15deg);}
    80%{transform:translate(1px,-1px) rotate(.15deg);}
  }
  body.vote-mode .dossier:not(.out){animation:cardShake 3.2s ease-in-out infinite;}

  @keyframes revealFlash{
    0%{ background:rgba(230,179,37,0.55); color:#171a1f; transform:scaleY(0.2); }
    40%{ background:rgba(230,179,37,0.35); transform:scaleY(1.05); }
    100%{ background:transparent; transform:scaleY(1); }
  }
  .reveal-flash{ animation:revealFlash .7s ease both; border-radius:2px; }

  @media (prefers-reduced-motion: reduce){
    .fade-in-up, .reveal-flash, body.vote-mode .dossier, .scanline-sweep, body.vote-mode .vote-alert-frame{animation:none !important;}
  }

  .hazard{
    height:8px;
    width:100%;
    background:repeating-linear-gradient(135deg, var(--amber), var(--amber) 14px, #111 14px, #111 28px);
    position:relative; z-index:2;
  }
  header.top{
    padding:22px 20px 14px;
    max-width:900px;
    margin:0 auto;
    text-align:center;
  }
  h1.brand{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    letter-spacing:6px;
    font-size:clamp(28px,6vw,44px);
    margin:10px 0 4px;
    color:var(--paper);
  }
  h1.brand span{color:var(--amber);}
  .subbrand{
    font-size:12px;
    letter-spacing:3px;
    color:var(--muted);
    text-transform:uppercase;
  }
  main{
    max-width:900px;
    margin:0 auto;
    padding:10px 16px 0;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:2px;
    padding:20px;
    margin-bottom:18px;
    position:relative;
  }
  .panel::before{
    content:attr(data-tag);
    position:absolute;
    top:-10px;
    left:16px;
    background:var(--bg-0);
    padding:0 8px;
    font-size:11px;
    letter-spacing:2px;
    color:var(--amber);
    text-transform:uppercase;
  }
  .alert-ticker{
    background:#171a1f;
    border:1px solid var(--rust);
    color:#e8a08c;
    padding:12px 16px;
    font-size:13px;
    line-height:1.6;
    border-radius:2px;
  }
  .alert-ticker b{color:var(--amber);}
  .bunker-info{
    font-size:13px;
    color:var(--muted);
    margin-top:10px;
    line-height:1.6;
  }
  label{
    display:block;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:6px;
  }
  input[type=text]{
    width:100%;
    background:var(--bg-0);
    border:1px solid var(--line);
    color:var(--paper);
    padding:11px 12px;
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    border-radius:2px;
    margin-bottom:14px;
  }
  input[type=text]:focus{outline:none; border-color:var(--amber);}
  .grid6{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 16px;
  }
  @media(max-width:520px){.grid6{grid-template-columns:1fr;}}
  button{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    letter-spacing:2px;
    text-transform:uppercase;
    font-size:14px;
    padding:13px 20px;
    border-radius:2px;
    border:1px solid var(--amber);
    background:transparent;
    color:var(--amber);
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  button:hover{background:var(--amber); color:#171a1f;}
  button.primary{background:var(--amber); color:#171a1f;}
  button.primary:hover{background:#f3c545;}
  button.danger{border-color:var(--rust); color:#e8a08c;}
  button.danger:hover{background:var(--rust); color:#fff;}
  button.ghost{border-color:var(--muted); color:var(--muted);}
  button.ghost:hover{background:var(--muted); color:#171a1f;}
  button:disabled{opacity:.35; cursor:not-allowed;}
  button:disabled:hover{background:transparent; color:var(--amber);}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .cat-btn-grid{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0;}
  .cat-btn-grid button{font-size:12px; padding:10px 14px;}
  .turn-banner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:linear-gradient(90deg, rgba(230,179,37,0.13), transparent);
    border-left:3px solid var(--amber);
    padding:14px 16px;
    margin-bottom:18px;
    font-family:'Oswald', sans-serif;
    letter-spacing:1px;
  }
  body.vote-mode .turn-banner{
    border-left-color:var(--red-alert);
    background:linear-gradient(90deg, rgba(255,59,59,0.14), transparent);
  }
  .turn-banner .cursor{animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  @media (prefers-reduced-motion: reduce){.turn-banner .cursor{animation:none;}}
  .phase-pill{
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:#171a1f;
    background:var(--amber);
    padding:3px 10px;
    border-radius:20px;
    white-space:nowrap;
  }
  body.vote-mode .phase-pill{background:var(--red-alert); color:#fff;}
  .roster{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px,1fr));
    gap:14px;
  }
  .dossier{
    background:var(--bg-0);
    border:1px solid var(--line);
    border-radius:2px;
    padding:14px 14px 16px;
    position:relative;
    overflow:hidden;
  }
  .dossier.out{opacity:.4;}
  .dossier.out::after{
    content:"ИСКЛЮЧЁН(А)";
    position:absolute;
    top:40%;
    left:-15%;
    width:130%;
    text-align:center;
    transform:rotate(-8deg);
    background:var(--rust);
    color:#fff;
    font-family:'Oswald',sans-serif;
    letter-spacing:3px;
    font-size:12px;
    padding:4px 0;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .dossier.active-turn{border-color:var(--turn-green); box-shadow:0 0 10px 1px rgba(57,217,122,0.55), 0 0 0 1px var(--turn-green) inset;}
  body.vote-mode .dossier.active-turn{
    border-color:var(--neon);
    box-shadow:0 0 12px 1px var(--neon), 0 0 0 1px var(--neon) inset;
  }
  .dossier.vote-leader{
    border-color:var(--red-alert) !important;
    box-shadow:0 0 16px 3px rgba(255,59,59,0.65), 0 0 0 1px var(--red-alert) inset !important;
  }
  .dossier .pname{
    font-family:'Oswald', sans-serif;
    font-size:17px;
    letter-spacing:1px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .trait-row{
    display:flex;
    gap:8px;
    align-items:baseline;
    font-size:12.5px;
    padding:4px 0;
    border-bottom:1px dashed #2a303a;
  }
  .trait-row:last-child{border-bottom:none;}
  .trait-cat{color:var(--muted); min-width:118px; flex-shrink:0;}
  .trait-val{color:var(--paper);}
  .peek-val{color:var(--neon); font-style:italic;}
  .peek-val::after{content:" 👁"; font-size:10px;}
  .redacted{
    background:repeating-linear-gradient(135deg,#000,#000 4px,#151515 4px,#151515 8px);
    color:transparent;
    border-radius:2px;
    padding:1px 6px;
    user-select:none;
  }
  .vote-count{
    font-size:11px;
    color:var(--amber);
  }
  body.vote-mode .vote-count{color:var(--red-alert);}
  .own-card{
    border:1px solid var(--amber);
    background:#1a1710;
    box-shadow:0 0 12px 2px rgba(230,179,37,0.5), 0 0 0 1px var(--amber) inset;
  }
  .stamp{
    display:inline-block;
    border:2px solid var(--rust);
    color:#e8a08c;
    font-family:'Oswald',sans-serif;
    letter-spacing:3px;
    padding:3px 10px;
    transform:rotate(-4deg);
    font-size:11px;
    margin-bottom:10px;
    border-radius:3px;
  }
  select{
    width:100%;
    background:var(--bg-0);
    border:1px solid var(--line);
    color:var(--paper);
    padding:11px 12px;
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    border-radius:2px;
    margin-bottom:14px;
  }
  .linkbox{
    background:var(--bg-0);
    border:1px solid var(--line);
    padding:10px 12px;
    font-size:11.5px;
    word-break:break-all;
    color:var(--muted);
    border-radius:2px;
    margin:10px 0;
    max-height:70px;
    overflow-y:auto;
  }
  .copied-msg{color:var(--green); font-size:12px; margin-left:8px;}
  details{margin-bottom:18px;}
  summary{
    cursor:pointer;
    font-family:'Oswald',sans-serif;
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-size:13px;
    color:var(--muted);
  }
  details[open] summary{color:var(--amber);}
  .rules-body{font-size:13px; line-height:1.7; color:var(--muted); padding-top:10px;}
  .rules-body b{color:var(--paper);}
  .final-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .final-item{
    background:var(--bg-0);
    border:1px solid var(--green);
    padding:12px 14px;
    border-radius:2px;
    font-family:'Oswald',sans-serif;
    letter-spacing:1px;
    font-size:16px;
  }
  .tiny{font-size:11px; color:var(--muted);}
  footer{
    text-align:center;
    color:#4a5260;
    font-size:11px;
    padding:30px 20px 10px;
  }
  .tabs{display:flex; gap:0; margin-bottom:16px; border-bottom:1px solid var(--line);}
  .tab{
    padding:10px 18px;
    font-family:'Oswald',sans-serif;
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-size:13px;
    color:var(--muted);
    cursor:pointer;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }
  .tab.active{color:var(--amber); border-bottom-color:var(--amber);}
  .room-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--bg-0);
    border:1px solid var(--amber-dim);
    padding:5px 12px;
    border-radius:20px;
    font-size:12px;
    letter-spacing:1px;
    color:var(--amber);
    margin-top:8px;
  }
  .dot-live{
    width:7px; height:7px; border-radius:50%;
    background:var(--green);
    box-shadow:0 0 6px var(--green);
  }
  .code-display{
    font-family:'Oswald',sans-serif;
    font-size:34px;
    letter-spacing:8px;
    color:var(--amber);
    text-align:center;
    padding:14px 0;
  }
  .error-msg{color:#e8a08c; font-size:13px; margin-top:6px;}
  .config-warning{
    background:#241a12;
    border:1px solid var(--rust);
    color:#f0c4a0;
    padding:16px;
    font-size:13px;
    line-height:1.7;
    border-radius:2px;
  }
</style>
</head>

function generateBunkerProfile(seats){
  const profile = {};
  ["food","water","power","medicine","security"].forEach(res=>{ profile[res] = pick(BUNKER_LEVELS); });
  const parts = ["Бункер рассчитан на "+seats+" человек."];
  parts.push(pick(BUNKER_TEXT.food[profile.food]));
  parts.push(pick(BUNKER_TEXT.water[profile.water]));
  parts.push(pick(BUNKER_TEXT.power[profile.power]));
  parts.push(pick(BUNKER_TEXT.medicine[profile.medicine]));
  parts.push(pick(BUNKER_TEXT.security[profile.security]));
  shuffle(BUNKER_QUIRKS).slice(0, randInt(1,2)).forEach(q=>parts.push(q));
  return { profile, text: parts.join(" ") };
}

function computeFinalOutcome(s){
  const survivors = s.p.filter(pl=>!pl.e);
  const jobs = s.jobs || {};
  let score = survivors.length; // больше рук — больше шансов на старте
  const roleLines = [];

  DUTY_ROLES.forEach(role=>{
    const assignedIdx = Object.keys(jobs).map(Number).find(i=>jobs[i]===role.id);
    if(assignedIdx===undefined || !s.p[assignedIdx] || s.p[assignedIdx].e){
      score -= 3; // важная обязанность осталась без ответственного
      roleLines.push(role.name+': эту обязанность никто не взял на себя.');
      return;
    }
    const pl = s.p[assignedIdx];
    let roleScore = 0;
    if(role.resource){
      roleScore += BUNKER_LEVEL_WEIGHT[(s.bunkerProfile||{})[role.resource]] || 0;
    } else {
      const primeAge = survivors.filter(p=>{
        const age = parseInt(p.v[7]); return !isNaN(age) && age>=18 && age<=45;
      }).length;
      roleScore += primeAge>=2 ? 2 : (primeAge===1 ? 0 : -2);
    }
    const fitBonus = playerFitsRole(pl, role);
    roleScore += fitBonus;
    score += roleScore;
    const verdict = roleScore>=2 ? 'справляется отлично' : (roleScore<=-1 ? 'справляется с большим трудом' : 'справляется на среднем уровне');
    roleLines.push(role.name+': '+pl.n+' — '+verdict+'.');
  });

  const tier = OUTCOME_TIERS.find(t=>score>=t.min) || OUTCOME_TIERS[OUTCOME_TIERS.length-1];
  return { score, tierLabel: tier.label, text: pick(tier.texts), roleLines };
}

const ALL_CATS_MASK = (1 << CATS.length) - 1;
const EARLY_VOTE_FROM_ROUND = 1; // досрочное голосование доступно с самого начала раскрытия в любом цикле
const SPECIAL_CHARGES = 2; // сколько раз за игру каждый игрок может применить одну из спецспособностей
const MIN_PLAYERS = 4;  // меньше — и в бункере сразу не осталось бы свободных мест
const MAX_PLAYERS = 10; // максимум участников за игру

// Сколько мест в бункере (сколько человек должно ОСТАТЬСЯ в живых к концу игры)
// в зависимости от того, сколько всего игроков участвует.
const SEATS_BY_COUNT = { 4:2, 5:3, 6:3, 7:3, 8:4, 9:4, 10:5 };
function finalSeats(totalPlayers){
  return SEATS_BY_COUNT[totalPlayers] || Math.max(2, Math.ceil(totalPlayers/2));
}

// Сколько голосований (исключений) потребуется всего за игру.
function votesNeededTotal(totalPlayers){
  return Math.max(1, totalPlayers - finalSeats(totalPlayers));
}

// Схема количества раундов раскрытия перед каждым циклом голосования.
// Раньше схема была фиксированной (2,2,1,1,...) и при малом числе нужных
// голосований (например, 4 игрока => всего 2 исключения) игра заканчивалась
// после всего 4 раундов раскрытия — почти никто ничего толком не успевал узнать.
// Теперь общее «целевое» число раундов раскрытия за игру распределяется по
// всем нужным циклам голосования поровну (с небольшим перевесом в начало),
// поэтому чем меньше нужно голосований, тем длиннее каждый цикл раскрытия.
const TARGET_TOTAL_REVEAL_ROUNDS = Math.min(CATS.length - 1, 7);
function buildRevealSchedule(totalPlayers){
  const cycles = votesNeededTotal(totalPlayers);
  const base = Math.floor(TARGET_TOTAL_REVEAL_ROUNDS / cycles);
  const extra = TARGET_TOTAL_REVEAL_ROUNDS % cycles;
  const schedule = [];
  for(let i=0;i<cycles;i++){
    schedule.push(Math.max(1, base + (i < extra ? 1 : 0)));
  }
  return schedule;
}
function revealRoundsForCycle(cycle, totalPlayers){
  const schedule = buildRevealSchedule(totalPlayers);
  const idx = Math.min(cycle, schedule.length) - 1;
  return schedule[Math.max(0, idx)];
}

function abilityById(id){ return ABILITIES.find(a=>a.id===id); }

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function randInt(min,max){return min + Math.floor(Math.random()*(max-min+1));}

function activeIdx(s){
  return s.p.map((pl,i)=>i).filter(i=>!s.p[i].e);
}
function currentTurnPlayer(s){
  const act = activeIdx(s);
  if(act.length===0) return -1;
  return act[s.tp % act.length];
}

function makeGame(names){
  const pooled = {};
  POOL_CAT_IDX.forEach(catIdx=>{ pooled[catIdx] = shuffle(POOLS[catIdx]).slice(0, names.length); });
  const abilityIds = ABILITIES.map(a=>a.id);
  const players = names.map((n,i)=>{
    const v = new Array(CATS.length);
    POOL_CAT_IDX.forEach(catIdx=>{ v[catIdx] = pooled[catIdx][i]; });
    v[6] = pick(GENDERS);
    v[7] = randInt(18,70) + " лет";
    v[8] = pick(ORIENTATIONS);
    const ab = shuffle(abilityIds).slice(0,2);
    return { n, v, r:0, e:false, ab, au:0, abUsed:[], shield:false };
  });
  const cata = pick(CATASTROPHES);
  const seats = finalSeats(names.length);
  const bunkerGen = generateBunkerProfile(seats);
  const numTwists = names.length <= 6 ? 1 : 2;
  const twists = shuffle(TWIST_POOL).slice(0, numTwists).map((text, i)=>({
    text, afterElim: i+1, revealed:false
  }));
  return {
    p:players,
    c:cata.t,
    cx:cata.fx,
    b:bunkerGen.text,
    bunkerProfile:bunkerGen.profile,
    ph:"reveal",
    rd:1,
    tp:0,
    vt:new Array(names.length).fill(-1),
    claims:new Array(names.length).fill(null),
    peeks:[],
    turnAbilityUsed:false,
    revealCycle:1,
    eliminationsCount:0,
    twists,
    tieReason:null,
    jobs:{}
  };
}

// Новое значение для способности "Пересдача": для пуловых категорий (0-5) берём
// значение, которое сейчас ни у кого не занято, чтобы характеристики оставались
// уникальными; для пола/возраста/ориентации просто генерируем заново.
function rerollValueFor(s, catIdx){
  if(POOL_CAT_IDX.includes(catIdx)){
    const used = s.p.map(pl=>pl.v[catIdx]);
    const candidates = POOLS[catIdx].filter(v=>!used.includes(v));
    return candidates.length ? pick(candidates) : pick(POOLS[catIdx]);
  }
  if(catIdx===6) return pick(GENDERS);
  if(catIdx===7) return randInt(18,70) + " лет";
  if(catIdx===8) return pick(ORIENTATIONS);
  return null;
}

/* ---------------- Раскрытие ---------------- */

function advanceAfterReveal(s){
  s.tp++;
  s.turnAbilityUsed = false;
  const act = activeIdx(s);
  if(s.tp >= act.length){
    s.tp = 0;
    if(s.ph === "tiebreak"){
      // спец-раунд после равенства голосов закончился — возвращаемся к голосованию без дальнейшей отсрочки
      switchToVote(s);
      return;
    }
    s.rd++;
    const roundsNeeded = revealRoundsForCycle(s.revealCycle||1, s.p.length);
    if(s.rd > roundsNeeded){
      switchToVote(s);
    }
  }
}

function switchToVote(s){
  s.ph = "vote";
  s.rd = 1;
  s.tp = 0;
  s.vt = new Array(s.p.length).fill(-1);
  s.turnAbilityUsed = false;
  s.tieReason = null;
}

/* ---------------- Голосование ---------------- */

function tallyAndEliminate(s){
  const activeBefore = activeIdx(s); // все, кто мог голосовать в этом раунде
  const extendVotes = s.vt.filter(v=>v===-2).length;

  const counts = {};
  s.vt.forEach(t=>{ if(t>=0) counts[t]=(counts[t]||0)+1; });

  // голоса, отданные против игрока, который защищён "Щитом", в этом раунде не считаются
  const eligible = Object.keys(counts).map(k=>parseInt(k)).filter(idx=>!s.p[idx].shield);
  let maxV = -1;
  eligible.forEach(idx=>{ if(counts[idx]>maxV) maxV = counts[idx]; });
  const topCandidates = eligible.filter(idx=>counts[idx]===maxV);

  s.vt = new Array(s.p.length).fill(-1);
  s.tp = 0;
  s.turnAbilityUsed = false;
  s.p.forEach(pl=>{ pl.shield = false; }); // щит расходуется на один подсчёт голосов, неважно, сработал он или нет

  // Если больше половины проголосовавших попросили продлить раскрытие — никого не исключаем
  if(extendVotes > 0 && extendVotes >= Math.ceil(activeBefore.length/2)){
    s.ph = "tiebreak";
    s.rd = 1;
    s.tieReason = "extend";
    return null;
  }

  if(maxV <= 0 || topCandidates.length !== 1){
    // ничья (несколько кандидатов набрали одинаковый максимум) — никого не исключаем.
    // Даём один дополнительный раунд раскрытия, чтобы у группы появилась новая информация
    // для принятия решения, а затем автоматически возвращаемся к голосованию.
    s.ph = "tiebreak";
    s.rd = 1;
    s.tieReason = "tie";
    return null;
  }

  const target = topCandidates[0];
  s.p[target].e = true;
  s.p[target].r = ALL_CATS_MASK; // выбывший сразу полностью раскрывается всем, как в конце игры
  s.eliminationsCount = (s.eliminationsCount||0) + 1;

  // проверяем, не пора ли раскрыть один из скрытых твистов
  if(Array.isArray(s.twists)){
    s.twists.forEach(tw=>{
      if(!tw.revealed && tw.afterElim <= s.eliminationsCount) tw.revealed = true;
    });
  }

  const seats = finalSeats(s.p.length);
  const act = activeIdx(s);
  if(act.length <= seats){
    // выживших ровно столько, сколько мест — переходим к распределению обязанностей
    s.ph = "assign";
    s.tp = 0;
    s.jobs = s.jobs || {};
  } else {
    // после каждого выбывания снова идём на раскрытие по расписанию, а не голосуем второй раз подряд
    s.ph = "reveal";
    s.rd = 1;
    s.revealCycle = (s.revealCycle||1) + 1;
  }
  return target;
}

function advanceAfterAssign(s){
  s.tp++;
  const act = activeIdx(s);
  if(s.tp >= act.length){
    s.finalOutcome = computeFinalOutcome(s);
    s.ph = "end";
  }
}

function advanceAfterVote(s){
  s.tp++;
  s.turnAbilityUsed = false;
  const act = activeIdx(s);
  if(s.tp >= act.length){
    return tallyAndEliminate(s);
  }
  return null;
}

/* ---------------- Firebase wiring ---------------- */

let db = null;
const configOk = firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf("ВСТАВЬ") === -1;

// Анонимная авторизация. Сама по себе она не "прячет" данные, но позволяет
// в правилах Firebase Realtime Database потребовать auth != null — то есть
// отклонять любые запросы напрямую через REST/curl без прохождения через
// Firebase Auth. Реальная защита данных всегда настраивается в разделе
// Rules консоли Firebase, а не в этом файле — см. пояснение в чате.
let authReady = false;
if(configOk){
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  firebase.auth().onAuthStateChanged(user=>{
    if(user){
      authReady = true;
      boot();
    }
  });
  firebase.auth().signInAnonymously().catch(err=>{
    console.error('Anonymous auth failed:', err);
    authReady = false;
    renderAuthError(err);
  });
}

let currentRoom = null;
let currentOffFn = null;
const prevRevealMasks = {}; // отслеживаем предыдущие битовые маски раскрытия для анимации "вспышки"

function genRoomCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";
  for(let i=0;i<4;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}

function roomLink(code){
  return location.origin + location.pathname + '?room=' + code;
}

function subscribeRoom(code){
  if(currentOffFn) currentOffFn();
  currentRoom = code;
  const ref = db.ref('rooms/'+code);
  const handler = (snap)=>{
    const s = snap.val();
    if(!s){ renderRoomMissing(code); return; }
    // старые комнаты, созданные до появления системы "мест", могли не иметь claims — добьём поле один раз
    if(!Array.isArray(s.claims) || s.claims.length !== s.p.length){
      const fixed = new Array(s.p.length).fill(null);
      (s.claims||[]).forEach((v,i)=>{ if(i<fixed.length) fixed[i] = v || null; });
      db.ref('rooms/'+code+'/claims').set(fixed);
      s.claims = fixed;
    }
    // старые комнаты могли быть созданы до появления особых способностей — раздадим их постфактум
    const needsAbilityFix = s.p.some(pl=>!Array.isArray(pl.ab) || !Array.isArray(pl.abUsed))
      || typeof s.turnAbilityUsed !== 'boolean'
      || typeof s.revealCycle !== 'number'
      || !s.bunkerProfile
      || typeof s.eliminationsCount !== 'number'
      || !Array.isArray(s.twists)
      || typeof s.jobs !== 'object' || s.jobs===null;
    if(needsAbilityFix){
      const abilityIds = ABILITIES.map(a=>a.id);
      s.p.forEach(pl=>{
        if(!Array.isArray(pl.ab)) pl.ab = shuffle(abilityIds).slice(0,2);
        if(typeof pl.au !== 'number') pl.au = 0;
        if(typeof pl.shield !== 'boolean') pl.shield = false;
        if(!Array.isArray(pl.abUsed)) pl.abUsed = [];
      });
      if(!Array.isArray(s.peeks)) s.peeks = [];
      if(typeof s.turnAbilityUsed !== 'boolean') s.turnAbilityUsed = false;
      if(typeof s.revealCycle !== 'number') s.revealCycle = 1;
      if(!s.bunkerProfile){
        const seats = finalSeats(s.p.length);
        const gen = generateBunkerProfile(seats);
        s.bunkerProfile = gen.profile;
        if(!s.b) s.b = gen.text;
      }
      if(typeof s.eliminationsCount !== 'number') s.eliminationsCount = s.p.filter(pl=>pl.e).length;
      if(!Array.isArray(s.twists)){
        const numTwists = s.p.length <= 6 ? 1 : 2;
        s.twists = shuffle(TWIST_POOL).slice(0, numTwists).map((text,i)=>({ text, afterElim:i+1, revealed:false }));
      }
      if(typeof s.jobs !== 'object' || s.jobs===null) s.jobs = {};
      if(typeof s.tieReason === 'undefined') s.tieReason = null;
      db.ref('rooms/'+code).update({
        p: s.p,
        peeks: s.peeks,
        turnAbilityUsed: s.turnAbilityUsed,
        revealCycle: s.revealCycle,
        bunkerProfile: s.bunkerProfile,
        b: s.b,
        eliminationsCount: s.eliminationsCount,
        twists: s.twists,
        jobs: s.jobs,
        tieReason: s.tieReason
      });
    }
    renderGame(s, code);
  };
  ref.on('value', handler);
  currentOffFn = ()=> ref.off('value', handler);
}

function pushState(s){
  db.ref('rooms/'+currentRoom).set(s);
}

/* ---------------- Идентификация игрока на этом устройстве ---------------- */
// Каждый браузер получает свой случайный deviceId, который сохраняется локально.
// Место (индекс игрока) в конкретной комнате привязывается к deviceId через
// Firebase-транзакцию, поэтому дважды "занять" одно и то же место с разных
// устройств нельзя, а посмотреть чужие раскрытые-в-своей-голове характеристики
// через выбор чужого имени в списке больше невозможно — такого списка нет.
function getDeviceId(){
  let id = null;
  try{ id = localStorage.getItem('bunker_device_id'); }catch(e){}
  if(!id){
    id = 'dev_' + Math.random().toString(36).slice(2) + '_' + Date.now().toString(36);
    try{ localStorage.setItem('bunker_device_id', id); }catch(e){}
  }
  return id;
}
const myDeviceId = getDeviceId();

function myPlayerIdx(s){
  if(!Array.isArray(s.claims)) return -1;
  return s.claims.findIndex(c=>c===myDeviceId);
}

// Возвращает Promise: 'ok' | 'taken'
function claimSeat(code, idx, deviceId){
  return db.ref('rooms/'+code+'/claims/'+idx).transaction(current=>{
    if(current===null || current===undefined) return deviceId;
    return; // не трогаем — место уже занято (abort)
  }).then(result=>{
    if(result.committed && result.snapshot.val()===deviceId) return 'ok';
    return 'taken';
  });
}

function releaseSeat(code, idx){
  db.ref('rooms/'+code+'/claims/'+idx).set(null);
}

/* ---------------- DOM helpers ---------------- */

function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==="html") e.innerHTML=v;
    else if(k==="text") e.textContent=v;
    else e.setAttribute(k,v);
  });
  (Array.isArray(children)?children:[children]).forEach(c=>{ if(c) e.appendChild(c); });
  return e;
}

function traitRow(catIdx, value, revealed, justRevealed, peeked){
  const row = el('div',{class:'trait-row'+(justRevealed?' reveal-flash':'')});
  row.appendChild(el('span',{class:'trait-cat', text:CATS[catIdx]}));
  if(revealed){
    row.appendChild(el('span',{class:'trait-val', text:value}));
  } else if(peeked){
    row.appendChild(el('span',{class:'trait-val peek-val', text:value, title:'Видно только тебе — узнано способностью «Тайный осведомитель»'}));
  } else {
    row.appendChild(el('span',{class:'redacted', text:value}));
  }
  return row;
}

function renderRoster(s, opts={}){
  const roster = el('div',{class:'roster'});
  const viewerIdx = opts.ownIdx;

  // игрок(и), набравшие сейчас больше всего голосов в этом раунде, но ещё не исключённые —
  // подсвечиваются красной рамкой как "под угрозой"
  let voteLeaders = [];
  if(s.ph==='vote'){
    const counts = {};
    s.vt.forEach(t=>{ if(t>=0) counts[t]=(counts[t]||0)+1; });
    let maxV = 0;
    Object.values(counts).forEach(c=>{ if(c>maxV) maxV=c; });
    if(maxV>0) voteLeaders = Object.keys(counts).filter(k=>counts[k]===maxV).map(Number);
  }

  s.p.forEach((pl,i)=>{
    const isTurn = !pl.e && i===currentTurnPlayer(s) && opts.highlightTurn;
    const isOwn = opts.ownIdx===i;
    const isLeader = !pl.e && voteLeaders.includes(i);
    const card = el('div',{class:'dossier fade-in-up'
      +(pl.e?' out':'')
      +(isTurn && !isOwn ? ' active-turn':'')
      +(isOwn?' own-card':'')
      +(isLeader?' vote-leader':'')
    });
    const nameRow = el('div',{class:'pname'});
    nameRow.appendChild(el('span',{text:pl.n}));
    if(pl.shield && (isOwn || s.ph!=='vote')) nameRow.appendChild(el('span',{class:'vote-count', style:'color:var(--neon)', text:'🛡 ЩИТ'}));
    if(s.ph==='vote' && !pl.e){
      const vc = s.vt.filter(t=>t===i).length;
      if(vc>0) nameRow.appendChild(el('span',{class:'vote-count', text:vc+' ГОЛОС(А)'}));
    }
    card.appendChild(nameRow);
    const prevMask = prevRevealMasks[i] !== undefined ? prevRevealMasks[i] : pl.r;
    for(let c=0;c<CATS.length;c++){
      const revealed = !!((pl.r>>c)&1);
      const wasRevealed = !!((prevMask>>c)&1);
      const justRevealed = revealed && !wasRevealed;
      const peeked = !revealed && viewerIdx>=0 && Array.isArray(s.peeks) &&
        s.peeks.some(pk=>pk.viewer===viewerIdx && pk.target===i && pk.cat===c);
      card.appendChild(traitRow(c, pl.v[c], revealed, justRevealed, peeked));
    }
    roster.appendChild(card);
  });
  s.p.forEach((pl,i)=>{ prevRevealMasks[i] = pl.r; });
  return roster;
}

function roomBadgeRow(code){
  const wrap = el('div',{class:'row', style:'justify-content:space-between; align-items:center;'});
  const badge = el('div',{class:'room-badge'});
  badge.appendChild(el('span',{class:'dot-live'}));
  badge.appendChild(el('span',{text:'КОМНАТА '+code+' · ОНЛАЙН'}));
  wrap.appendChild(badge);
  const btn = el('button',{text:'Скопировать ссылку-приглашение'});
  const msg = el('span',{class:'copied-msg', text:''});
  btn.onclick = async ()=>{
    try{ await navigator.clipboard.writeText(roomLink(code)); msg.textContent='✓ скопировано'; }
    catch(e){ msg.textContent = roomLink(code); }
  };
  const right = el('div',{class:'row'},[btn, msg]);
  wrap.appendChild(right);
  return wrap;
}

let vfxCtx = null, vfxCanvasEl = null, vfxParticles = [], vfxType = null, vfxRaf = null;

function initVfxCanvas(){
  vfxCanvasEl = document.getElementById('vfxCanvas');
  vfxCtx = vfxCanvasEl.getContext('2d');
  resizeVfx();
  window.addEventListener('resize', resizeVfx);
  loopVfx();
}
function resizeVfx(){
  if(!vfxCanvasEl) return;
  vfxCanvasEl.width = window.innerWidth;
  vfxCanvasEl.height = window.innerHeight;
}
function seedParticles(type){
  const W = vfxCanvasEl.width, H = vfxCanvasEl.height;
  const count = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 70;
  vfxParticles = [];
  for(let i=0;i<count;i++){
    vfxParticles.push({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*2.4+0.8,
      vy:Math.random()*0.6+0.3,
      vx:(Math.random()-0.5)*0.4,
      alpha:Math.random()*0.6+0.3,
      phase:Math.random()*Math.PI*2
    });
  }
}
function setVfx(type){
  if(vfxType === type) return;
  vfxType = type;
  seedParticles(type);
}
function colorForType(type){
  switch(type){
    case 'ash': return ['180,170,160','230,110,40'];
    case 'snow': return ['255,255,255','170,210,255'];
    case 'spores': return ['110,230,140','60,180,90'];
    case 'glitch': return ['80,255,170','160,255,220'];
    case 'embers': return ['255,170,60','255,90,40'];
    default: return ['230,179,37','200,140,20'];
  }
}
function loopVfx(){
  vfxRaf = requestAnimationFrame(loopVfx);
  if(!vfxCtx) return;
  const W = vfxCanvasEl.width, H = vfxCanvasEl.height;
  vfxCtx.clearRect(0,0,W,H);
  if(!vfxType) return;
  const [c1,c2] = colorForType(vfxType);

  if(vfxType === 'glitch'){
    // зелёный туман + случайные горизонтальные полосы искажения
    vfxCtx.fillStyle = 'rgba('+c1+',0.05)';
    vfxCtx.fillRect(0,0,W,H);
    if(Math.random() < 0.18){
      const y = Math.random()*H;
      const h = 4 + Math.random()*18;
      vfxCtx.fillStyle = 'rgba('+c2+',0.18)';
      vfxCtx.fillRect(0, y, W, h);
    }
    vfxParticles.forEach(p=>{
      p.x += Math.sin(p.phase)*0.6;
      p.phase += 0.02;
      p.y += p.vy*0.3;
      if(p.y>H) p.y=0;
      vfxCtx.fillStyle = 'rgba('+c1+','+p.alpha*0.5+')';
      vfxCtx.fillRect(p.x, p.y, 1.5, 1.5);
    });
    return;
  }

  vfxParticles.forEach(p=>{
    p.y += p.vy * (vfxType==='snow'?0.8:1.2);
    p.x += p.vx + (vfxType==='spores' ? Math.sin(p.phase)*0.3 : 0);
    p.phase += 0.03;
    if(p.y > H){ p.y = -5; p.x = Math.random()*W; }
    if(p.x > W) p.x = 0;
    if(p.x < 0) p.x = W;
    const col = (vfxType==='embers' && Math.random()<0.02) ? c2 : c1;
    vfxCtx.beginPath();
    vfxCtx.fillStyle = 'rgba('+col+','+p.alpha+')';
    vfxCtx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    vfxCtx.fill();
  });
}

    <b>Раскрытие.</b> На своём ходу игрок сам решает, какую из ещё скрытых характеристик показать всем
    (профессия, здоровье, хобби, фобия, багаж, секрет, пол, возраст, ориентация). В любой момент раскрытия
    можно предложить перейти сразу к голосованию досрочно.<br><br>
    <b>Цикл игры.</b> Число раундов раскрытия перед каждым голосованием подстраивается под то, сколько
    всего исключений нужно провести: чем меньше игроков придётся выгнать, тем длиннее и содержательнее

    уверена, кого исключать, вместо голоса можно предложить продлить раскрытие — если так выскажется
    больше половины голосующих, исключения в этом раунде не будет.<br><br>
    <b>Скрытые твисты.</b> После одного-двух исключений (зависит от числа игроков) всем внезапно
    открывается неожиданная подробность о бункере или катастрофе — она может изменить расклад сил.<br><br>
    <b>Финал и распределение обязанностей.</b> Как только в бункере остаётся нужное число выживших, они
    по очереди распределяют между собой обязанности (провизия и вода, ремонт и энергетика, медицина,
    безопасность, будущее общины). От того, кто и что на себя взял — с учётом профессии, хобби и того,
    что реально есть в бункере, — зависит итоговый вердикт: выживет группа или нет, и с каким сюжетным
    продолжением.<br><br>
    <span class="tiny">Все данные хранятся в общей базе данных на время игры — это игра на доверии между друзьями, а не защищённая система.</span>
  `}));
  app.appendChild(rules);
}

/* ---------------- Особые способности: UI ---------------- */

function renderAbilityPanel(app, s, myIdx){
  const me = s.p[myIdx];
  const usesLeft = MAX_ABILITY_USES - (me.au||0);
  const abUsed = Array.isArray(me.abUsed) ? me.abUsed : [];
  const abilityPanel = el('div',{class:'panel fade-in-up', 'data-tag':'Особые способности'});
  abilityPanel.appendChild(el('p',{class:'tiny', text:'Осталось использований: '+usesLeft+' из '+MAX_ABILITY_USES+' за игру. Каждую свою способность можно применить только один раз, и не больше одной способности за один ход.'}));

  if(usesLeft<=0){
    abilityPanel.appendChild(el('p',{class:'tiny', text:'Способности закончились — играй дальше обычным ходом ниже.'}));
    app.appendChild(abilityPanel);
    return;
  }

  if(s.turnAbilityUsed){
    abilityPanel.appendChild(el('p',{class:'tiny', text:'В этот ход способность уже применялась. Новую можно будет использовать со следующего своего хода.'}));
    app.appendChild(abilityPanel);
    return;
  }

  const myAbilities = (me.ab||[]).map(id=>abilityById(id)).filter(Boolean);
  myAbilities.forEach(ab=>{
    const row = el('div',{style:'border-bottom:1px dashed #2a303a; padding:10px 0;'});
    row.appendChild(el('div',{style:'font-family:Oswald,sans-serif; letter-spacing:1px; color:var(--amber);', text:ab.name}));
    row.appendChild(el('p',{class:'tiny', style:'margin:4px 0 8px;', text:ab.desc}));

    if(abUsed.includes(ab.id)){
      row.appendChild(el('p',{class:'tiny', text:'Уже использована в этой игре.'}));
      abilityPanel.appendChild(row);
      return;
    }

    const phaseOk = !ab.phase ||
      (ab.phase==='vote' && s.ph==='vote') ||
      (ab.phase==='reveal' && (s.ph==='reveal' || s.ph==='tiebreak'));

    if(!phaseOk){
      row.appendChild(el('p',{class:'tiny', text:'Недоступно в текущей фазе.'}));
      abilityPanel.appendChild(row);
      return;
    }

    const holder = el('div');
    row.appendChild(holder);
    abilityPanel.appendChild(row);
    renderAbilityControls(holder, ab, s, myIdx);
  });

  app.appendChild(abilityPanel);
}

function renderAbilityControls(holder, ab, s, myIdx){
  const useBtn = el('button',{class:'ghost', text:'Использовать: '+ab.name});
  const formArea = el('div',{style:'display:none; margin-top:8px;'});
  holder.appendChild(useBtn);
  holder.appendChild(formArea);
  useBtn.onclick = ()=>{
    useBtn.style.display = 'none';
    formArea.style.display = 'block';
    buildAbilityForm(formArea, ab, s, myIdx);
  };
}

function buildAbilityForm(container, ab, s, myIdx){
  container.innerHTML = '';

  const confirmAndApply = (mutator)=>{
    const next = JSON.parse(JSON.stringify(s));
    mutator(next);
    next.p[myIdx].au = (next.p[myIdx].au||0) + 1;
    next.p[myIdx].abUsed = Array.isArray(next.p[myIdx].abUsed) ? next.p[myIdx].abUsed.slice() : [];
    if(!next.p[myIdx].abUsed.includes(ab.id)) next.p[myIdx].abUsed.push(ab.id);
    next.turnAbilityUsed = true; // не более одной способности за ход
    pushState(next);
  };

  if(ab.type==='reveal_other' || ab.type==='peek_other'){
    const targetSel = el('select');
    targetSel.appendChild(el('option',{value:'', text:'Выбери игрока'}));
    s.p.forEach((pl,i)=>{ if(!pl.e && i!==myIdx) targetSel.appendChild(el('option',{value:i, text:pl.n})); });
    container.appendChild(targetSel);

    const catSel = el('select');
    catSel.appendChild(el('option',{value:'', text:'Сначала выбери игрока'}));
    container.appendChild(catSel);

    targetSel.onchange = ()=>{
      const ti = parseInt(targetSel.value);
      catSel.innerHTML = '';
      if(isNaN(ti)){ catSel.appendChild(el('option',{value:'', text:'Сначала выбери игрока'})); return; }
      const hiddenCats = [];
      for(let c=0;c<CATS.length;c++){ if(!((s.p[ti].r>>c)&1)) hiddenCats.push(c); }
      if(hiddenCats.length===0){ catSel.appendChild(el('option',{value:'', text:'У него уже всё раскрыто'})); return; }
      catSel.appendChild(el('option',{value:'', text:'Выбери характеристику'}));
      hiddenCats.forEach(c=>catSel.appendChild(el('option',{value:c, text:CATS[c]})));
    };

    const btn = el('button',{class:'primary', text:'Подтвердить'});
    btn.onclick = ()=>{
      const ti = parseInt(targetSel.value), ci = parseInt(catSel.value);
      if(isNaN(ti) || isNaN(ci)) return;
      confirmAndApply(next=>{
        if(ab.type==='reveal_other'){
          next.p[ti].r = next.p[ti].r | (1<<ci);
        } else {
          next.peeks = next.peeks || [];
          next.peeks.push({viewer:myIdx, target:ti, cat:ci});
        }
      });
    };
    container.appendChild(btn);

  } else if(ab.type==='reroll_own'){
    const mask = s.p[myIdx].r;
    const hidden = [];
    for(let c=0;c<CATS.length;c++){ if(!((mask>>c)&1)) hidden.push(c); }
    if(hidden.length===0){
      container.appendChild(el('p',{class:'tiny', text:'У тебя уже всё раскрыто — нечего менять.'}));
      return;
    }
    const catSel = el('select');
    catSel.appendChild(el('option',{value:'', text:'Какую характеристику пересдать?'}));
    hidden.forEach(c=>catSel.appendChild(el('option',{value:c, text:CATS[c]})));
    container.appendChild(catSel);
    const btn = el('button',{class:'primary', text:'Подтвердить'});
    btn.onclick = ()=>{
      const ci = parseInt(catSel.value);
      if(isNaN(ci)) return;
      confirmAndApply(next=>{
        const newVal = rerollValueFor(next, ci);
        if(newVal!==null) next.p[myIdx].v[ci] = newVal;
      });
    };
    container.appendChild(btn);

  } else if(ab.type==='cancel_vote'){
    const voters = s.p.map((pl,i)=>i).filter(i=>!s.p[i].e && s.vt[i]>=0);
    if(voters.length===0){
      container.appendChild(el('p',{class:'tiny', text:'Пока никто не проголосовал в этом раунде.'}));
      return;
    }
    const voterSel = el('select');
    voterSel.appendChild(el('option',{value:'', text:'Чей голос аннулировать?'}));
    voters.forEach(i=>voterSel.appendChild(el('option',{value:i, text:s.p[i].n+' → '+s.p[s.vt[i]].n})));
    container.appendChild(voterSel);
    const btn = el('button',{class:'danger', text:'Подтвердить'});
    btn.onclick = ()=>{
      const vi = parseInt(voterSel.value);
      if(isNaN(vi)) return;
      confirmAndApply(next=>{ next.vt[vi] = -1; });
    };
    container.appendChild(btn);

  } else if(ab.type==='shield_self'){
    container.appendChild(el('p',{class:'tiny', text:'Щит защитит тебя при следующем подсчёте голосов в этом раунде.'}));
    const btn = el('button',{class:'primary', text:'Активировать щит'});
    btn.onclick = ()=>{
      confirmAndApply(next=>{ next.p[myIdx].shield = true; });
    };
    container.appendChild(btn);

  } else if(ab.type==='extend_reveal'){
    container.appendChild(el('p',{class:'tiny', text:'Раскрытие продлится ещё на один раунд перед автоматическим переходом к голосованию.'}));
    const btn = el('button',{class:'primary', text:'Отложить голосование'});
    btn.onclick = ()=>{
      confirmAndApply(next=>{ next.rd = Math.max(1, next.rd - 1); });
    };
    container.appendChild(btn);

  } else if(ab.type==='reveal_other_double'){
    const targetSel = el('select');
    targetSel.appendChild(el('option',{value:'', text:'Выбери игрока'}));
    s.p.forEach((pl,i)=>{
      if(pl.e || i===myIdx) return;
      let hasHidden=false; for(let c=0;c<CATS.length;c++){ if(!((pl.r>>c)&1)){ hasHidden=true; break; } }
      if(hasHidden) targetSel.appendChild(el('option',{value:i, text:pl.n}));
    });
    container.appendChild(targetSel);
    const btn = el('button',{class:'primary', text:'Раскрыть 2 характеристики'});
    btn.onclick = ()=>{
      const ti = parseInt(targetSel.value);
      if(isNaN(ti)) return;
      confirmAndApply(next=>{
        const mask = next.p[ti].r;
        const hiddenCats = [];
        for(let c=0;c<CATS.length;c++){ if(!((mask>>c)&1)) hiddenCats.push(c); }
        shuffle(hiddenCats).slice(0,2).forEach(c=>{ next.p[ti].r = next.p[ti].r | (1<<c); });
      });
    };
    container.appendChild(btn);

  } else if(ab.type==='reveal_all_category'){
    const catSel = el('select');
    catSel.appendChild(el('option',{value:'', text:'Какую категорию раскрыть у всех?'}));
    CATS.forEach((name,c)=>catSel.appendChild(el('option',{value:c, text:name})));
    container.appendChild(catSel);
    const btn = el('button',{class:'primary', text:'Раскрыть у всех'});
    btn.onclick = ()=>{
      const ci = parseInt(catSel.value);
      if(isNaN(ci)) return;
      confirmAndApply(next=>{
        next.p.forEach(pl=>{ if(!pl.e) pl.r = pl.r | (1<<ci); });
      });
    };
    container.appendChild(btn);

  } else if(ab.type==='peek_other_double'){
    const mkTargetSel = ()=>{
      const sel = el('select');
      sel.appendChild(el('option',{value:'', text:'Выбери игрока'}));
      s.p.forEach((pl,i)=>{ if(!pl.e && i!==myIdx) sel.appendChild(el('option',{value:i, text:pl.n})); });
      return sel;
    };
    const mkCatSel = (targetSel)=>{
      const sel = el('select');
      sel.appendChild(el('option',{value:'', text:'Сначала выбери игрока'}));
      targetSel.onchange = ()=>{
        const ti = parseInt(targetSel.value);
        sel.innerHTML = '';
        if(isNaN(ti)){ sel.appendChild(el('option',{value:'', text:'Сначала выбери игрока'})); return; }
        const hiddenCats = [];
        for(let c=0;c<CATS.length;c++){ if(!((s.p[ti].r>>c)&1)) hiddenCats.push(c); }
        if(hiddenCats.length===0){ sel.appendChild(el('option',{value:'', text:'У него уже всё раскрыто'})); return; }
        sel.appendChild(el('option',{value:'', text:'Выбери характеристику'}));
        hiddenCats.forEach(c=>sel.appendChild(el('option',{value:c, text:CATS[c]})));
      };
      return sel;
    };
    container.appendChild(el('p',{class:'tiny', text:'Первый игрок и характеристика:'}));
    const target1 = mkTargetSel(); container.appendChild(target1);
    const cat1 = mkCatSel(target1); container.appendChild(cat1);
    container.appendChild(el('p',{class:'tiny', style:'margin-top:10px;', text:'Второй игрок и характеристика:'}));
    const target2 = mkTargetSel(); container.appendChild(target2);
    const cat2 = mkCatSel(target2); container.appendChild(cat2);

    const btn = el('button',{class:'primary', style:'margin-top:10px;', text:'Подтвердить'});
    btn.onclick = ()=>{
      const t1=parseInt(target1.value), c1=parseInt(cat1.value);
      const t2=parseInt(target2.value), c2=parseInt(cat2.value);
      if(isNaN(t1)||isNaN(c1)||isNaN(t2)||isNaN(c2)) return;
      confirmAndApply(next=>{
        next.peeks = next.peeks || [];
        next.peeks.push({viewer:myIdx, target:t1, cat:c1});
        next.peeks.push({viewer:myIdx, target:t2, cat:c2});
      });
    };
    container.appendChild(btn);

  } else if(ab.type==='swap_trait'){
    const myHidden = [];
    for(let c=0;c<CATS.length;c++){ if(!((s.p[myIdx].r>>c)&1)) myHidden.push(c); }
    if(myHidden.length===0){
      container.appendChild(el('p',{class:'tiny', text:'У тебя уже всё раскрыто — обмениваться нечем.'}));
      return;
    }
    const catSel = el('select');
    catSel.appendChild(el('option',{value:'', text:'Какой своей характеристикой обменяться?'}));
    myHidden.forEach(c=>catSel.appendChild(el('option',{value:c, text:CATS[c]})));
    container.appendChild(catSel);

    const targetSel = el('select');
    targetSel.appendChild(el('option',{value:'', text:'Сначала выбери категорию'}));
    container.appendChild(targetSel);

    catSel.onchange = ()=>{
      const ci = parseInt(catSel.value);
      targetSel.innerHTML = '';
      if(isNaN(ci)){ targetSel.appendChild(el('option',{value:'', text:'Сначала выбери категорию'})); return; }
      const candidates = s.p.map((pl,i)=>i).filter(i=>i!==myIdx && !s.p[i].e && !((s.p[i].r>>ci)&1));
      if(candidates.length===0){ targetSel.appendChild(el('option',{value:'', text:'Ни у кого эта категория не скрыта'})); return; }
      targetSel.appendChild(el('option',{value:'', text:'Выбери игрока'}));
      candidates.forEach(i=>targetSel.appendChild(el('option',{value:i, text:s.p[i].n})));
    };

    const btn = el('button',{class:'primary', text:'Обменяться'});
    btn.onclick = ()=>{
      const ci = parseInt(catSel.value), ti = parseInt(targetSel.value);
      if(isNaN(ci) || isNaN(ti)) return;
      confirmAndApply(next=>{
        const tmp = next.p[myIdx].v[ci];
        next.p[myIdx].v[ci] = next.p[ti].v[ci];
        next.p[ti].v[ci] = tmp;
      });
    };
    container.appendChild(btn);

  } else if(ab.type==='reroll_other'){
    const targetSel = el('select');
    targetSel.appendChild(el('option',{value:'', text:'Выбери игрока'}));
    s.p.forEach((pl,i)=>{ if(!pl.e && i!==myIdx) targetSel.appendChild(el('option',{value:i, text:pl.n})); });
    container.appendChild(targetSel);

    const catSel = el('select');
    catSel.appendChild(el('option',{value:'', text:'Сначала выбери игрока'}));
    container.appendChild(catSel);

    targetSel.onchange = ()=>{
      const ti = parseInt(targetSel.value);
      catSel.innerHTML = '';
      if(isNaN(ti)){ catSel.appendChild(el('option',{value:'', text:'Сначала выбери игрока'})); return; }
      const hiddenCats = [];
      for(let c=0;c<CATS.length;c++){ if(!((s.p[ti].r>>c)&1)) hiddenCats.push(c); }
      if(hiddenCats.length===0){ catSel.appendChild(el('option',{value:'', text:'У него уже всё раскрыто'})); return; }
      catSel.appendChild(el('option',{value:'', text:'Выбери характеристику'}));
      hiddenCats.forEach(c=>catSel.appendChild(el('option',{value:c, text:CATS[c]})));
    };

    const btn = el('button',{class:'primary', text:'Подменить незаметно'});
    btn.onclick = ()=>{
      const ti = parseInt(targetSel.value), ci = parseInt(catSel.value);
      if(isNaN(ti) || isNaN(ci)) return;
      confirmAndApply(next=>{
        const newVal = rerollValueFor(next, ci);
        if(newVal!==null) next.p[ti].v[ci] = newVal;
      });
    };
    container.appendChild(btn);

  } else if(ab.type==='shield_pair'){
    const targetSel = el('select');
    targetSel.appendChild(el('option',{value:'', text:'Кого защитить вместе с собой?'}));
    s.p.forEach((pl,i)=>{ if(!pl.e && i!==myIdx) targetSel.appendChild(el('option',{value:i, text:pl.n})); });
    container.appendChild(targetSel);
    const btn = el('button',{class:'primary', text:'Активировать двойной щит'});
    btn.onclick = ()=>{
      const ti = parseInt(targetSel.value);
      if(isNaN(ti)) return;
      confirmAndApply(next=>{
        next.p[myIdx].shield = true;
        next.p[ti].shield = true;
      });
    };
    container.appendChild(btn);

  } else if(ab.type==='redirect_vote'){
    const voters = s.p.map((pl,i)=>i).filter(i=>!s.p[i].e && s.vt[i]>=0);
    if(voters.length===0){
      container.appendChild(el('p',{class:'tiny', text:'Пока никто не проголосовал в этом раунде.'}));
      return;
    }
    const voterSel = el('select');
    voterSel.appendChild(el('option',{value:'', text:'Чей голос перенаправить?'}));
    voters.forEach(i=>voterSel.appendChild(el('option',{value:i, text:s.p[i].n+' → '+s.p[s.vt[i]].n})));
    container.appendChild(voterSel);

    const newTargetSel = el('select');
    newTargetSel.appendChild(el('option',{value:'', text:'Сначала выбери голос'}));
    container.appendChild(newTargetSel);

    voterSel.onchange = ()=>{
      const vi = parseInt(voterSel.value);
      newTargetSel.innerHTML = '';
      if(isNaN(vi)){ newTargetSel.appendChild(el('option',{value:'', text:'Сначала выбери голос'})); return; }
      newTargetSel.appendChild(el('option',{value:'', text:'Новая цель голоса'}));
      s.p.forEach((pl,i)=>{ if(!pl.e && i!==vi) newTargetSel.appendChild(el('option',{value:i, text:pl.n})); });
    };

    const btn = el('button',{class:'danger', text:'Перенаправить'});
    btn.onclick = ()=>{
      const vi = parseInt(voterSel.value), nt = parseInt(newTargetSel.value);
      if(isNaN(vi) || isNaN(nt)) return;
      confirmAndApply(next=>{ next.vt[vi] = nt; });
    };
    container.appendChild(btn);

  } else if(ab.type==='clear_all_votes'){
    const anyVotes = s.vt.some(v=>v>=0);
    if(!anyVotes){
      container.appendChild(el('p',{class:'tiny', text:'В этом раунде пока никто не голосовал.'}));
      return;
    }
    container.appendChild(el('p',{class:'tiny', text:'Все голоса, поданные в этом раунде, будут аннулированы — раунд голосования начнётся заново.'}));
    const btn = el('button',{class:'danger', text:'Аннулировать все голоса'});
    btn.onclick = ()=>{
      confirmAndApply(next=>{ next.vt = new Array(next.p.length).fill(-1); });
    };
    container.appendChild(btn);

  } else if(ab.type==='extend_reveal_long'){
    container.appendChild(el('p',{class:'tiny', text:'Раскрытие продлится ещё на два раунда перед автоматическим переходом к голосованию.'}));
    const btn = el('button',{class:'primary', text:'Отложить голосование на 2 раунда'});
    btn.onclick = ()=>{
      confirmAndApply(next=>{ next.rd = Math.max(1, next.rd - 2); });
    };
    container.appendChild(btn);

  } else if(ab.type==='reveal_self_extra'){
    const mask = s.p[myIdx].r;
    const hidden = [];
    for(let c=0;c<CATS.length;c++){ if(!((mask>>c)&1)) hidden.push(c); }
    if(hidden.length===0){
      container.appendChild(el('p',{class:'tiny', text:'У тебя уже раскрыто всё, что можно.'}));
      return;
    }
    const catSel = el('select');
    catSel.appendChild(el('option',{value:'', text:'Какую характеристику раскрыть дополнительно?'}));
    hidden.forEach(c=>catSel.appendChild(el('option',{value:c, text:CATS[c]})));
    container.appendChild(catSel);
    const btn = el('button',{class:'primary', text:'Раскрыть дополнительно'});
    btn.onclick = ()=>{
      const ci = parseInt(catSel.value);
      if(isNaN(ci)) return;
      confirmAndApply(next=>{ next.p[myIdx].r = next.p[myIdx].r | (1<<ci); });
    };
    container.appendChild(btn);
  }
}

function renderGame(s, code){
  setVfx(s.cx || null);
  document.body.classList.toggle('vote-mode', s.ph === 'vote');

  const app = document.getElementById('app');
  app.innerHTML = '';

  const myIdx = myPlayerIdx(s);

  const badgePanel = el('div',{class:'panel', style:'padding:12px 20px;'});
  badgePanel.appendChild(roomBadgeRow(code));
  if(myIdx>=0){
    const idRow = el('div',{class:'row', style:'margin-top:10px; justify-content:space-between;'});
    idRow.appendChild(el('div',{class:'tiny', html:'Ты играешь за: <b style="color:var(--amber)">'+s.p[myIdx].n+'</b>'}));
    const resetBtn = el('button',{class:'ghost', style:'font-size:11px; padding:8px 12px;', text:'Это не я (сбросить место)'});
    resetBtn.onclick = ()=>{ if(confirm('Освободить это место? Придётся выбрать его заново.')) releaseSeat(code, myIdx); };
    idRow.appendChild(resetBtn);
    badgePanel.appendChild(idRow);
  }
  app.appendChild(badgePanel);

  const alertPanel = el('div',{class:'panel fade-in-up', 'data-tag':'Сводка ситуации'});
  alertPanel.appendChild(el('div',{class:'alert-ticker', html:'<b>ТРЕВОГА:</b> '+s.c}));
  alertPanel.appendChild(el('div',{class:'bunker-info', text:s.b}));
  app.appendChild(alertPanel);

  const revealedTwists = Array.isArray(s.twists) ? s.twists.filter(tw=>tw.revealed) : [];
  if(revealedTwists.length>0){
    const twistPanel = el('div',{class:'panel fade-in-up', 'data-tag':'Внезапная подробность'});
    revealedTwists.forEach(tw=>{
      twistPanel.appendChild(el('div',{class:'alert-ticker', style:'border-color:var(--neon); color:#bff7ff; margin-bottom:8px;', html:'<b>ТВИСТ:</b> '+tw.text}));
    });
    app.appendChild(twistPanel);
  }

  const turnIdx = currentTurnPlayer(s);
  const turnName = turnIdx>=0 ? s.p[turnIdx].n : '—';

  if(s.ph==='end'){
    document.getElementById('statusLine').textContent = 'симуляция завершена';
    document.body.classList.remove('vote-mode');
    const panel = el('div',{class:'panel fade-in-up', 'data-tag':'Итог'});
    panel.appendChild(el('h3',{text:'Двери бункера закрыты.', style:'font-family:Oswald,sans-serif; letter-spacing:1px;'}));
    const list = el('div',{class:'final-list'});
    s.p.forEach((pl,i)=>{ if(!pl.e) list.appendChild(el('div',{class:'final-item', text:'✓ '+pl.n})); });
    panel.appendChild(list);
    app.appendChild(panel);

    if(s.finalOutcome){
      const outcomePanel = el('div',{class:'panel fade-in-up', 'data-tag':'Судьба общины'});
      outcomePanel.appendChild(el('div',{class:'stamp', text:s.finalOutcome.tierLabel}));
      if(Array.isArray(s.finalOutcome.roleLines) && s.finalOutcome.roleLines.length){
        const rolesBox = el('div',{style:'margin-bottom:12px;'});
        s.finalOutcome.roleLines.forEach(line=>rolesBox.appendChild(el('p',{class:'tiny', style:'margin:4px 0;', text:line})));
        outcomePanel.appendChild(rolesBox);
      }
      outcomePanel.appendChild(el('p',{style:'line-height:1.7;', text:s.finalOutcome.text}));
      app.appendChild(outcomePanel);
    }

    const dossierPanel = el('div',{class:'panel fade-in-up','data-tag':'Полное досье'});
    const full = document.createElement('div');
    full.className='roster';
    s.p.forEach((pl,i)=>{
      const card = el('div',{class:'dossier'+(pl.e?' out':'')});
      const nameRow = el('div',{class:'pname'});
      nameRow.appendChild(el('span',{text:pl.n}));
      const jobId = (s.jobs||{})[i];
      if(!pl.e && jobId){
        const role = dutyRoleById(jobId);
        if(role) nameRow.appendChild(el('span',{class:'vote-count', text:role.name}));
      }
      card.appendChild(nameRow);
      for(let c=0;c<CATS.length;c++) card.appendChild(traitRow(c, pl.v[c], true, false));
      full.appendChild(card);
    });
    dossierPanel.appendChild(full);
    app.appendChild(dossierPanel);
    return;
  }

  if(s.ph==='assign'){
    document.body.classList.remove('vote-mode');
    document.getElementById('statusLine').textContent = 'бункер укомплектован · распределение обязанностей';
    const assignBanner = el('div',{class:'turn-banner'});
    assignBanner.appendChild(el('div',{html:'<span class="cursor">▮</span> Выбирает обязанность: <b>'+turnName+'</b>'}));
    assignBanner.appendChild(el('div',{class:'phase-pill', text:'РАСПРЕДЕЛЕНИЕ'}));
    app.appendChild(assignBanner);

    const introPanel = el('div',{class:'panel fade-in-up', 'data-tag':'Последний шаг'});
    introPanel.appendChild(el('p',{text:'Вы заняли все места в бункере. Прежде чем закрыть двери, распределите между собой обязанности — от этого зависит, выживет ли группа.'}));
    const rolesInfo = el('div',{class:'roster'});
    DUTY_ROLES.forEach(role=>{
      const takenIdx = Object.keys(s.jobs||{}).map(Number).find(i=>s.jobs[i]===role.id);
      const card = el('div',{class:'dossier'+(takenIdx!==undefined?' out':'')});
      card.appendChild(el('div',{class:'pname', text:role.name}));
      card.appendChild(el('p',{class:'tiny', text:role.desc}));
      if(takenIdx!==undefined) card.appendChild(el('p',{class:'tiny', style:'color:var(--amber)', text:'Занято: '+s.p[takenIdx].n}));
      rolesInfo.appendChild(card);
    });
    introPanel.appendChild(rolesInfo);
    app.appendChild(introPanel);

    if(myIdx===-1){
      app.appendChild(el('div',{class:'panel fade-in-up', 'data-tag':'Наблюдение', html:'<p class="tiny">Это устройство не привязано ни к одному из выживших, поэтому здесь только наблюдение за распределением обязанностей.</p>'}));
      return;
    }
    if(myIdx!==turnIdx){
      const waitPanel = el('div',{class:'panel fade-in-up', 'data-tag':'Действие'});
      waitPanel.appendChild(el('p',{class:'tiny', html:'Сейчас свою обязанность выбирает <b>'+turnName+'</b>. Экран обновится сам, когда очередь дойдёт до тебя.'}));
      app.appendChild(waitPanel);
      return;
    }

    const pickPanel = el('div',{class:'panel fade-in-up', 'data-tag':'Твой выбор'});
    const freeRoles = DUTY_ROLES.filter(role=>{
      return Object.keys(s.jobs||{}).map(Number).find(i=>s.jobs[i]===role.id) === undefined;
    });
    if(freeRoles.length===0){
      pickPanel.appendChild(el('p',{text:'Все обязанности уже заняты — ты остаёшься универсальным помощником, готовым подстраховать любого.'}));
      const okBtn = el('button',{class:'primary', text:'Понятно, дальше'});
      okBtn.onclick = ()=>{
        const next = JSON.parse(JSON.stringify(s));
        advanceAfterAssign(next);
        pushState(next);
      };
      pickPanel.appendChild(okBtn);
    } else {
      pickPanel.appendChild(el('p',{text:'Какую обязанность берёшь на себя?'}));
      const grid = el('div',{class:'cat-btn-grid'});
      freeRoles.forEach(role=>{
        const b = el('button',{text:role.name});
        b.title = role.desc;
        b.onclick = ()=>{
          const next = JSON.parse(JSON.stringify(s));
          next.jobs = next.jobs || {};
          next.jobs[myIdx] = role.id;
          advanceAfterAssign(next);
          pushState(next);
        };
        grid.appendChild(b);
      });
      pickPanel.appendChild(grid);
    }
    app.appendChild(pickPanel);
    return;
  }

  const isRevealLike = (s.ph==='reveal' || s.ph==='tiebreak');
  const isExtendTie = s.ph==='tiebreak' && s.tieReason==='extend';

  document.getElementById('statusLine').textContent =
    s.ph==='tiebreak' ? (isExtendTie ? 'группа попросила продлить раскрытие' : 'ничья при голосовании · доп. раскрытие')
    : (s.ph==='reveal' ? 'фаза раскрытия · раунд '+s.rd : 'фаза голосования · раунд '+s.rd);

  if(s.ph==='tiebreak'){
    const tieNote = el('div',{class:'panel fade-in-up', 'data-tag': isExtendTie ? 'Продление' : 'Ничья'});
    tieNote.appendChild(el('div',{class:'alert-ticker', html: isExtendTie
      ? '<b>ГРУППА ПОПРОСИЛА ВРЕМЯ.</b> Большинство проголосовавших выбрали продлить раскрытие вместо исключения. Каждый на своём ходу раскрывает ещё одну характеристику — после этого голосование начнётся снова.'
      : '<b>ГОЛОСА РАЗДЕЛИЛИСЬ ПОРОВНУ.</b> Никто не исключён. Каждый на своём ходу раскрывает ещё одну характеристику — после этого голосование начнётся снова.'
    }));
    app.appendChild(tieNote);
  }

  const banner = el('div',{class:'turn-banner'});
  banner.appendChild(el('div',{html:'<span class="cursor">▮</span> Ход игрока: <b>'+turnName+'</b>'}));
  banner.appendChild(el('div',{class:'phase-pill', text:
    s.ph==='tiebreak' ? (isExtendTie ? 'ПРОДЛЕНИЕ → РАСКРЫТИЕ' : 'НИЧЬЯ → РАСКРЫТИЕ')
    : (s.ph==='reveal' ? 'РАСКРЫТИЕ · Р.'+s.rd : 'ГОЛОСОВАНИЕ · Р.'+s.rd)
  }));
  app.appendChild(banner);

  const boardPanel = el('div',{class:'panel', 'data-tag':'Личные дела претендентов'});
  boardPanel.appendChild(renderRoster(s, {highlightTurn:true, ownIdx:myIdx}));
  app.appendChild(boardPanel);

  // ---- Место ещё не закреплено за этим устройством: показываем экран выбора личности,
  // без доступа к какой-либо панели действий и без возможности заглянуть в чужие данные ----
  if(myIdx === -1){
    const claimPanel = el('div',{class:'panel fade-in-up', 'data-tag':'Определение личности'});
    claimPanel.appendChild(el('p',{text:'Это устройство ещё не привязано ни к одному игроку в этой комнате. Выбери, кем из списка являешься именно ты — после этого место закрепится только за твоим браузером, и никто другой (включая тебя с другого устройства) не увидит твои скрытые характеристики.'}));
    const seatErr = el('div',{class:'error-msg', text:''});
    let anyFree = false;
    s.p.forEach((pl,i)=>{
      const taken = !!s.claims[i];
      if(!taken) anyFree = true;
      const row = el('div',{class:'row', style:'justify-content:space-between; padding:8px 0; border-bottom:1px dashed #2a303a;'});
      row.appendChild(el('span',{text:pl.n}));
      const btn = el('button',{class: taken ? 'ghost' : 'primary', text: taken ? 'Занято' : 'Это я'});
      if(taken){ btn.setAttribute('disabled','disabled'); }
      else{
        btn.onclick = ()=>{
          btn.setAttribute('disabled','disabled');
          claimSeat(code, i, myDeviceId).then(result=>{
            if(result==='taken'){
              seatErr.textContent = 'Кто-то успел выбрать это место на секунду раньше — выбери другого игрока.';
            }
          });
        };
      }
      row.appendChild(btn);
      claimPanel.appendChild(row);
    });
    if(!anyFree){
      claimPanel.appendChild(el('p',{class:'tiny', style:'margin-top:10px;', text:'Все места уже закреплены за другими устройствами. Если это твоё место — попроси того, кто его занял, нажать «Это не я (сбросить место)» в шапке комнаты.'}));
    }
    claimPanel.appendChild(seatErr);
    app.appendChild(claimPanel);
    return;
  }

  const iAmEliminated = s.p[myIdx].e;

  const actionPanel = el('div',{class:'panel fade-in-up', 'data-tag':'Действие'});
  const stamp = el('div',{class:'stamp', text:'ТВОЁ ДОСЬЕ'});
  actionPanel.appendChild(stamp);
  const own = el('div',{class:'panel', style:'background:#171a1f; padding:12px 14px; margin-bottom:14px;'});
  for(let c=0;c<CATS.length;c++) own.appendChild(traitRow(c, s.p[myIdx].v[c], true, false));
  actionPanel.appendChild(own);

  const actionArea = el('div',{id:'actionArea'});
  actionPanel.appendChild(actionArea);
  app.appendChild(actionPanel);

  if(iAmEliminated){
    actionArea.appendChild(el('p',{class:'tiny', text:'Ты выбыл(а) из игры. Можешь наблюдать за дальнейшим развитием событий, но действий больше нет.'}));
    return;
  }

  if(myIdx !== turnIdx){
    actionArea.appendChild(el('p',{class:'tiny', html:'Сейчас не твой ход. Ход игрока <b>'+turnName+'</b> — просто подожди, экран обновится сам.'}));
    return;
  }

  renderAbilityPanel(app, s, myIdx);

  const chosen = myIdx;

  if(isRevealLike){
    const mask = s.p[chosen].r;
    const hidden = [];
    for(let c=0;c<CATS.length;c++){ if(!((mask>>c)&1)) hidden.push(c); }

    if(hidden.length===0){
      actionArea.appendChild(el('p',{text:'У тебя уже раскрыто всё, что можно. Просто передай ход дальше.'}));
      const skipBtn = el('button',{class:'primary', text:'Передать ход →'});
      skipBtn.onclick = ()=>{
        const next = JSON.parse(JSON.stringify(s));
        advanceAfterReveal(next);
        pushState(next);
      };
      actionArea.appendChild(skipBtn);
    } else {
      actionArea.appendChild(el('p',{text:'Выбери, какую характеристику раскрыть для всех:'}));
      const grid = el('div',{class:'cat-btn-grid'});
      hidden.forEach(catIdx=>{
        const b = el('button',{text:CATS[catIdx]});
        b.onclick = ()=>{
          const next = JSON.parse(JSON.stringify(s));
          next.p[chosen].r = next.p[chosen].r | (1<<catIdx);
          advanceAfterReveal(next);
          pushState(next);
        };
        grid.appendChild(b);
      });
      actionArea.appendChild(grid);
    }

    if(s.ph==='reveal' && s.rd >= EARLY_VOTE_FROM_ROUND){
      actionArea.appendChild(el('div',{class:'tiny', style:'margin-top:10px;', text:'Можно предложить закончить раскрытие раньше срока:'}));
      const voteEarlyBtn = el('button',{class:'ghost', style:'margin-top:6px;', text:'Начать голосование досрочно'});
      voteEarlyBtn.onclick = ()=>{
        const next = JSON.parse(JSON.stringify(s));
        switchToVote(next);
        pushState(next);
      };
      actionArea.appendChild(voteEarlyBtn);
    }
  } else if(s.ph==='vote'){
    const activeCount = activeIdx(s).length;
    const extendCount = s.vt.filter(v=>v===-2).length;
    const extendNeeded = Math.ceil(activeCount/2);
    if(extendCount>0){
      actionArea.appendChild(el('p',{class:'tiny', text:'За продление раскрытия уже высказались: '+extendCount+' из '+extendNeeded+' нужных.'}));
    }
    actionArea.appendChild(el('label',{text:'За кого голосуешь на исключение?'}));
    const voteSel = el('select');
    voteSel.appendChild(el('option',{value:'', text:'Выберите игрока'}));
    s.p.forEach((pl,i)=>{
      if(!pl.e && i!==chosen) voteSel.appendChild(el('option',{value:i, text:pl.n}));
    });
    actionArea.appendChild(voteSel);
    const btn = el('button',{class:'danger', text:'Отдать голос'});
    btn.onclick = ()=>{
      const target = parseInt(voteSel.value);
      if(isNaN(target)){ return; }
      const next = JSON.parse(JSON.stringify(s));
      next.vt[chosen] = target;
      advanceAfterVote(next);
      pushState(next);
    };
    actionArea.appendChild(btn);

    actionArea.appendChild(el('div',{class:'tiny', style:'margin-top:12px;', text:'Не уверены, кого исключать? Можно вместо голоса предложить ещё один раунд раскрытия — если так выскажется больше половины ещё голосующих, исключения в этом раунде не будет.'}));
    const extendBtn = el('button',{class:'ghost', style:'margin-top:6px;', text:'Предложить продлить раскрытие'});
    extendBtn.onclick = ()=>{
      const next = JSON.parse(JSON.stringify(s));
      next.vt[chosen] = -2;
      advanceAfterVote(next);
      pushState(next);
    };
    actionArea.appendChild(extendBtn);
  }
}

/* ---------------- Boot ---------------- */

let booted = false;
function boot(){
  if(booted) return; // onAuthStateChanged может сработать повторно (напр. обновление токена)
  booted = true;
  const params = new URLSearchParams(location.search);
  const room = params.get('room');
  if(room){
    subscribeRoom(room.toUpperCase());
  } else {
    renderLobby();
  }
}

function renderAuthError(err){
  document.getElementById('statusLine').textContent = 'ошибка входа';
  const app = document.getElementById('app');
  app.innerHTML = '';
  const panel = el('div',{class:'panel', 'data-tag':'Не удалось подключиться'});
  panel.appendChild(el('div',{class:'config-warning', html:
    'Не получилось анонимно авторизоваться в Firebase (нужно для работы правил безопасности).<br><br>' +
    'Если это твой проект — открой Firebase Console → Authentication → Sign-in method и включи провайдер <b>Anonymous</b>. ' +
    'Техническая ошибка: <code>'+(err && err.message ? err.message : String(err))+'</code>'
  }));
  app.appendChild(panel);
}

initVfxCanvas();
if(!configOk){ renderConfigMissing(); }
</script>
