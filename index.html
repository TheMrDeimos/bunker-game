<style>
  :root{
    --bg-0:#111317;
    --bg-1:#191d23;
    --bg-2:#20252c;
    --panel:#1c2129;
    --line:#343c46;
    --amber:#e6b325;
    --amber-dim:#8a6c1f;
    --rust:#b5451f;
    --paper:#eee6d3;
    --muted:#8992a0;
    --green:#5c9a6b;
    --neon:#33f0ff;
    --red-alert:#ff3b3b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at top, var(--bg-1), var(--bg-0) 70%);
    color:var(--paper);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
    padding:0 0 60px 0;
    position:relative;
    overflow-x:hidden;
  }

  /* ---------- VFX canvas + CRT ---------- */
  #vfxCanvas{
    position:fixed; inset:0; width:100%; height:100%;
    z-index:0; pointer-events:none; opacity:.55; mix-blend-mode:screen;
  }
  .scanline-sweep{
    position:fixed; left:0; right:0; height:120px; top:-120px;
    background:linear-gradient(180deg, transparent, rgba(230,179,37,0.06), transparent);
    pointer-events:none; z-index:1;
    animation:sweep 7s linear infinite;
  }
  @keyframes sweep{0%{top:-120px;} 100%{top:100%;}}
  header.top, main, footer{position:relative; z-index:2;}

  .vote-alert-frame{
    position:fixed; inset:0; pointer-events:none; z-index:3;
    box-shadow: inset 0 0 0px 0px var(--red-alert);
    animation:none;
  }
  body.vote-mode .vote-alert-frame{
    animation: voteFramePulse 1.6s ease-in-out infinite;
  }
  @keyframes voteFramePulse{
    0%,100%{ box-shadow: inset 0 0 40px 4px rgba(255,59,59,0.15); }
    50%{ box-shadow: inset 0 0 90px 14px rgba(255,59,59,0.4); }
  }

  @keyframes fadeInUp{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  .fade-in-up{animation:fadeInUp .45s ease both;}

  @keyframes cardShake{
    0%,100%{transform:translate(0,0) rotate(0);}
    20%{transform:translate(-1px,0) rotate(-.2deg);}
    40%{transform:translate(1px,0) rotate(.2deg);}
    60%{transform:translate(-1px,1px) rotate(-.15deg);}
    80%{transform:translate(1px,-1px) rotate(.15deg);}
  }
  body.vote-mode .dossier:not(.out){animation:cardShake 3.2s ease-in-out infinite;}

  @keyframes revealFlash{
    0%{ background:rgba(230,179,37,0.55); color:#171a1f; transform:scaleY(0.2); }
    40%{ background:rgba(230,179,37,0.35); transform:scaleY(1.05); }
    100%{ background:transparent; transform:scaleY(1); }
  }
  .reveal-flash{ animation:revealFlash .7s ease both; border-radius:2px; }

  @media (prefers-reduced-motion: reduce){
    .fade-in-up, .reveal-flash, body.vote-mode .dossier, .scanline-sweep, body.vote-mode .vote-alert-frame{animation:none !important;}
  }

  .hazard{
    height:8px;
    width:100%;
    background:repeating-linear-gradient(135deg, var(--amber), var(--amber) 14px, #111 14px, #111 28px);
    position:relative; z-index:2;
  }
  header.top{
    padding:22px 20px 14px;
    max-width:900px;
    margin:0 auto;
    text-align:center;
  }
  h1.brand{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    letter-spacing:6px;
    font-size:clamp(28px,6vw,44px);
    margin:10px 0 4px;
    color:var(--paper);
  }
  h1.brand span{color:var(--amber);}
  .subbrand{
    font-size:12px;
    letter-spacing:3px;
    color:var(--muted);
    text-transform:uppercase;
  }
  main{
    max-width:900px;
    margin:0 auto;
    padding:10px 16px 0;
  }
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:2px;
    padding:20px;
    margin-bottom:18px;
    position:relative;
  }
  .panel::before{
    content:attr(data-tag);
    position:absolute;
    top:-10px;
    left:16px;
    background:var(--bg-0);
    padding:0 8px;
    font-size:11px;
    letter-spacing:2px;
    color:var(--amber);
    text-transform:uppercase;
  }
  .alert-ticker{
    background:#171a1f;
    border:1px solid var(--rust);
    color:#e8a08c;
    padding:12px 16px;
    font-size:13px;
    line-height:1.6;
    border-radius:2px;
  }
  .alert-ticker b{color:var(--amber);}
  .bunker-info{
    font-size:13px;
    color:var(--muted);
    margin-top:10px;
    line-height:1.6;
  }
  label{
    display:block;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:6px;
  }
  input[type=text]{
    width:100%;
    background:var(--bg-0);
    border:1px solid var(--line);
    color:var(--paper);
    padding:11px 12px;
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    border-radius:2px;
    margin-bottom:14px;
  }
  input[type=text]:focus{outline:none; border-color:var(--amber);}
  .grid6{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 16px;
  }
  @media(max-width:520px){.grid6{grid-template-columns:1fr;}}
  button{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    letter-spacing:2px;
    text-transform:uppercase;
    font-size:14px;
    padding:13px 20px;
    border-radius:2px;
    border:1px solid var(--amber);
    background:transparent;
    color:var(--amber);
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  button:hover{background:var(--amber); color:#171a1f;}
  button.primary{background:var(--amber); color:#171a1f;}
  button.primary:hover{background:#f3c545;}
  button.danger{border-color:var(--rust); color:#e8a08c;}
  button.danger:hover{background:var(--rust); color:#fff;}
  button.ghost{border-color:var(--muted); color:var(--muted);}
  button.ghost:hover{background:var(--muted); color:#171a1f;}
  button:disabled{opacity:.35; cursor:not-allowed;}
  button:disabled:hover{background:transparent; color:var(--amber);}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .cat-btn-grid{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0;}
  .cat-btn-grid button{font-size:12px; padding:10px 14px;}
  .turn-banner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:linear-gradient(90deg, rgba(230,179,37,0.13), transparent);
    border-left:3px solid var(--amber);
    padding:14px 16px;
    margin-bottom:18px;
    font-family:'Oswald', sans-serif;
    letter-spacing:1px;
  }
  body.vote-mode .turn-banner{
    border-left-color:var(--red-alert);
    background:linear-gradient(90deg, rgba(255,59,59,0.14), transparent);
  }
  .turn-banner .cursor{animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  @media (prefers-reduced-motion: reduce){.turn-banner .cursor{animation:none;}}
  .phase-pill{
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:#171a1f;
    background:var(--amber);
    padding:3px 10px;
    border-radius:20px;
    white-space:nowrap;
  }
  body.vote-mode .phase-pill{background:var(--red-alert); color:#fff;}
  .roster{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px,1fr));
    gap:14px;
  }
  .dossier{
    background:var(--bg-0);
    border:1px solid var(--line);
    border-radius:2px;
    padding:14px 14px 16px;
    position:relative;
    overflow:hidden;
  }
  .dossier.out{opacity:.4;}
  .dossier.out::after{
    content:"ИСКЛЮЧЁН(А)";
    position:absolute;
    top:40%;
    left:-15%;
    width:130%;
    text-align:center;
    transform:rotate(-8deg);
    background:var(--rust);
    color:#fff;
    font-family:'Oswald',sans-serif;
    letter-spacing:3px;
    font-size:12px;
    padding:4px 0;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .dossier.active-turn{border-color:var(--amber); box-shadow:0 0 0 1px var(--amber) inset;}
  body.vote-mode .dossier.active-turn{
    border-color:var(--neon);
    box-shadow:0 0 12px 1px var(--neon), 0 0 0 1px var(--neon) inset;
  }
  .dossier .pname{
    font-family:'Oswald', sans-serif;
    font-size:17px;
    letter-spacing:1px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .trait-row{
    display:flex;
    gap:8px;
    align-items:baseline;
    font-size:12.5px;
    padding:4px 0;
    border-bottom:1px dashed #2a303a;
  }
  .trait-row:last-child{border-bottom:none;}
  .trait-cat{color:var(--muted); min-width:118px; flex-shrink:0;}
  .trait-val{color:var(--paper);}
  .redacted{
    background:repeating-linear-gradient(135deg,#000,#000 4px,#151515 4px,#151515 8px);
    color:transparent;
    border-radius:2px;
    padding:1px 6px;
    user-select:none;
  }
  .vote-count{
    font-size:11px;
    color:var(--amber);
  }
  body.vote-mode .vote-count{color:var(--red-alert);}
  .own-card{
    border:1px solid var(--amber);
    background:#1a1710;
  }
  .stamp{
    display:inline-block;
    border:2px solid var(--rust);
    color:#e8a08c;
    font-family:'Oswald',sans-serif;
    letter-spacing:3px;
    padding:3px 10px;
    transform:rotate(-4deg);
    font-size:11px;
    margin-bottom:10px;
    border-radius:3px;
  }
  select{
    width:100%;
    background:var(--bg-0);
    border:1px solid var(--line);
    color:var(--paper);
    padding:11px 12px;
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    border-radius:2px;
    margin-bottom:14px;
  }
  .linkbox{
    background:var(--bg-0);
    border:1px solid var(--line);
    padding:10px 12px;
    font-size:11.5px;
    word-break:break-all;
    color:var(--muted);
    border-radius:2px;
    margin:10px 0;
    max-height:70px;
    overflow-y:auto;
  }
  .copied-msg{color:var(--green); font-size:12px; margin-left:8px;}
  details{margin-bottom:18px;}
  summary{
    cursor:pointer;
    font-family:'Oswald',sans-serif;
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-size:13px;
    color:var(--muted);
  }
  details[open] summary{color:var(--amber);}
  .rules-body{font-size:13px; line-height:1.7; color:var(--muted); padding-top:10px;}
  .rules-body b{color:var(--paper);}
  .final-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .final-item{
    background:var(--bg-0);
    border:1px solid var(--green);
    padding:12px 14px;
    border-radius:2px;
    font-family:'Oswald',sans-serif;
    letter-spacing:1px;
    font-size:16px;
  }
  .tiny{font-size:11px; color:var(--muted);}
  footer{
    text-align:center;
    color:#4a5260;
    font-size:11px;
    padding:30px 20px 10px;
  }
  .tabs{display:flex; gap:0; margin-bottom:16px; border-bottom:1px solid var(--line);}
  .tab{
    padding:10px 18px;
    font-family:'Oswald',sans-serif;
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-size:13px;
    color:var(--muted);
    cursor:pointer;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }
  .tab.active{color:var(--amber); border-bottom-color:var(--amber);}
  .room-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--bg-0);
    border:1px solid var(--amber-dim);
    padding:5px 12px;
    border-radius:20px;
    font-size:12px;
    letter-spacing:1px;
    color:var(--amber);
    margin-top:8px;
  }
  .dot-live{
    width:7px; height:7px; border-radius:50%;
    background:var(--green);
    box-shadow:0 0 6px var(--green);
  }
  .code-display{
    font-family:'Oswald',sans-serif;
    font-size:34px;
    letter-spacing:8px;
    color:var(--amber);
    text-align:center;
    padding:14px 0;
  }
  .error-msg{color:#e8a08c; font-size:13px; margin-top:6px;}
  .config-warning{
    background:#241a12;
    border:1px solid var(--rust);
    color:#f0c4a0;
    padding:16px;
    font-size:13px;
    line-height:1.7;
    border-radius:2px;
  }
</style>
</head>

  "Бункер рассчитан на 3 человек. Запасов еды и воды хватит на 6 месяцев.",
  "Бункер рассчитан на 3 человек. Есть система очистки воздуха, но еды в обрез.",
  "Бункер рассчитан на 3 человек. Автономный генератор, ограниченный запас медикаментов.",
  "Бункер рассчитан на 3 человек. Тесно, но безопасно минимум на год."
];

const ALL_CATS_MASK = (1 << CATS.length) - 1;
const MAX_REVEAL_ROUNDS = 5;   // после стольких полных раундов раскрытие принудительно уходит в голосование
const EARLY_VOTE_FROM_ROUND = 3; // с этого раунда доступна кнопка "начать голосование досрочно"
const MIN_PLAYERS = 4; // меньше — и бункер (на 3 места) сразу окажется полным без единого голосования

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function randInt(min,max){return min + Math.floor(Math.random()*(max-min+1));}

function activeIdx(s){
  return s.p.map((pl,i)=>i).filter(i=>!s.p[i].e);
}
function currentTurnPlayer(s){
  const act = activeIdx(s);
  if(act.length===0) return -1;
  return act[s.tp % act.length];
}

function makeGame(names){
  const pooled = {};
  POOL_CAT_IDX.forEach(catIdx=>{ pooled[catIdx] = shuffle(POOLS[catIdx]).slice(0, names.length); });
  const players = names.map((n,i)=>{
    const v = new Array(CATS.length);
    POOL_CAT_IDX.forEach(catIdx=>{ v[catIdx] = pooled[catIdx][i]; });
    v[6] = pick(GENDERS);
    v[7] = randInt(18,70) + " лет";
    v[8] = pick(ORIENTATIONS);
    return { n, v, r:0, e:false };
  });
  const cata = pick(CATASTROPHES);
  return {
    p:players,
    c:cata.t,
    cx:cata.fx,
    b:pick(BUNKERS),
    ph:"reveal",
    rd:1,
    tp:0,
    vt:new Array(names.length).fill(-1),
    claims:new Array(names.length).fill(null)
  };
}

/* ---------------- Раскрытие ---------------- */

function advanceAfterReveal(s){
  s.tp++;
  const act = activeIdx(s);
  if(s.tp >= act.length){
    s.tp = 0;
    s.rd++;
    if(s.rd > MAX_REVEAL_ROUNDS){
      switchToVote(s);
    }
  }
}

function switchToVote(s){
  s.ph = "vote";
  s.rd = 1;
  s.tp = 0;
  s.vt = new Array(s.p.length).fill(-1);
}

/* ---------------- Голосование ---------------- */

function tallyAndEliminate(s){
  const counts = {};
  s.vt.forEach(t=>{ if(t !== -1 && t !== null && t !== undefined) counts[t]=(counts[t]||0)+1; });
  let maxV=-1, target=null;
  Object.keys(counts).forEach(k=>{
    if(counts[k]>maxV){maxV=counts[k]; target=parseInt(k);}
  });
  if(target!==null){ s.p[target].e = true; }
  s.vt = new Array(s.p.length).fill(-1);
  s.tp = 0;
  const act = activeIdx(s);
  if(act.length <= 3){
    s.ph = "end";
  } else {
    s.rd++;
  }
  return target;
}

function advanceAfterVote(s){
  s.tp++;
  const act = activeIdx(s);
  if(s.tp >= act.length){
    return tallyAndEliminate(s);
  }
  return null;
}

/* ---------------- Firebase wiring ---------------- */

let db = null;
const configOk = firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf("ВСТАВЬ") === -1;
if(configOk){
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
}

let currentRoom = null;
let currentOffFn = null;
const prevRevealMasks = {}; // отслеживаем предыдущие битовые маски раскрытия для анимации "вспышки"

function genRoomCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";
  for(let i=0;i<4;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}

function roomLink(code){
  return location.origin + location.pathname + '?room=' + code;
}

function subscribeRoom(code){
  if(currentOffFn) currentOffFn();
  currentRoom = code;
  const ref = db.ref('rooms/'+code);
  const handler = (snap)=>{
    const s = snap.val();
    if(!s){ renderRoomMissing(code); return; }
    // старые комнаты, созданные до появления системы "мест", могли не иметь claims — добьём поле один раз
    if(!Array.isArray(s.claims) || s.claims.length !== s.p.length){
      const fixed = new Array(s.p.length).fill(null);
      (s.claims||[]).forEach((v,i)=>{ if(i<fixed.length) fixed[i] = v || null; });
      db.ref('rooms/'+code+'/claims').set(fixed);
      s.claims = fixed;
    }
    renderGame(s, code);
  };
  ref.on('value', handler);
  currentOffFn = ()=> ref.off('value', handler);
}

function pushState(s){
  db.ref('rooms/'+currentRoom).set(s);
}

/* ---------------- Идентификация игрока на этом устройстве ---------------- */
// Каждый браузер получает свой случайный deviceId, который сохраняется локально.
// Место (индекс игрока) в конкретной комнате привязывается к deviceId через
// Firebase-транзакцию, поэтому дважды "занять" одно и то же место с разных
// устройств нельзя, а посмотреть чужие раскрытые-в-своей-голове характеристики
// через выбор чужого имени в списке больше невозможно — такого списка нет.
function getDeviceId(){
  let id = null;
  try{ id = localStorage.getItem('bunker_device_id'); }catch(e){}
  if(!id){
    id = 'dev_' + Math.random().toString(36).slice(2) + '_' + Date.now().toString(36);
    try{ localStorage.setItem('bunker_device_id', id); }catch(e){}
  }
  return id;
}
const myDeviceId = getDeviceId();

function myPlayerIdx(s){
  if(!Array.isArray(s.claims)) return -1;
  return s.claims.findIndex(c=>c===myDeviceId);
}

// Возвращает Promise: 'ok' | 'taken'
function claimSeat(code, idx, deviceId){
  return db.ref('rooms/'+code+'/claims/'+idx).transaction(current=>{
    if(current===null || current===undefined) return deviceId;
    return; // не трогаем — место уже занято (abort)
  }).then(result=>{
    if(result.committed && result.snapshot.val()===deviceId) return 'ok';
    return 'taken';
  });
}

function releaseSeat(code, idx){
  db.ref('rooms/'+code+'/claims/'+idx).set(null);
}

/* ---------------- DOM helpers ---------------- */

function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==="html") e.innerHTML=v;
    else if(k==="text") e.textContent=v;
    else e.setAttribute(k,v);
  });
  (Array.isArray(children)?children:[children]).forEach(c=>{ if(c) e.appendChild(c); });
  return e;
}

function traitRow(catIdx, value, revealed, justRevealed){
  const row = el('div',{class:'trait-row'+(justRevealed?' reveal-flash':'')});
  row.appendChild(el('span',{class:'trait-cat', text:CATS[catIdx]}));
  if(revealed){
    row.appendChild(el('span',{class:'trait-val', text:value}));
  } else {
    row.appendChild(el('span',{class:'redacted', text:value}));
  }
  return row;
}

function renderRoster(s, opts={}){
  const roster = el('div',{class:'roster'});
  s.p.forEach((pl,i)=>{
    const isTurn = !pl.e && i===currentTurnPlayer(s) && opts.highlightTurn;
    const isOwn = opts.ownIdx===i;
    const card = el('div',{class:'dossier fade-in-up'+(pl.e?' out':'')+(isTurn?' active-turn':'')+(isOwn?' own-card':'')});
    const nameRow = el('div',{class:'pname'});
    nameRow.appendChild(el('span',{text:pl.n}));
    if(s.ph==='vote' && !pl.e){
      const vc = s.vt.filter(t=>t===i).length;
      if(vc>0) nameRow.appendChild(el('span',{class:'vote-count', text:vc+' ГОЛОС(А)'}));
    }
    card.appendChild(nameRow);
    const prevMask = prevRevealMasks[i] !== undefined ? prevRevealMasks[i] : pl.r;
    for(let c=0;c<CATS.length;c++){
      const revealed = isOwn ? true : !!((pl.r>>c)&1);
      const wasRevealed = !!((prevMask>>c)&1);
      const justRevealed = !isOwn && revealed && !wasRevealed;
      card.appendChild(traitRow(c, pl.v[c], revealed, justRevealed));
    }
    roster.appendChild(card);
  });
  s.p.forEach((pl,i)=>{ prevRevealMasks[i] = pl.r; });
  return roster;
}

function roomBadgeRow(code){
  const wrap = el('div',{class:'row', style:'justify-content:space-between; align-items:center;'});
  const badge = el('div',{class:'room-badge'});
  badge.appendChild(el('span',{class:'dot-live'}));
  badge.appendChild(el('span',{text:'КОМНАТА '+code+' · ОНЛАЙН'}));
  wrap.appendChild(badge);
  const btn = el('button',{text:'Скопировать ссылку-приглашение'});
  const msg = el('span',{class:'copied-msg', text:''});
  btn.onclick = async ()=>{
    try{ await navigator.clipboard.writeText(roomLink(code)); msg.textContent='✓ скопировано'; }
    catch(e){ msg.textContent = roomLink(code); }
  };
  const right = el('div',{class:'row'},[btn, msg]);
  wrap.appendChild(right);
  return wrap;
}

/* ---------------- VFX canvas ---------------- */

let vfxCtx = null, vfxCanvasEl = null, vfxParticles = [], vfxType = null, vfxRaf = null;

function initVfxCanvas(){
  vfxCanvasEl = document.getElementById('vfxCanvas');
  vfxCtx = vfxCanvasEl.getContext('2d');
  resizeVfx();
  window.addEventListener('resize', resizeVfx);
  loopVfx();
}
function resizeVfx(){
  if(!vfxCanvasEl) return;
  vfxCanvasEl.width = window.innerWidth;
  vfxCanvasEl.height = window.innerHeight;
}
function seedParticles(type){
  const W = vfxCanvasEl.width, H = vfxCanvasEl.height;
  const count = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 70;
  vfxParticles = [];
  for(let i=0;i<count;i++){
    vfxParticles.push({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*2.4+0.8,
      vy:Math.random()*0.6+0.3,
      vx:(Math.random()-0.5)*0.4,
      alpha:Math.random()*0.6+0.3,
      phase:Math.random()*Math.PI*2
    });
  }
}
function setVfx(type){
  if(vfxType === type) return;
  vfxType = type;
  seedParticles(type);
}
function colorForType(type){
  switch(type){
    case 'ash': return ['180,170,160','230,110,40'];
    case 'snow': return ['255,255,255','170,210,255'];
    case 'spores': return ['110,230,140','60,180,90'];
    case 'glitch': return ['80,255,170','160,255,220'];
    case 'embers': return ['255,170,60','255,90,40'];
    default: return ['230,179,37','200,140,20'];
  }
}
function loopVfx(){
  vfxRaf = requestAnimationFrame(loopVfx);
  if(!vfxCtx) return;
  const W = vfxCanvasEl.width, H = vfxCanvasEl.height;
  vfxCtx.clearRect(0,0,W,H);
  if(!vfxType) return;
  const [c1,c2] = colorForType(vfxType);

  if(vfxType === 'glitch'){
    // зелёный туман + случайные горизонтальные полосы искажения
    vfxCtx.fillStyle = 'rgba('+c1+',0.05)';
    vfxCtx.fillRect(0,0,W,H);
    if(Math.random() < 0.18){
      const y = Math.random()*H;
      const h = 4 + Math.random()*18;
      vfxCtx.fillStyle = 'rgba('+c2+',0.18)';
      vfxCtx.fillRect(0, y, W, h);
    }
    vfxParticles.forEach(p=>{
      p.x += Math.sin(p.phase)*0.6;
      p.phase += 0.02;
      p.y += p.vy*0.3;
      if(p.y>H) p.y=0;
      vfxCtx.fillStyle = 'rgba('+c1+','+p.alpha*0.5+')';
      vfxCtx.fillRect(p.x, p.y, 1.5, 1.5);
    });
    return;
  }

  vfxParticles.forEach(p=>{
    p.y += p.vy * (vfxType==='snow'?0.8:1.2);
    p.x += p.vx + (vfxType==='spores' ? Math.sin(p.phase)*0.3 : 0);
    p.phase += 0.03;
    if(p.y > H){ p.y = -5; p.x = Math.random()*W; }
    if(p.x > W) p.x = 0;
    if(p.x < 0) p.x = W;
    const col = (vfxType==='embers' && Math.random()<0.02) ? c2 : c1;
    vfxCtx.beginPath();
    vfxCtx.fillStyle = 'rgba('+col+','+p.alpha+')';
    vfxCtx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    vfxCtx.fill();
  });
}

function renderGame(s, code){
  setVfx(s.cx || null);
  document.body.classList.toggle('vote-mode', s.ph === 'vote');

  const app = document.getElementById('app');
  app.innerHTML = '';

  const myIdx = myPlayerIdx(s);

  const badgePanel = el('div',{class:'panel', style:'padding:12px 20px;'});
  badgePanel.appendChild(roomBadgeRow(code));
  if(myIdx>=0){
    const idRow = el('div',{class:'row', style:'margin-top:10px; justify-content:space-between;'});
    idRow.appendChild(el('div',{class:'tiny', html:'Ты играешь за: <b style="color:var(--amber)">'+s.p[myIdx].n+'</b>'}));
    const resetBtn = el('button',{class:'ghost', style:'font-size:11px; padding:8px 12px;', text:'Это не я (сбросить место)'});
    resetBtn.onclick = ()=>{ if(confirm('Освободить это место? Придётся выбрать его заново.')) releaseSeat(code, myIdx); };
    idRow.appendChild(resetBtn);
    badgePanel.appendChild(idRow);
  }
  app.appendChild(badgePanel);

  const alertPanel = el('div',{class:'panel fade-in-up', 'data-tag':'Сводка ситуации'});
  alertPanel.appendChild(el('div',{class:'alert-ticker', html:'<b>ТРЕВОГА:</b> '+s.c}));
  alertPanel.appendChild(el('div',{class:'bunker-info', text:s.b}));
  app.appendChild(alertPanel);

  if(s.ph==='end'){
    document.getElementById('statusLine').textContent = 'симуляция завершена';
    document.body.classList.remove('vote-mode');
    const panel = el('div',{class:'panel fade-in-up', 'data-tag':'Итог'});
    panel.appendChild(el('h3',{text:'Двери бункера закрыты.', style:'font-family:Oswald,sans-serif; letter-spacing:1px;'}));
    const list = el('div',{class:'final-list'});
    s.p.forEach((pl,i)=>{ if(!pl.e) list.appendChild(el('div',{class:'final-item', text:'✓ '+pl.n})); });
    panel.appendChild(list);
    app.appendChild(panel);

    const dossierPanel = el('div',{class:'panel fade-in-up','data-tag':'Полное досье'});
    const full = document.createElement('div');
    full.className='roster';
    s.p.forEach(pl=>{
      const card = el('div',{class:'dossier'+(pl.e?' out':'')});
      card.appendChild(el('div',{class:'pname', text:pl.n}));
      for(let c=0;c<CATS.length;c++) card.appendChild(traitRow(c, pl.v[c], true, false));
      full.appendChild(card);
    });
    dossierPanel.appendChild(full);
    app.appendChild(dossierPanel);
    return;
  }

  const turnIdx = currentTurnPlayer(s);
  const turnName = turnIdx>=0 ? s.p[turnIdx].n : '—';

  document.getElementById('statusLine').textContent =
    (s.ph==='reveal' ? 'фаза раскрытия · раунд '+s.rd : 'фаза голосования · раунд '+s.rd);

  const banner = el('div',{class:'turn-banner'});
  banner.appendChild(el('div',{html:'<span class="cursor">▮</span> Ход игрока: <b>'+turnName+'</b>'}));
  banner.appendChild(el('div',{class:'phase-pill', text: s.ph==='reveal' ? 'РАСКРЫТИЕ · Р.'+s.rd : 'ГОЛОСОВАНИЕ · Р.'+s.rd}));
  app.appendChild(banner);

  const boardPanel = el('div',{class:'panel', 'data-tag':'Личные дела претендентов'});
  boardPanel.appendChild(renderRoster(s, {highlightTurn:true, ownIdx:myIdx}));
  app.appendChild(boardPanel);

  // ---- Место ещё не закреплено за этим устройством: показываем экран выбора личности,
  // без доступа к какой-либо панели действий и без возможности заглянуть в чужие данные ----
  if(myIdx === -1){
    const claimPanel = el('div',{class:'panel fade-in-up', 'data-tag':'Определение личности'});
    claimPanel.appendChild(el('p',{text:'Это устройство ещё не привязано ни к одному игроку в этой комнате. Выбери, кем из списка являешься именно ты — после этого место закрепится только за твоим браузером, и никто другой (включая тебя с другого устройства) не увидит твои скрытые характеристики.'}));
    const seatErr = el('div',{class:'error-msg', text:''});
    let anyFree = false;
    s.p.forEach((pl,i)=>{
      const taken = !!s.claims[i];
      if(!taken) anyFree = true;
      const row = el('div',{class:'row', style:'justify-content:space-between; padding:8px 0; border-bottom:1px dashed #2a303a;'});
      row.appendChild(el('span',{text:pl.n}));
      const btn = el('button',{class: taken ? 'ghost' : 'primary', text: taken ? 'Занято' : 'Это я'});
      if(taken){ btn.setAttribute('disabled','disabled'); }
      else{
        btn.onclick = ()=>{
          btn.setAttribute('disabled','disabled');
          claimSeat(code, i, myDeviceId).then(result=>{
            if(result==='taken'){
              seatErr.textContent = 'Кто-то успел выбрать это место на секунду раньше — выбери другого игрока.';
            }
          });
        };
      }
      row.appendChild(btn);
      claimPanel.appendChild(row);
    });
    if(!anyFree){
      claimPanel.appendChild(el('p',{class:'tiny', style:'margin-top:10px;', text:'Все места уже закреплены за другими устройствами. Если это твоё место — попроси того, кто его занял, нажать «Это не я (сбросить место)» в шапке комнаты.'}));
    }
    claimPanel.appendChild(seatErr);
    app.appendChild(claimPanel);
    return;
  }

  const iAmEliminated = s.p[myIdx].e;

  const actionPanel = el('div',{class:'panel fade-in-up', 'data-tag':'Действие'});
  const stamp = el('div',{class:'stamp', text:'ТВОЁ ДОСЬЕ'});
  actionPanel.appendChild(stamp);
  const own = el('div',{class:'panel', style:'background:#171a1f; padding:12px 14px; margin-bottom:14px;'});
  for(let c=0;c<CATS.length;c++) own.appendChild(traitRow(c, s.p[myIdx].v[c], true, false));
  actionPanel.appendChild(own);

  const actionArea = el('div',{id:'actionArea'});
  actionPanel.appendChild(actionArea);
  app.appendChild(actionPanel);

  if(iAmEliminated){
    actionArea.appendChild(el('p',{class:'tiny', text:'Ты выбыл(а) из игры. Можешь наблюдать за дальнейшим развитием событий, но действий больше нет.'}));
    return;
  }

  if(myIdx !== turnIdx){
    actionArea.appendChild(el('p',{class:'tiny', html:'Сейчас не твой ход. Ход игрока <b>'+turnName+'</b> — просто подожди, экран обновится сам.'}));
    return;
  }

  const chosen = myIdx;

  if(s.ph==='reveal'){
    const mask = s.p[chosen].r;
    const hidden = [];
    for(let c=0;c<CATS.length;c++){ if(!((mask>>c)&1)) hidden.push(c); }

    if(hidden.length===0){
      actionArea.appendChild(el('p',{text:'У тебя уже раскрыто всё, что можно. Просто передай ход дальше.'}));
      const skipBtn = el('button',{class:'primary', text:'Передать ход →'});
      skipBtn.onclick = ()=>{
        const next = JSON.parse(JSON.stringify(s));
        advanceAfterReveal(next);
        pushState(next);
      };
      actionArea.appendChild(skipBtn);
    } else {
      actionArea.appendChild(el('p',{text:'Выбери, какую характеристику раскрыть для всех:'}));
      const grid = el('div',{class:'cat-btn-grid'});
      hidden.forEach(catIdx=>{
        const b = el('button',{text:CATS[catIdx]});
        b.onclick = ()=>{
          const next = JSON.parse(JSON.stringify(s));
          next.p[chosen].r = next.p[chosen].r | (1<<catIdx);
          advanceAfterReveal(next);
          pushState(next);
        };
        grid.appendChild(b);
      });
      actionArea.appendChild(grid);
    }

    if(s.rd >= EARLY_VOTE_FROM_ROUND){
      actionArea.appendChild(el('div',{class:'tiny', style:'margin-top:10px;', text:'Можно предложить закончить раскрытие раньше срока:'}));
      const voteEarlyBtn = el('button',{class:'ghost', style:'margin-top:6px;', text:'Начать голосование досрочно'});
      voteEarlyBtn.onclick = ()=>{
        const next = JSON.parse(JSON.stringify(s));
        switchToVote(next);
        pushState(next);
      };
      actionArea.appendChild(voteEarlyBtn);
    }
  } else if(s.ph==='vote'){
    actionArea.appendChild(el('label',{text:'За кого голосуешь на исключение?'}));
    const voteSel = el('select');
    voteSel.appendChild(el('option',{value:'', text:'Выберите игрока'}));
    s.p.forEach((pl,i)=>{
      if(!pl.e && i!==chosen) voteSel.appendChild(el('option',{value:i, text:pl.n}));
    });
    actionArea.appendChild(voteSel);
    const btn = el('button',{class:'danger', text:'Отдать голос'});
    btn.onclick = ()=>{
      const target = parseInt(voteSel.value);
      if(isNaN(target)){ return; }
      const next = JSON.parse(JSON.stringify(s));
      next.vt[chosen] = target;
      advanceAfterVote(next);
      pushState(next);
    };
    actionArea.appendChild(btn);
  }
}

/* ---------------- Boot ---------------- */

function boot(){
  initVfxCanvas();
  if(!configOk){ renderConfigMissing(); return; }
  const params = new URLSearchParams(location.search);
  const room = params.get('room');
  if(room){
    subscribeRoom(room.toUpperCase());
  } else {
    renderLobby();
  }
}

boot();
</script>
</body>
</html>
